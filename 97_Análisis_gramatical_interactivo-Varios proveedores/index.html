        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #050505;
            --bg-secondary: #0f0f0f;
            --bg-tertiary: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #cccccc;
            --accent-primary: #6366f1;
            --accent-secondary: #8b5cf6;
            --border-color: #2a2a2a;
            --highlight-text-color: #ef4444;
            --correct-color: #22c55e;
            --incorrect-color: #ef4444;
        }
        
        body.light-mode {
            --bg-primary: #f9fafb;
            --bg-secondary: #f3f4f6;
            --bg-tertiary: #ffffff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border-color: #d1d5db;
            --highlight-text-color: #dc2626;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .header, .chat-messages, .chat-input-container, .settings-container select, .chat-input, .ai-message .message-content {
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        .header {
            padding: 2rem;
            background: linear-gradient(135deg, var(--bg-secondary), var(--bg-tertiary));
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .header-branding {
            display: grid;
            grid-template-columns: minmax(100px, 1fr) auto minmax(100px, 1fr);
            align-items: center;
            gap: 20px;
        }

        .header-logo {
            display: block;
            width: auto;
            height: 57.6px;
            max-width: 100%;
            object-fit: contain;
        }

        .header-logo:last-child {
            justify-self: end;
        }

        .ai-title {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            transition: all 0.3s ease;
        }

        @media (max-width: 600px) {
            .header-branding {
                grid-template-columns: 64px minmax(0, 1fr) 64px;
                gap: 8px;
            }

            .header-logo {
                height: 41.6px;
            }

            .ai-title {
                font-size: 1.45rem;
            }
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 2rem auto;
            padding: 0 2rem;
            width: 100%;
        }

        .chat-messages {
            flex: 1;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 1rem 1rem 0 0;
            padding: 1.5rem;
            overflow-y: auto;
            min-height: 400px;
            max-height: 70vh;
        }

        .message { margin-bottom: 1rem; }
        .message-content { padding: 0.75rem 1rem; border-radius: 0.5rem; width: 100%; }
        .ai-message .message-content { background: var(--bg-tertiary); border: 1px solid var(--border-color); }
        .user-message { display: flex; justify-content: flex-end; }
        .user-message .message-content { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; max-width: 80%; }

        .settings-container { display: flex; justify-content: center; align-items: center; gap: 1rem; margin: 0 auto 1rem auto; color: var(--text-secondary); font-size: 0.9rem; flex-wrap: wrap; }
        .settings-group { display: flex; align-items: center; gap: 0.5rem; }
        .settings-container select { padding: 0.5rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.375rem; color: var(--text-primary); font-family: inherit; font-size: 0.9rem; }
        #colorPaletteBtn { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; border: none; cursor: pointer; padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.9rem; transition: all 0.3s ease; }
        #colorPaletteBtn:hover { transform: translateY(-1px); }
        #videoToggle { accent-color: var(--accent-primary); cursor: pointer; }
        .settings-container label { cursor: pointer; }

        .chat-input-container { display: flex; gap: 0.5rem; padding: 1rem; background: var(--bg-secondary); border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 1rem 1rem; }
        .chat-input { flex: 1; padding: 0.75rem; background: var(--bg-primary); border: 1px solid var(--border-color); border-radius: 0.5rem; color: var(--text-primary); font-family: inherit; }
        .chat-input:focus { outline: none; border-color: var(--accent-primary); }
        .send-btn { padding: 0.75rem 1.5rem; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.3s ease; }
        .send-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2); }

        .message { display: flex; gap: 0.75rem; align-items: flex-start; }
        .user-message { flex-direction: row-reverse; }
        .message-avatar { flex-shrink: 0; width: 40px; height: 40px; }
        .message-avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 2px solid var(--border-color); }

        .video-display-container { margin-bottom: 1.5rem; }
        .video-display-container video { width: 100%; border-radius: 0.5rem; border: 1px solid var(--border-color); background-color: #000; }
        .rich-text-content { line-height: 1.7; }
        .generated-paragraph { margin: 0.75rem 0 1.5rem 0; padding: 1rem; border-left: 3px solid var(--accent-primary); background: var(--bg-primary); text-align: justify; border-radius: 0 0.5rem 0.5rem 0; }
        
        .game-container { margin-top: 1.5rem; border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1rem; }
        .game-instruction { text-align: center; font-weight: 600; font-size: 1.1rem; margin-bottom: 1rem; color: var(--accent-secondary); }
        .word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 0.75rem; }
        .word-button { padding: 1rem; font-size: 1.1rem; font-weight: 500; border: 1px solid var(--border-color); border-radius: 0.375rem; background-color: var(--bg-tertiary); color: var(--text-primary); cursor: pointer; transition: all 0.2s ease; }
        .word-button:hover { border-color: var(--accent-primary); }
        .word-button.selected { background-color: var(--accent-primary); color: white; border-color: var(--accent-secondary); }
        
        .game-container.graded .word-button.correct.selected { background-color: var(--correct-color); border-color: var(--correct-color); color: white; }
        .game-container.graded .word-button.incorrect.selected { background-color: var(--incorrect-color); border-color: var(--incorrect-color); color: white; }
        .game-container.graded .word-button.correct:not(.selected) { border: 2px solid var(--correct-color); background-color: transparent; }
        .game-container.graded .word-button { cursor: default; }

        .game-actions { margin-top: 1rem; text-align: center; }
        .game-btn { padding: 0.75rem 1.5rem; border: none; border-radius: 0.5rem; cursor: pointer; font-weight: 500; transition: all 0.3s ease; }
        .verify-btn { background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: white; }
        .next-btn { background-color: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }

        .game-result { margin-top: 1rem; padding: 0.75rem; border-radius: 0.375rem; background-color: var(--bg-primary); font-size: 1rem; text-align: center; font-weight: 600; }
        .final-score-container { margin-top: 1.5rem; padding: 1.5rem; border-radius: 0.5rem; background-color: var(--bg-tertiary); border: 1px solid var(--accent-primary); text-align: center; font-size: 1.2rem; font-weight: 600; }
        
        .analysis-actions { margin-top: 1.5rem; text-align: center; }
        .download-btn { padding: 0.75rem 1.5rem; background: var(--bg-tertiary); border: 1px solid var(--border-color); color: var(--text-primary); border-radius: 0.5rem; cursor: pointer; font-weight: 500; }
        .download-btn:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2); border-color: var(--accent-primary); }

        .site-footer { padding: 1.5rem 1rem; text-align: center; font-size: 0.875rem; color: var(--text-secondary); border-top: 1px solid var(--border-color); margin-top: 2rem; }

        .api-key-container {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            background: var(--bg-tertiary);
            padding: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            margin: 0.5rem 0;
        }

        #apiKeyInput {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 0.375rem;
            padding: 0.4rem 0.6rem;
            color: var(--text-primary);
            font-size: 0.85rem;
            flex: 1;
            min-width: 120px;
        }

        #getApiKeyBtn {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: white;
            border: none;
            cursor: pointer;
            padding: 0.4rem 0.8rem;
            border-radius: 0.375rem;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        #getApiKeyBtn:hover {
            transform: translateY(-1px);
            opacity: 0.9;
        }

        .avatar-loading { opacity: 0.5; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 0.8; } 100% { opacity: 0.5; } }
    </style>
</head>

                return;
            }
            
            testBtn.disabled = true;
            testBtn.textContent = '⏳';
            
            try {
                let isValid = false;
                
                if (currentProvider === 'groq') {
                    const response = await fetch('https://api.groq.com/openai/v1/models', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    });
                    isValid = response.ok;
                    
                } else if (currentProvider === 'openrouter') {
                    const response = await fetch('https://openrouter.ai/api/v1/models', {
                        headers: { 'Authorization': `Bearer ${apiKey}` }
                    });
                    isValid = response.ok;
                    
                } else if (currentProvider === 'pollinations') {
                    const response = await fetch(`https://enter.pollinations.ai/api/generate/text/test?key=${apiKey}`);
                    isValid = response.ok;

                    setTimeout(() => { testBtn.textContent = '✓'; testBtn.disabled = false; }, 2000);
                    alert('✅ API Key válida y funcionando correctamente');
                } else {

                    setTimeout(() => { testBtn.textContent = '✓'; testBtn.disabled = false; }, 2000);
                    alert('❌ API Key inválida. Verifica que la copiaste correctamente.');

                    { headers: { Authorization: PEXELS_API_KEY } });

                    return videoFile.link;

        function processTaggedText(taggedText) {
            const analysis = {
                verbs: [...new Set((taggedText.match(/<v>(.*?)<\/v>/g) || []).map(t => t.replace(/<\/?v>/g, '')))],
                nouns: [...new Set((taggedText.match(/<n>(.*?)<\/n>/g) || []).map(t => t.replace(/<\/?n>/g, '')))],
                adjectives: [...new Set((taggedText.match(/<a>(.*?)<\/a>/g) || []).map(t => t.replace(/<\/?a>/g, '')))],
                prepositions: [...new Set((taggedText.match(/<p>(.*?)<\/p>/g) || []).map(t => t.replace(/<\/?p>/g, '')))]
            };
            const cleanParagraph = taggedText.replace(/<[a-z]>/g, '').replace(/<\/[a-z]>/g, '');
            return { cleanParagraph, analysis, taggedText };
        }

        function createGameWords(analysis) {
            const difficulty = document.getElementById('difficultySelector').value;
            const wordCount = difficulty === 'short' ? 6 : 12;
            const allWords = [...analysis.verbs, ...analysis.nouns, ...analysis.adjectives, ...analysis.prepositions];
            const uniqueWords = [...new Set(allWords)];
            return uniqueWords.sort(() => 0.5 - Math.random()).slice(0, wordCount);
        }

        function renderAIResponse(data, userPrompt, staticId = null) {
            if (data.error) {
                return `<p><em style="color: var(--incorrect-color);">❌ Error: ${data.error}</em></p>`;
            }
            
            if (!data.tagged_paragraph) { 
                return `<p><em style="color: var(--incorrect-color);">❌ ${TRANSLATIONS[currentLanguage].error}</em></p>`; 
            }
            
            const id = staticId || ++gameCounter;
            const processedData = processTaggedText(data.tagged_paragraph);

            if (!staticId) {
                gameData[id] = { 
                    prompt: userPrompt, 
                    ...processedData, 
                    scores: {}, 
                    currentStage: 0, 
                    gameWords: createGameWords(processedData.analysis) 
                };
            }
            
            const gameHtml = createGameStageHtml(id, staticId ? gameData[id] : null);

            return `<div class="interactive-exercise" id="exercise-container-${id}">
                        <div class="generated-paragraph">${processedData.cleanParagraph}</div>
                        ${gameHtml}
                        <div class="analysis-actions">
                            <button class="download-btn">${TRANSLATIONS[currentLanguage].downloadBtn}</button>
                        </div>
                    </div>`;
        }
        
        function createGameStageHtml(id, staticData = null) {
            const data = staticData || gameData[id];
            const t = TRANSLATIONS[currentLanguage];
            const currentStageIndex = data.currentStage;
            const stages = ['verbs', 'nouns', 'adjectives', 'prepositions'];
            
            if (currentStageIndex >= stages.length) {
                const scores = Object.values(data.scores);
                const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
                return `<div class="final-score-container">${t.finalScore}: ${average.toFixed(0)}%</div>`;
            }

            const currentCategory = stages[currentStageIndex];
            const words = data.gameWords;
            const wordGridHtml = words.map(word => `<button class="word-button" data-word="${word}">${word}</button>`).join('');

            return `<div class="game-container" id="game-container-${id}">
                        <div class="game-instruction">${t.instruction[currentCategory]}</div>
                        <div class="word-grid">${wordGridHtml}</div>
                        <div class="game-actions">

                        </div>
                        <div class="game-result" style="display: none;"></div>

        }

        function verifyStage(id) {
            const container = document.getElementById(`game-container-${id}`);
            if (!container) return;
            container.classList.add('graded');
            
            const currentStageIndex = gameData[id].currentStage;
            const stages = ['verbs', 'nouns', 'adjectives', 'prepositions'];
            const currentCategory = stages[currentStageIndex];
            const correctWordsForCategory = gameData[id].analysis[currentCategory];

            let correctSelections = 0;
            let totalCorrectInGrid = 0;
            let incorrectSelections = 0;

            container.querySelectorAll('.word-button').forEach(button => {
                const word = button.dataset.word;
                const isSelected = button.classList.contains('selected');
                const isCorrectType = correctWordsForCategory.includes(word);

                if (isCorrectType) {
                    totalCorrectInGrid++;
                    if (isSelected) {
                        correctSelections++;
                        button.classList.add('correct');
                    } else {
                        button.classList.add('correct');
                    }
                } else {
                    if (isSelected) {
                        incorrectSelections++;
                        button.classList.add('incorrect');
                    }
                }
            });

            const score = totalCorrectInGrid > 0 ? (correctSelections / totalCorrectInGrid) * 100 : (incorrectSelections > 0 ? 0 : 100);
            const finalScore = Math.max(0, score);
            gameData[id].scores[currentCategory] = finalScore;
            
            const t = TRANSLATIONS[currentLanguage];
            container.querySelector('.game-result').innerHTML = `${t.score}: ${finalScore.toFixed(0)}%`;
            container.querySelector('.game-result').style.display = 'block';

            const actionsDiv = container.querySelector('.game-actions');
            actionsDiv.innerHTML = `<button class="game-btn next-btn" onclick="nextStage(${id})">${t.nextBtn}</button>`;
        }

        function nextStage(id) {
            gameData[id].currentStage++;
            const newStageHtml = createGameStageHtml(id);
            const container = document.getElementById(`game-container-${id}`);
            if (container) {
                container.outerHTML = newStageHtml;
            } else {
                const exerciseContainer = document.getElementById(`exercise-container-${id}`);
                const finalScoreContainer = exerciseContainer.querySelector('.final-score-container');
                if(finalScoreContainer) finalScoreContainer.outerHTML = newStageHtml;
            }
        }

        async function generateAIResponse(userMessage) {
            const difficulty = document.getElementById('difficultySelector').value;
            let lengthInstruction = difficulty === 'short'
                ? 'El párrafo debe ser corto, de entre 40 y 50 palabras.'
                : 'El párrafo debe ser largo, de al menos 100 palabras, y rico gramaticalmente.';
            
            let behaviorTemplate = TRANSLATIONS[currentLanguage].behavior.replace('{PARAGRAPH_LENGTH_INSTRUCTION}', lengthInstruction);
            
            // Para Groq, usar un prompt más corto y directo
            if (currentProvider === 'groq') {
                behaviorTemplate = `Responde SOLO con un objeto JSON válido. No agregues texto antes o después.

Genera un párrafo sobre: "${userMessage}"

Requisitos:
- ${lengthInstruction}
- Etiqueta SOLO: verbos con <v>, sustantivos con <n>, adjetivos con <a>, preposiciones con <p>
- NO etiquetes artículos (el, la), conjunciones (y, o, que), pronombres, ni adverbios

Formato de respuesta (copia este formato exactamente):
{
  "tagged_paragraph": "tu párrafo etiquetado aquí"
}`;
            }
            
            const selectedModel = document.getElementById('modelSelector').value;
            const apiKey = getApiKey();
            
            let aiResponseText = ''; 
            
            try {
                const fullPrompt = currentProvider === 'groq' ? behaviorTemplate : `${behaviorTemplate}\n\nUser topic: ${userMessage}`;
                console.log('Prompt length:', fullPrompt.length, 'characters');
                
                if (currentProvider === 'libre') {
                    const response = await fetch(BACKEND_URL_TEXT, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ prompt: fullPrompt, model: selectedModel })
                    });
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    aiResponseText = await response.text();
                    
                } else if (currentProvider === 'pollinations') {
                    const apiUrl = `https://enter.pollinations.ai/api/generate/text/${encodeURIComponent(fullPrompt)}?key=${apiKey}&model=${selectedModel}`;
                    const response = await fetch(apiUrl);
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    aiResponseText = await response.text();
                    
                } else if (currentProvider === 'openrouter') {
                    if (!apiKey) throw new Error(TRANSLATIONS[currentLanguage].errorMsgNoKey);
                    const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`,
                            'HTTP-Referer': window.location.origin,
                            'X-Title': 'Análisis Gramatical Interactivo'
                        },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: [{ role: 'user', content: fullPrompt }]
                        })
                    });
                    if (!response.ok) {
                        const errorText = await response.text();
                        throw new Error(`OpenRouter error: ${errorText}`);
                    }
                    const data = await response.json();
                    aiResponseText = data.choices[0].message.content;
                    
                } else if (currentProvider === 'groq') {
                    if (!apiKey) throw new Error(TRANSLATIONS[currentLanguage].errorMsgNoKey);
                    
                    console.log(`Groq API Key (primeros 10 caracteres): ${apiKey.substring(0, 10)}...`);
                    
                    const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: selectedModel,
                            messages: [
                                { 
                                    role: 'system', 
                                    content: 'You are a grammar expert. Always respond with valid JSON only. No explanations, no markdown, just the JSON object.'
                                },
                                { role: 'user', content: fullPrompt }
                            ],
                            temperature: 0.7,
                            max_tokens: 4096,
                            top_p: 1.0
                        })
                    });
                    
                    if (!response.ok) {
                        const errorText = await response.text();
                        console.error('Groq API Error Response:', errorText);
                        
                        try {
                            const errorJson = JSON.parse(errorText);
                            if (errorJson.error) {
                                if (errorJson.error.code === 'invalid_api_key') {
                                    throw new Error('❌ API Key de Groq inválida. Verifica que:\n1. Copiaste la key completa (debe empezar con "gsk_")\n2. No tenga espacios al inicio o final\n3. La key esté activa en console.groq.com/keys');
                                }
                                throw new Error(`Groq API: ${errorJson.error.message || errorText}`);
                            }
                        } catch (parseError) {
                            // Si no se puede parsear, mostrar error original
                            throw new Error(`Groq API error (${response.status}): ${errorText}`);
                        }
                    }
                    
                    const data = await response.json();
                    console.log('Groq API Response:', data);
                    
                    if (!data.choices || !data.choices[0] || !data.choices[0].message) {
                        console.error('Invalid Groq response structure:', data);
                        throw new Error('Respuesta inválida de la API de Groq');
                    }
                    
                    // Check finish_reason
                    const finishReason = data.choices[0].finish_reason;
                    console.log('Finish reason:', finishReason);
                    
                    if (finishReason === 'length') {
                        console.warn('Response was cut off due to max_tokens limit');
                    } else if (finishReason === 'content_filter') {
                        throw new Error('El contenido fue filtrado por las políticas de Groq. Intenta con otro tema.');
                    }
                    
                    aiResponseText = data.choices[0].message.content;
                    console.log('Groq response text length:', aiResponseText ? aiResponseText.length : 0);
                    console.log('Groq response text:', aiResponseText);
                    
                    if (!aiResponseText || aiResponseText.trim() === '') {
                        console.error('Empty response. Full data:', JSON.stringify(data, null, 2));
                        throw new Error('Groq devolvió una respuesta vacía. Intenta con otro modelo o tema más específico.');
                    }
                }

                const startIndex = aiResponseText.indexOf('{');
                if (startIndex === -1) throw new Error("AI response did not contain a JSON object.");
                
                let braceCount = 1;
                let endIndex = -1;
                for (let i = startIndex + 1; i < aiResponseText.length; i++) {
                    if (aiResponseText[i] === '{') braceCount++;
                    else if (aiResponseText[i] === '}') braceCount--;
                    if (braceCount === 0) { endIndex = i; break; }
                }

                if (endIndex === -1) throw new Error("AI response contained an incomplete JSON object.");
                
                const jsonString = aiResponseText.substring(startIndex, endIndex + 1);
                return JSON.parse(jsonString);
                
            } catch (error) {
                console.error('Error al generar o parsear respuesta de IA:', error);
                console.error('Problematic AI Response Text:', aiResponseText);
                
                // Mostrar un mensaje de error más específico al usuario
                let errorMessage = error.message;
                if (aiResponseText && aiResponseText.trim() === '') {
                    errorMessage = `El proveedor ${currentProvider} devolvió una respuesta vacía. Verifica tu API Key o intenta con otro modelo.`;
                } else if (!aiResponseText) {
                    errorMessage = `No se pudo conectar con ${currentProvider}. Verifica tu API Key y conexión a internet.`;
                }
                
                throw new Error(errorMessage);
            }
        }
        
        // Initialize
        checkUrlHash();
        loadProviderPreference();
        handleProviderChange();
        updateLanguage();
    </script>
</body>
