            input.value = '';
            input.disabled = true;
            document.querySelector('.send-btn').disabled = true;

            const activateVideo = document.getElementById('videoToggle').checked;
            const videoPromise = activateVideo ? fetchPexelsVideo(message) : Promise.resolve(null);
            
            try {
                const [videoUrlResult, aiResponseJson] = await Promise.all([ videoPromise, generateAIResponse(message) ]);
                const finalVideoUrl = activateVideo ? (videoUrlResult || DEFAULT_VIDEO_URL) : null;
                addMessage(aiResponseJson, 'ai', { userPrompt: message, videoUrl: finalVideoUrl });
            } catch (error) {
                console.error("Error processing AI response:", error);
                addMessage({ error: error.message }, 'ai', { userPrompt: message });
            } finally {
                input.disabled = false;
                document.querySelector('.send-btn').disabled = false;
            }
        }
        
        function processTaggedText(taggedText) {
            const analysis = {
                verbs: [...new Set((taggedText.match(/<v>(.*?)<\/v>/g) || []).map(t => t.replace(/<\/?v>/g, '')))],
                nouns: [...new Set((taggedText.match(/<n>(.*?)<\/n>/g) || []).map(t => t.replace(/<\/?n>/g, '')))],
                adjectives: [...new Set((taggedText.match(/<a>(.*?)<\/a>/g) || []).map(t => t.replace(/<\/?a>/g, '')))],
                prepositions: [...new Set((taggedText.match(/<p>(.*?)<\/p>/g) || []).map(t => t.replace(/<\/?p>/g, '')))]
            };
            const cleanParagraph = taggedText.replace(/<[a-z]>/g, '').replace(/<\/[a-z]>/g, '');
            return { cleanParagraph, analysis, taggedText };
        }

        function createGameWords(analysis) {
            const difficulty = document.getElementById('difficultySelector').value;
            const wordCount = difficulty === 'short' ? 6 : 12;
            const allWords = [...analysis.verbs, ...analysis.nouns, ...analysis.adjectives, ...analysis.prepositions];
            const uniqueWords = [...new Set(allWords)];
            
            return uniqueWords.sort(() => 0.5 - Math.random()).slice(0, wordCount);
        }

        function renderAIResponse(data, userPrompt, staticId = null) {
            if (data.error || !data.tagged_paragraph) { return `<p><em>${TRANSLATIONS[currentLanguage].error}</em></p>`; }
            
            const id = staticId || ++gameCounter;
            const processedData = processTaggedText(data.tagged_paragraph);

            if (!staticId) {
                gameData[id] = { prompt: userPrompt, ...processedData, scores: {}, currentStage: 0, gameWords: createGameWords(processedData.analysis) };
            }
            
            const gameHtml = createGameStageHtml(id, staticId ? gameData[id] : null);

            return `<div class="interactive-exercise" id="exercise-container-${id}">
                        <div class="generated-paragraph">${processedData.cleanParagraph}</div>
                        ${gameHtml}
                        <div class="analysis-actions">
                            <button class="download-btn">${TRANSLATIONS[currentLanguage].downloadBtn}</button>
                        </div>
                    </div>`;
        }
        
        function createGameStageHtml(id, staticData = null) {
            const data = staticData || gameData[id];
            const t = TRANSLATIONS[currentLanguage];
            const currentStageIndex = data.currentStage;
            const stages = ['verbs', 'nouns', 'adjectives', 'prepositions'];
            
            if (currentStageIndex >= stages.length) {
                const scores = Object.values(data.scores);
                const average = scores.reduce((sum, score) => sum + score, 0) / scores.length;
                return `<div class="final-score-container">${t.finalScore}: ${average.toFixed(0)}%</div>`;
            }

            const currentCategory = stages[currentStageIndex];
            const words = data.gameWords;
            const wordGridHtml = words.map(word => `<button class="word-button" data-word="${word}">${word}</button>`).join('');

            return `<div class="game-container" id="game-container-${id}">
                        <div class="game-instruction">${t.instruction[currentCategory]}</div>
                        <div class="word-grid">${wordGridHtml}</div>
                        <div class="game-actions">
                            <button class="game-btn verify-btn" onclick="verifyStage(${id})">${t.verifyBtn}</button>
                        </div>
                        <div class="game-result" style="display: none;"></div>
                    </div>`;
        }

        document.getElementById('chatMessages').addEventListener('click', e => {
            if (e.target.classList.contains('word-button') && !e.target.closest('.game-container.graded')) {
                e.target.classList.toggle('selected');
            } else if (e.target.classList.contains('download-btn')) {
                 const exerciseContainer = e.target.closest('.interactive-exercise');
                 if (exerciseContainer) {
                    const id = parseInt(exerciseContainer.id.split('-').pop(), 10);
                    downloadExercise(e.target, id);
                 }
            }
        });

        function addMessage(message, sender, options = {}) {
            const { userPrompt, videoUrl } = options;
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            let videoHtml = '';
            if (sender === 'ai' && videoUrl) { videoHtml = `<div class="video-display-container"><video src="${videoUrl}" loop muted autoplay playsinline title="Video de stock sobre ${userPrompt}"></video></div>`; }
            
            const messageContent = sender === 'ai' ? renderAIResponse(message, userPrompt) : message;
            const apiKey = getApiKey();

            if (sender === 'user') {
                messageDiv.innerHTML = `<div class="message-avatar"><img src="https://enter.pollinations.ai/api/generate/image/estudiante,photographic?key=${apiKey}&width=40&height=40&seed=888&model=flux" alt="Usuario"></div><div class="message-content">${messageContent}</div>`;
            } else {
                messageDiv.innerHTML = `<div class="message-avatar"><img src="${document.getElementById('aiAvatar').src}" alt="${AI_CONFIG.name}"></div><div class="message-content rich-text-content">${videoHtml}${messageContent}</div>`;
            }
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function verifyStage(id) {
            const container = document.getElementById(`game-container-${id}`);
            if (!container) return;
            container.classList.add('graded');
            
            const currentStageIndex = gameData[id].currentStage;
            const stages = ['verbs', 'nouns', 'adjectives', 'prepositions'];
            const currentCategory = stages[currentStageIndex];
            const correctWordsForCategory = gameData[id].analysis[currentCategory];

            let correctSelections = 0;
            let totalCorrectInGrid = 0;
            let incorrectSelections = 0;

            container.querySelectorAll('.word-button').forEach(button => {
                const word = button.dataset.word;
                const isSelected = button.classList.contains('selected');
                const isCorrectType = correctWordsForCategory.includes(word);

                if (isCorrectType) {
                    totalCorrectInGrid++;
                    if (isSelected) {
                        correctSelections++;
                        button.classList.add('correct');
                    } else {
                        button.classList.add('correct');
                    }
                } else {
                    if (isSelected) {
                        incorrectSelections++;
                        button.classList.add('incorrect');
                    }
                }
            });

            const score = totalCorrectInGrid > 0 ? (correctSelections / totalCorrectInGrid) * 100 : (incorrectSelections > 0 ? 0 : 100);
            const finalScore = Math.max(0, score);
            gameData[id].scores[currentCategory] = finalScore;
            
            const t = TRANSLATIONS[currentLanguage];
            container.querySelector('.game-result').innerHTML = `${t.score}: ${finalScore.toFixed(0)}%`;
            container.querySelector('.game-result').style.display = 'block';

            const actionsDiv = container.querySelector('.game-actions');
            actionsDiv.innerHTML = `<button class="game-btn next-btn" onclick="nextStage(${id})">${t.nextBtn}</button>`;
        }

        function nextStage(id) {
            gameData[id].currentStage++;
            const newStageHtml = createGameStageHtml(id);
            const container = document.getElementById(`game-container-${id}`);
            if (container) {
                container.outerHTML = newStageHtml;
            } else {
                 const exerciseContainer = document.getElementById(`exercise-container-${id}`);
                 const finalScoreContainer = exerciseContainer.querySelector('.final-score-container');
                 if(finalScoreContainer) finalScoreContainer.outerHTML = newStageHtml;
            }
        }
        
        function downloadExercise(buttonElement, id) {
            const data = gameData[id];
            if (!data) return;

            const messageContentDiv = buttonElement.closest('.rich-text-content');
            const videoContainer = messageContentDiv ? messageContentDiv.querySelector('.video-display-container') : null;
            const videoHtml = videoContainer ? videoContainer.outerHTML : '';

            const t = TRANSLATIONS[currentLanguage];
            const styles = document.getElementById('main-styles').innerHTML;
            const rootStyles = getComputedStyle(document.documentElement);
            const colorOverrideStyle = `<style>:root { --accent-primary: ${rootStyles.getPropertyValue('--accent-primary').trim()}; --accent-secondary: ${rootStyles.getPropertyValue('--accent-secondary').trim()}; }</style>`;
            const bodyClass = document.getElementById('page-body').className;
            const downloadId = 1;

            const staticDataForRender = { ...data, currentStage: 0, scores: {} };
            const gameHtml = createGameStageHtml(downloadId, staticDataForRender);

            const finalHtml = `<div class="interactive-exercise" id="exercise-container-${downloadId}">
                                <div class="generated-paragraph">${data.cleanParagraph}</div>
                                ${gameHtml}
                                <div class="analysis-actions">
                                    <button class="download-btn" style="display:none;">${t.downloadBtn}</button>
                                </div>
                            </div>`;

            const fileContent = `<!DOCTYPE html><html lang="${currentLanguage}"><head><meta charset="UTF-8"><title>${t.title} - ${data.prompt}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>${styles}</style>${colorOverrideStyle}</head><body class="${bodyClass}">
            <div class="header"><h1 class="ai-title">${t.title}: ${data.prompt}</h1></div>
            <div class="chat-container"><div class="message ai-message"><div class="message-content rich-text-content">${videoHtml}${finalHtml}</div></div></div>
            <footer class="site-footer"><p>${t.footer}</p></footer>
            <script>
                const t = ${JSON.stringify(t)};
                let gameData = { ${downloadId}: ${JSON.stringify(staticDataForRender)} };
                document.body.addEventListener('click', e => { if (e.target.classList.contains('word-button') && !e.target.closest('.game-container.graded')) e.target.classList.toggle('selected'); });
                function createGameStageHtml(id) {
                    const data = gameData[id]; const currentStageIndex = data.currentStage; const stages = ['verbs', 'nouns', 'adjectives', 'prepositions'];
                    if (currentStageIndex >= stages.length) {
                        const scores = Object.values(data.scores); const average = scores.reduce((s, c) => s + c, 0) / scores.length;
                        return \`<div class="final-score-container">\${t.finalScore}: \${average.toFixed(0)}%</div>\`;
                    }
                    const currentCategory = stages[currentStageIndex]; const words = data.gameWords;
                    const wordGridHtml = words.map(word => \`<button class="word-button" data-word="\${word}">\${word}</button>\`).join('');
                    return \`<div class="game-container" id="game-container-\${id}">
                                <div class="game-instruction">\${t.instruction[currentCategory]}</div><div class="word-grid">\${wordGridHtml}</div>
                                <div class="game-actions"><button class="game-btn verify-btn" onclick="verifyStage(\${id})">\${t.verifyBtn}</button></div>
                                <div class="game-result" style="display: none;"></div></div>\`;
                }
                function verifyStage(id) {
                    const container = document.getElementById('game-container-' + id); if (!container) return; container.classList.add('graded');
                    const data = gameData[id]; const currentStageIndex = data.currentStage; const stages = ['verbs', 'nouns', 'adjectives', 'prepositions']; const currentCategory = stages[currentStageIndex];
                    const correctWordsForCategory = data.analysis[currentCategory]; let correctSelections = 0, totalCorrectInGrid = 0, incorrectSelections = 0;
                    container.querySelectorAll('.word-button').forEach(button => {
                        const word = button.dataset.word; const isSelected = button.classList.contains('selected'); const isCorrectType = correctWordsForCategory.includes(word);
                        if(isCorrectType) totalCorrectInGrid++;
                        if (isSelected && isCorrectType) { correctSelections++; button.classList.add('correct'); }
                        else if (isSelected && !isCorrectType) { incorrectSelections++; button.classList.add('incorrect'); }
                        else if (!isSelected && isCorrectType) { button.classList.add('correct'); }
                    });
                    const score = totalCorrectInGrid > 0 ? (correctSelections / totalCorrectInGrid) * 100 : (incorrectSelections > 0 ? 0 : 100);
                    const finalScore = Math.max(0, score); data.scores[currentCategory] = finalScore;
                    container.querySelector('.game-result').innerHTML = \`\${t.score}: \${finalScore.toFixed(0)}%\`; container.querySelector('.game-result').style.display = 'block';
                    container.querySelector('.game-actions').innerHTML = \`<button class="game-btn next-btn" onclick="nextStage(\${id})">\${t.nextBtn}</button>\`;
                }
                function nextStage(id) {
                    gameData[id].currentStage++; const newStageHtml = createGameStageHtml(id); const container = document.getElementById('game-container-' + id);
                    if (container) { container.outerHTML = newStageHtml; }
                    else { const exerciseContainer = document.getElementById(\`exercise-container-\${id}\`); const finalScoreContainer = exerciseContainer.querySelector('.final-score-container'); if(finalScoreContainer) finalScoreContainer.outerHTML = newStageHtml; }
                }
            <\/script></body></html>`;
            const blob = new Blob([fileContent], { type: 'text/html' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `analisis-gramatical-${data.prompt.replace(/\s+/g, '-')}.html`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(a.href);
        }

        async function generateAIResponse(userMessage) {
            const difficulty = document.getElementById('difficultySelector').value;
            let lengthInstruction = difficulty === 'short'
                ? 'El párrafo debe ser corto, de entre 40 y 50 palabras.'
                : 'El párrafo debe ser largo, de al menos 100 palabras, y rico gramaticalmente.';
            
            let behaviorTemplate = TRANSLATIONS[currentLanguage].behavior.replace('{PARAGRAPH_LENGTH_INSTRUCTION}', lengthInstruction);
            const selectedModel = document.getElementById('modelSelector').value;
            let aiResponseText = ''; 
            try {
                const fullPrompt = `${behaviorTemplate}\n\nUser topic: ${userMessage}`;
                const apiUrl = `https://enter.pollinations.ai/api/generate/text/${encodeURIComponent(fullPrompt)}?key=${getApiKey()}&model=${selectedModel}`;
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                aiResponseText = await response.text();

                const startIndex = aiResponseText.indexOf('{');
                if (startIndex === -1) throw new Error("AI response did not contain a JSON object.");
                
                let braceCount = 1;
                let endIndex = -1;
                for (let i = startIndex + 1; i < aiResponseText.length; i++) {
                    if (aiResponseText[i] === '{') braceCount++;
                    else if (aiResponseText[i] === '}') braceCount--;
                    if (braceCount === 0) { endIndex = i; break; }
                }

                if (endIndex === -1) throw new Error("AI response contained an incomplete JSON object.");
                
                const jsonString = aiResponseText.substring(startIndex, endIndex + 1);
                return JSON.parse(jsonString);
            } catch (error) {
                console.error('Error al generar o parsear respuesta de IA:', error);
                console.error('Problematic AI Response Text:', aiResponseText); 
                throw error;
            }
        }
        
        // Initialize language and check hash on load
        checkUrlHash();
        updateLanguage();
    </script>
</body>
