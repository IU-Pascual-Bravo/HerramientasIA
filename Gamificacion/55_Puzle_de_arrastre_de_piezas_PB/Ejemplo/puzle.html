
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puzle para Armar</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; margin: 20px; background-color: #f0f0f0; }
        h1 { text-align: center; }
        .puzzle-layout { display: flex; width: 100%; max-width:900px; gap: 10px; margin-top: 10px; flex-wrap: wrap; justify-content: center;}
        #piecesHoldingArea { width: 180px; min-height: 300px; max-height: 500px; overflow-y: auto; background-color: #d3d3d3; border: 1px dashed #aaa; padding: 10px; box-sizing: border-box; position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; }
        #puzzleBoardContainer { flex-grow: 1; display: flex; justify-content: center; align-items: center; min-height: 300px; }
        #puzzleArea { position: relative; background-color: #f8f8f8; border: 2px solid #0056b3; }
        #puzzleBoardOutline { position: absolute; top: 0; left: 0; border: 2px dashed #888; box-sizing: border-box; pointer-events: none; }
        .puzzle-piece { position: absolute; background-size: cover; background-repeat: no-repeat; border: 1px solid #555; box-shadow: 2px 2px 5px rgba(0,0,0,0.3); cursor: grab; user-select: none; box-sizing: border-box; transition: box-shadow 0.1s linear, transform 0.1s linear; z-index: 10;}
        .puzzle-piece.dragging { cursor: grabbing; box-shadow: 5px 5px 15px rgba(0,0,0,0.5); z-index: 1000 !important; transform: scale(1.05); }
        #winMessageStandalone { margin-top: 20px; padding: 15px; background-color: #28a745; color: white; border-radius: 4px; font-size: 1.2em; text-align:center; display:none; }
    </style>
</head>

                <div id="puzzleBoardOutline"></div>

        const PUZZLE_DIFFICULTY = 4;
        const SNAP_THRESHOLD_S = 20;
        const MAX_PUZZLE_AREA_WIDTH_S = 500; 
        const MAX_PUZZLE_AREA_HEIGHT_S = 400;
        // PIECE_HOLDING_AREA_ITEM_HEIGHT_S removed

        const puzzleArea_s = document.getElementById('puzzleArea');
        const piecesHoldingArea_s = document.getElementById('piecesHoldingArea');
        const winMessage_s = document.getElementById('winMessageStandalone');
        
        let allPieces_s = []; 
        let groups_s = new Map(); 
        let puzzleBoardActualWidth_s = 0;
        let puzzleBoardActualHeight_s = 0;
        let pieceWidth_s = 0;
        let pieceHeight_s = 0;
        let puzzleSolvedState_s = false;

        let activeDrag_s = {
            isDragging: false, draggedPieceId: null, draggedGroupId: null,
            mouseOffsetX: 0, mouseOffsetY: 0, initialPiecePositions: new Map() 
        };
        
        function createPuzzle_s() {
            puzzleArea_s.innerHTML = '<div id="puzzleBoardOutline"></div>';
            allPieces_s = [];
            groups_s.clear();
            puzzleSolvedState_s = false;
            winMessage_s.style.display = 'none';
            const holdingAreaParagraph_s = piecesHoldingArea_s.querySelector('p');
            piecesHoldingArea_s.innerHTML = ''; 
            if (holdingAreaParagraph_s) piecesHoldingArea_s.appendChild(holdingAreaParagraph_s);

            const img = new Image();
            img.onload = () => {
                let scale = Math.min(
                    MAX_PUZZLE_AREA_WIDTH_S / img.width,
                    MAX_PUZZLE_AREA_HEIGHT_S / img.height,
                    1 
                );
                puzzleBoardActualWidth_s = img.width * scale;
                puzzleBoardActualHeight_s = img.height * scale;

                puzzleArea_s.style.width = `${puzzleBoardActualWidth_s}px`;
                puzzleArea_s.style.height = `${puzzleBoardActualHeight_s}px`;
                
                const outlineEl = puzzleArea_s.querySelector('#puzzleBoardOutline');
                outlineEl.style.width = `${puzzleBoardActualWidth_s}px`;
                outlineEl.style.height = `${puzzleBoardActualHeight_s}px`;

                pieceWidth_s = puzzleBoardActualWidth_s / PUZZLE_DIFFICULTY;
                pieceHeight_s = puzzleBoardActualHeight_s / PUZZLE_DIFFICULTY;

                const holdingAreaRect_s = piecesHoldingArea_s.getBoundingClientRect();
                const puzzleAreaRectForPlacing_s = puzzleArea_s.getBoundingClientRect();
                const holdingAreaVisualOffset_s = piecesHoldingArea_s.offsetWidth + 30; 
                const verticalOffsetBetweenContainers_s = holdingAreaRect_s.top - puzzleAreaRectForPlacing_s.top;
                
                let yPositionInHoldingArea_s = 5;


                for (let row = 0; row < PUZZLE_DIFFICULTY; row++) {
                    for (let col = 0; col < PUZZLE_DIFFICULTY; col++) {
                        const pieceId = `piece-${row}-${col}`;
                        const pieceEl = document.createElement('div');
                        pieceEl.classList.add('puzzle-piece');
                        pieceEl.id = pieceId;
                        pieceEl.style.width = `${pieceWidth_s}px`;
                        pieceEl.style.height = `${pieceHeight_s}px`;
                        pieceEl.style.backgroundImage = `url(${PUZZLE_IMAGE_SRC})`;
                        pieceEl.style.backgroundSize = `${puzzleBoardActualWidth_s}px ${puzzleBoardActualHeight_s}px`;
                        pieceEl.style.backgroundPosition = `-${col * pieceWidth_s}px -${row * pieceHeight_s}px`;
                        
                        const pieceData = {
                            id: pieceId, el: pieceEl, originalRow: row, originalCol: col,
                            currentX: 0, currentY: 0, width: pieceWidth_s, height: pieceHeight_s,
                            groupId: pieceId
                        };
                        allPieces_s.push(pieceData);
                        groups_s.set(pieceId, new Set([pieceId]));
                        
                        const randomOffsetX = (Math.random() - 0.5) * (piecesHoldingArea_s.offsetWidth * 0.5);
                        pieceData.currentX = -holdingAreaVisualOffset_s + randomOffsetX; 
                        pieceData.currentY = yPositionInHoldingArea_s + verticalOffsetBetweenContainers_s;
                        
                        yPositionInHoldingArea_s += pieceHeight_s * 0.25; 
                        
                        pieceEl.style.left = `${pieceData.currentX}px`;
                        pieceEl.style.top = `${pieceData.currentY}px`;

                        puzzleArea_s.appendChild(pieceEl);
                        pieceEl.addEventListener('mousedown', onPieceMouseDown_s);
                    }
                }
                shuffleAllPiecesInitialPositions_s(); 
                allPieces_s.forEach(p => { 
                     p.el.style.left = `${p.currentX}px`;
                     p.el.style.top = `${p.currentY}px`;
                });
            };
            img.src = PUZZLE_IMAGE_SRC;
        }
        
        function shuffleAllPiecesInitialPositions_s() {
            const positions = allPieces_s.map(p => ({x: p.currentX, y: p.currentY}));
            for (let i = positions.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [positions[i], positions[j]] = [positions[j], positions[i]];
            }
            allPieces_s.forEach((p, i) => {
                p.currentX = positions[i].x;
                p.currentY = positions[i].y;
            });
        }

        function onPieceMouseDown_s(e) {
            if (puzzleSolvedState_s) return;
            e.preventDefault(); 
            const pieceId = e.target.id;
            const piece = allPieces_s.find(p => p.id === pieceId);
            if (!piece) return;

            activeDrag_s.isDragging = true;
            activeDrag_s.draggedPieceId = pieceId;
            activeDrag_s.draggedGroupId = piece.groupId;
            
            const pieceRect = piece.el.getBoundingClientRect();
            activeDrag_s.mouseOffsetX = e.clientX - pieceRect.left;
            activeDrag_s.mouseOffsetY = e.clientY - pieceRect.top;

            activeDrag_s.initialPiecePositions.clear();
            const groupPieceIds = groups_s.get(piece.groupId);
            groupPieceIds.forEach(pid => {
                const p = allPieces_s.find(item => item.id === pid);
                if(p && p.el) p.el.classList.add('dragging');
                if(p) activeDrag_s.initialPiecePositions.set(pid, { x: p.currentX, y: p.currentY });
            });

            document.addEventListener('mousemove', onDocumentMouseMove_s);
            document.addEventListener('mouseup', onDocumentMouseUp_s);
        }

        function onDocumentMouseMove_s(e) {
            if (!activeDrag_s.isDragging) return;
            const puzzleAreaRect = puzzleArea_s.getBoundingClientRect();
            const newClickedPieceX = e.clientX - puzzleAreaRect.left - activeDrag_s.mouseOffsetX;
            const newClickedPieceY = e.clientY - puzzleAreaRect.top - activeDrag_s.mouseOffsetY;
            const draggedPieceOriginalPos = activeDrag_s.initialPiecePositions.get(activeDrag_s.draggedPieceId);
            if(!draggedPieceOriginalPos) return; 
            const deltaX = newClickedPieceX - draggedPieceOriginalPos.x;
            const deltaY = newClickedPieceY - draggedPieceOriginalPos.y;
            const groupPieceIds = groups_s.get(activeDrag_s.draggedGroupId);
            if(!groupPieceIds) return; 

            groupPieceIds.forEach(pid => {
                const piece = allPieces_s.find(p => p.id === pid);
                const initialPos = activeDrag_s.initialPiecePositions.get(pid);
                if(piece && initialPos && piece.el){
                    piece.currentX = initialPos.x + deltaX;
                    piece.currentY = initialPos.y + deltaY;
                    piece.el.style.left = `${piece.currentX}px`;
                    piece.el.style.top = `${piece.currentY}px`;
                }
            });
        }

        function onDocumentMouseUp_s(e) {
            if (!activeDrag_s.isDragging) return;
            const draggedGroupIds = groups_s.get(activeDrag_s.draggedGroupId);
            if(draggedGroupIds) {
                 draggedGroupIds.forEach(pid => {
                    const piece = allPieces_s.find(p => p.id === pid);
                    if(piece && piece.el) piece.el.classList.remove('dragging');
                 });
            }
            activeDrag_s.isDragging = false;
            document.removeEventListener('mousemove', onDocumentMouseMove_s);
            document.removeEventListener('mouseup', onDocumentMouseUp_s);
            if(groups_s.has(activeDrag_s.draggedGroupId)) checkForSnapping_s(activeDrag_s.draggedGroupId);
            checkWinCondition_s();
        }

        function checkForSnapping_s(draggedGroupId) {
            if (puzzleSolvedState_s || !groups_s.has(draggedGroupId)) return;
            const draggedPieceObjects = Array.from(groups_s.get(draggedGroupId)).map(id => allPieces_s.find(p => p.id === id)).filter(p => p);
            for (const draggedPiece of draggedPieceObjects) {
                for (const staticPiece of allPieces_s) {
                    if (!draggedPiece || !staticPiece || draggedPiece.groupId === staticPiece.groupId) continue;
                    if (staticPiece.originalRow === draggedPiece.originalRow && staticPiece.originalCol + 1 === draggedPiece.originalCol) {
                        const targetX = staticPiece.currentX + staticPiece.width; const targetY = staticPiece.currentY;
                        if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD_S && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD_S) {
                            snapGroups_s(draggedPiece, staticPiece, targetX, targetY); return; 
                        }
                    }
                    if (staticPiece.originalRow === draggedPiece.originalRow && staticPiece.originalCol - 1 === draggedPiece.originalCol) {
                        const targetX = staticPiece.currentX - draggedPiece.width; const targetY = staticPiece.currentY;
                         if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD_S && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD_S) {
                            snapGroups_s(draggedPiece, staticPiece, targetX, targetY); return;
                        }
                    }
                    if (staticPiece.originalCol === draggedPiece.originalCol && staticPiece.originalRow + 1 === draggedPiece.originalRow) {
                        const targetX = staticPiece.currentX; const targetY = staticPiece.currentY + staticPiece.height;
                        if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD_S && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD_S) {
                            snapGroups_s(draggedPiece, staticPiece, targetX, targetY); return;
                        }
                    }
                     if (staticPiece.originalCol === draggedPiece.originalCol && staticPiece.originalRow - 1 === draggedPiece.originalRow) {
                        const targetX = staticPiece.currentX; const targetY = staticPiece.currentY - draggedPiece.height;
                         if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD_S && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD_S) {
                            snapGroups_s(draggedPiece, staticPiece, targetX, targetY); return;
                        }
                    }
                }
            }
        }
        
        function snapGroups_s(draggedPiece, staticPiece, targetX_for_draggedPiece, targetY_for_draggedPiece) {
            const groupToMoveId = draggedPiece.groupId; const targetGroupId = staticPiece.groupId;
            if (groupToMoveId === targetGroupId || !groups_s.has(groupToMoveId) || !groups_s.has(targetGroupId)) return; 
            const offsetX = targetX_for_draggedPiece - draggedPiece.currentX;
            const offsetY = targetY_for_draggedPiece - draggedPiece.currentY;
            const groupToMovePieceIds = groups_s.get(groupToMoveId);
            groupToMovePieceIds.forEach(pid => {
                const p = allPieces_s.find(item => item.id === pid);
                if(p && p.el){
                    p.currentX += offsetX; p.currentY += offsetY;
                    p.el.style.left = `${p.currentX}px`; p.el.style.top = `${p.currentY}px`;
                    p.groupId = targetGroupId; 
                }
            });
            const targetGroupPieceIds = groups_s.get(targetGroupId);
            if(targetGroupPieceIds) groupToMovePieceIds.forEach(pid => targetGroupPieceIds.add(pid));
            groups_s.delete(groupToMoveId);
            if(groups_s.has(targetGroupId)) checkForSnapping_s(targetGroupId); 
            checkWinCondition_s();
        }

        function checkWinCondition_s() {
            if (puzzleSolvedState_s) return;
            if (groups_s.size === 1) {
                const singleGroupId = groups_s.keys().next().value;
                if (groups_s.has(singleGroupId) && groups_s.get(singleGroupId).size === allPieces_s.length) {
                    puzzleSolvedState_s = true; 
                    winMessage_s.style.display = 'block';
                    allPieces_s.forEach(p => {if(p && p.el) p.el.removeEventListener('mousedown', onPieceMouseDown_s);});
                    alignCompletedPuzzleToBoardOrigin_s(singleGroupId);
                }
            }
        }
        
        function alignCompletedPuzzleToBoardOrigin_s(groupId) {
            if(!groups_s.has(groupId)) return;
            const groupPieces = Array.from(groups_s.get(groupId)).map(id => allPieces_s.find(p => p.id === id)).filter(p => p);
            const piece_0_0 = groupPieces.find(p => p.originalRow === 0 && p.originalCol === 0);
            if (!piece_0_0) return;
            const groupCurrentTopLeftX = piece_0_0.currentX; 
            const groupCurrentTopLeftY = piece_0_0.currentY; 
            const deltaX = 0 - groupCurrentTopLeftX; const deltaY = 0 - groupCurrentTopLeftY;
            groupPieces.forEach(p => {
                if(p && p.el){
                    p.currentX += deltaX; p.currentY += deltaY;
                    p.el.style.left = `${p.currentX}px`; p.el.style.top = `${p.currentY}px`;
                    p.el.style.zIndex = '15'; 
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', createPuzzle_s);
    </script>
