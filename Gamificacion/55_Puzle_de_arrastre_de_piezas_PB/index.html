<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Puzle Arrastrable V3.4</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #e0e0e0;
            padding: 10px;
            box-sizing: border-box;
        }

        .app-container {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            width: 95%;
            max-width: 1000px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            /* Space for footer */
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .app-header .logo-pb {
            height: 60px;
            width: auto;
            flex-shrink: 0;
        }

        .app-header .logo-escuela {
            height: 70px;
            width: auto;
            flex-shrink: 0;
        }

        .app-header h1 {
            flex: 1 1 auto;
            text-align: center;
            font-size: 1.5em;
            margin: 0;
            min-width: 200px;
        }

        @media (max-width: 700px) {
            .app-header {
                justify-content: center;
            }

            .app-header h1 {
                order: 3;
                flex-basis: 100%;
                margin-top: 8px;
            }

            .app-header .logo-pb {
                height: 45px;
            }

            .app-header .logo-escuela {
                height: 52px;
            }
        }

        .controls-area,
        .image-preview-area {
            margin-bottom: 20px;
            text-align: center;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .controls-area input[type="text"],
        .controls-area select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            margin-right: 10px;
        }

        .controls-area input[type="text"] {
            flex-grow: 1;
            max-width: 300px;
        }

        .controls-area select {
            min-width: 150px;
        }


        button {
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin: 5px 0;
        }

        button:hover {
            background-color: #0056b3;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #downloadPuzzleBtn {
            background-color: #17a2b8;
        }

        #downloadPuzzleBtn:hover {
            background-color: #138496;
        }


        .hidden {
            display: none !important;
        }

        #generatedImageDisplay {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-bottom: 10px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        #puzzleButtonsContainer {
            position: relative;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .puzzle-layout {
            display: flex;
            width: 100%;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        #piecesHoldingArea {
            width: 200px;
            min-height: 400px;
            max-height: 600px;
            overflow-y: auto;
            background-color: #d3d3d3;
            border: 1px dashed #aaa;
            padding: 10px;
            box-sizing: border-box;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        #puzzleBoardContainer {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 400px;
        }

        #puzzleArea {
            position: relative;
            background-color: #f8f8f8;
            border: 2px solid #0056b3;
            transition: opacity 0.3s ease-out;
        }

        #puzzleBoardOutline {
            position: absolute;
            top: 0;
            left: 0;
            border: 2px dashed #888;
            box-sizing: border-box;
            pointer-events: none;
        }

        .puzzle-piece {
            position: absolute;
            background-size: cover;
            background-repeat: no-repeat;
            border: 1px solid #555;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.3);
            cursor: grab;
            user-select: none;
            box-sizing: border-box;
            transition: box-shadow 0.1s linear, transform 0.1s linear,
                left 0.3s ease-out, top 0.3s ease-out,
                width 0.3s ease-out, height 0.3s ease-out,
                background-size 0.3s ease-out, background-position 0.3s ease-out;
            z-index: 10;
        }

        .puzzle-piece.dragging {
            cursor: grabbing;
            box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 1000 !important;
            transform: scale(1.05);
            transition: box-shadow 0.1s linear, transform 0.1s linear;
        }

        #winMessage {
            margin-top: 20px;
            padding: 15px;
            background-color: #28a745;
            color: white;
            border-radius: 4px;
            font-size: 1.2em;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            padding: 15px;
            font-size: 0.9em;
            color: #555;
            width: 100%;
            background-color: #f0f0f0;
            border-top: 1px solid #ccc;
        }
    </style>
</head>

                <option value="Anime">Anime</option>
                <option value="Fantasy Art">Fantasy Art</option>
                <option value="Steampunk">Steampunk</option>

                <button class="generatePuzzleBtn" data-difficulty="2">Puzle 2x2 (Test)</button>
                <button class="generatePuzzleBtn" data-difficulty="3">Puzle 3x3</button>
                <button class="generatePuzzleBtn" data-difficulty="4">Puzle 4x4</button>
                <button class="generatePuzzleBtn" data-difficulty="5">Puzle 5x5</button>
                <button id="downloadPuzzleBtn" class="hidden">Descargar Puzle</button>
            </div>
        </div>

        <div class="puzzle-layout hidden" id="puzzleLayoutContainer">
            <div id="piecesHoldingArea">
                <p style="position:relative; margin:0; color:#555; font-size:0.9em;">Piezas Sueltas</p>
            </div>
            <div id="puzzleBoardContainer">
                <div id="puzzleArea">
                    <div id="puzzleBoardOutline"></div>
                    {/* Piezas se añadirán aquí por JS */}
                </div>
            </div>
        </div>
        <div id="winMessage" class="hidden">¡Felicidades! ¡Has completado el puzle!</div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeInput = document.getElementById('themeInput');
            const styleSelector = document.getElementById('styleSelector');
            const generateImageBtn = document.getElementById('generateImageBtn');
            const loadingMessage = document.getElementById('loadingMessage');
            const imagePreviewArea = document.getElementById('imagePreviewArea');
            const generatedImageDisplay = document.getElementById('generatedImageDisplay');
            const puzzleButtonsContainer = document.getElementById('puzzleButtonsContainer');
            const downloadPuzzleBtn = document.getElementById('downloadPuzzleBtn');
            const puzzleLayoutContainer = document.getElementById('puzzleLayoutContainer');
            const piecesHoldingArea = document.getElementById('piecesHoldingArea');
            const puzzleArea = document.getElementById('puzzleArea');
            const winMessage = document.getElementById('winMessage');

            const SNAP_THRESHOLD = 20;
            const MAX_PUZZLE_AREA_WIDTH = 600;
            const MAX_PUZZLE_AREA_HEIGHT = 500;
            // PIECE_HOLDING_AREA_ITEM_HEIGHT removed as direct factor for Y positioning

            let allPieces = [];
            let groups = new Map();
            let originalImageSrc = '';
            let currentDifficulty = 0;
            let puzzleBoardActualWidth = 0;
            let puzzleBoardActualHeight = 0;
            let pieceWidth = 0;
            let pieceHeight = 0;
            let puzzleSolvedState = false;
            let currentImageDataURI = null;
            let currentSelectedStyle = '';

            let activeDrag = {
                isDragging: false, draggedPieceId: null, draggedGroupId: null,
                mouseOffsetX: 0, mouseOffsetY: 0, initialPiecePositions: new Map()
            };

            generateImageBtn.addEventListener('click', async () => {
                const theme = themeInput.value.trim();
                const selectedStyle = styleSelector.value;
                currentSelectedStyle = selectedStyle;

                if (!theme) { alert('Introduce un tema.'); return; }
                if (!selectedStyle) { alert('Por favor, elige un estilo artístico.'); return; }

                loadingMessage.classList.remove('hidden');
                imagePreviewArea.classList.add('hidden');
                puzzleLayoutContainer.classList.add('hidden');
                winMessage.classList.add('hidden');
                downloadPuzzleBtn.classList.add('hidden');
                cleanupPuzzle();
                generateImageBtn.disabled = true; themeInput.disabled = true; styleSelector.disabled = true;

                try {
                    // LLamada al backend para obtener la imagen (API key segura en backend)
                    const backendUrl = 'https://node.proyectodescartes.org/api/ia/image';
                    const prompt = `${theme}, ${selectedStyle}`;

                    const response = await fetch(backendUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            prompt: prompt,
                            width: 1024,
                            height: 768,
                            nologo: true,
                            nofeed: true
                        })
                    });

                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.error || `Error en el servidor: ${response.status}`);
                    }

                    const contentType = response.headers.get("content-type");
                    let imageUrl;

                    if (contentType && contentType.includes("application/json")) {
                        const data = await response.json();
                        imageUrl = data.url || data.output || data.image; // Probar varias posibles claves
                        if (!imageUrl || typeof imageUrl !== 'string') {
                            throw new Error('El servidor no devolvió una URL de imagen válida.');
                        }
                    } else {
                        // Si no es JSON, asumimos que es la imagen binaria (Blob)
                        const blob = await response.blob();
                        imageUrl = URL.createObjectURL(blob);
                    }

                    originalImageSrc = imageUrl;
                    generatedImageDisplay.src = originalImageSrc;

                    await new Promise((resolve, reject) => {
                        generatedImageDisplay.onload = resolve;
                        generatedImageDisplay.onerror = () => reject(new Error('No se pudo cargar la imagen generada.'));
                    });

                    imagePreviewArea.classList.remove('hidden');
                    downloadPuzzleBtn.classList.remove('hidden');

                } catch (error) {
                    console.error("Error en generateImageBtn:", error);
                    alert(error.message || 'Error al generar o procesar la imagen.');
                    originalImageSrc = '';
                    currentImageDataURI = null;
                } finally {
                    loadingMessage.classList.add('hidden');
                    generateImageBtn.disabled = false; themeInput.disabled = false; styleSelector.disabled = false;
                }
            });

            // Actualizar currentImageDataURI cuando cambie la imagen a formato Data URI (Base64)
            // Necesario para que el puzle descargado funcione (los blob: son temporales)
            generatedImageDisplay.addEventListener('load', async () => {
                if (originalImageSrc && !originalImageSrc.startsWith('data:')) {
                    const dataUri = await imageUrlToDataURI(originalImageSrc);
                    if (dataUri) {
                        currentImageDataURI = dataUri;
                    }
                } else {
                    currentImageDataURI = originalImageSrc;
                }
            });

            async function imageUrlToDataURI(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error(`Error HTTP ${response.status} al obtener imagen.`);
                    const blob = await response.blob();
                    return new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onloadend = () => resolve(reader.result);
                        reader.onerror = (err) => reject(new Error("Error de FileReader: " + (err.target && err.target.error ? err.target.error.name : 'desconocido')));
                        reader.readAsDataURL(blob);
                    });
                } catch (error) {
                    console.error("Error convirtiendo URL a Data URI:", error);
                    return null;
                }
            }


            document.querySelectorAll('.generatePuzzleBtn').forEach(button => {
                button.addEventListener('click', (e) => {
                    if (!originalImageSrc) { alert('Primero genera una imagen.'); return; }
                    currentDifficulty = parseInt(e.target.dataset.difficulty);

                    puzzleLayoutContainer.classList.remove('hidden');
                    document.getElementById('piecesHoldingArea').classList.remove('hidden');
                    const outlineEl = document.getElementById('puzzleBoardOutline');
                    if (outlineEl) outlineEl.classList.remove('hidden');
                    puzzleArea.style.opacity = '1';

                    createPuzzle();
                });
            });

            downloadPuzzleBtn.addEventListener('click', () => {
                if (!currentImageDataURI || currentDifficulty === 0) {
                    alert("Primero genera una imagen y luego selecciona una dificultad de puzle (ej. 3x3) para poder descargarla.");
                    return;
                }
                generateDownloadablePuzzle();
            });


            function cleanupPuzzle() {
                puzzleArea.innerHTML = '<div id="puzzleBoardOutline"></div>';
                allPieces = [];
                groups.clear();
                puzzleSolvedState = false;
                winMessage.classList.add('hidden');

                const holdingAreaParagraph = piecesHoldingArea.querySelector('p');
                piecesHoldingArea.innerHTML = '';
                if (holdingAreaParagraph) piecesHoldingArea.appendChild(holdingAreaParagraph);
            }

            function createPuzzle() {
                cleanupPuzzle();
                const img = new Image();
                img.onload = () => {
                    let scale = Math.min(
                        MAX_PUZZLE_AREA_WIDTH / img.width,
                        MAX_PUZZLE_AREA_HEIGHT / img.height,
                        1
                    );
                    puzzleBoardActualWidth = img.width * scale;
                    puzzleBoardActualHeight = img.height * scale;

                    puzzleArea.style.width = `${puzzleBoardActualWidth}px`;
                    puzzleArea.style.height = `${puzzleBoardActualHeight}px`;

                    const outlineEl = document.getElementById('puzzleBoardOutline');
                    if (outlineEl) {
                        outlineEl.style.width = `${puzzleBoardActualWidth}px`;
                        outlineEl.style.height = `${puzzleBoardActualHeight}px`;
                        outlineEl.classList.remove('hidden');
                    }

                    pieceWidth = puzzleBoardActualWidth / currentDifficulty;
                    pieceHeight = puzzleBoardActualHeight / currentDifficulty;

                    const holdingAreaRect = piecesHoldingArea.getBoundingClientRect();
                    const puzzleAreaRectForPlacing = puzzleArea.getBoundingClientRect();
                    const holdingAreaVisualOffsetX = piecesHoldingArea.offsetWidth + 30;
                    const verticalOffsetBetweenContainers = holdingAreaRect.top - puzzleAreaRectForPlacing.top;

                    let yPositionInHoldingArea = 5; // Initial Y inside the holding area (padding from its top)

                    for (let row = 0; row < currentDifficulty; row++) {
                        for (let col = 0; col < currentDifficulty; col++) {
                            const pieceId = `piece-${row}-${col}`;
                            const pieceEl = document.createElement('div');
                            pieceEl.classList.add('puzzle-piece');
                            pieceEl.id = pieceId;
                            pieceEl.style.width = `${pieceWidth}px`;
                            pieceEl.style.height = `${pieceHeight}px`;
                            pieceEl.style.backgroundImage = `url(${originalImageSrc})`;
                            pieceEl.style.backgroundSize = `${puzzleBoardActualWidth}px ${puzzleBoardActualHeight}px`;
                            pieceEl.style.backgroundPosition = `-${col * pieceWidth}px -${row * pieceHeight}px`;

                            const pieceData = {
                                id: pieceId, el: pieceEl, originalRow: row, originalCol: col,
                                currentX: 0, currentY: 0, width: pieceWidth, height: pieceHeight,
                                groupId: pieceId, isPlacedOnBoard: false
                            };
                            allPieces.push(pieceData);
                            groups.set(pieceId, new Set([pieceId]));

                            const randomOffsetX = (Math.random() - 0.5) * (piecesHoldingArea.offsetWidth * 0.5);
                            pieceData.currentX = -holdingAreaVisualOffsetX + randomOffsetX;
                            pieceData.currentY = yPositionInHoldingArea + verticalOffsetBetweenContainers;

                            yPositionInHoldingArea += pieceHeight * 0.25; // Stack with 25% of piece height visible

                            pieceEl.style.left = `${pieceData.currentX}px`;
                            pieceEl.style.top = `${pieceData.currentY}px`;

                            puzzleArea.appendChild(pieceEl);
                            pieceEl.addEventListener('mousedown', onPieceMouseDown);
                        }
                    }
                    shuffleAllPiecesInitialPositions();
                    allPieces.forEach(p => {
                        p.el.style.left = `${p.currentX}px`;
                        p.el.style.top = `${p.currentY}px`;
                    });
                };
                img.onerror = () => alert("Error al cargar la imagen para el puzle (Data URI).");
                img.src = originalImageSrc;
            }

            function shuffleAllPiecesInitialPositions() {
                const positions = allPieces.map(p => ({ x: p.currentX, y: p.currentY }));
                for (let i = positions.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [positions[i], positions[j]] = [positions[j], positions[i]];
                }
                allPieces.forEach((p, i) => {
                    p.currentX = positions[i].x;
                    p.currentY = positions[i].y;
                });
            }
            function onPieceMouseDown(e) {
                if (puzzleSolvedState) return;
                e.preventDefault();
                const pieceId = e.target.id;
                const piece = allPieces.find(p => p.id === pieceId);
                if (!piece) return;

                activeDrag.isDragging = true;
                activeDrag.draggedPieceId = pieceId;
                activeDrag.draggedGroupId = piece.groupId;

                const pieceRect = piece.el.getBoundingClientRect();
                activeDrag.mouseOffsetX = e.clientX - pieceRect.left;
                activeDrag.mouseOffsetY = e.clientY - pieceRect.top;

                activeDrag.initialPiecePositions.clear();
                const groupPieceIds = groups.get(piece.groupId);
                groupPieceIds.forEach(pid => {
                    const p = allPieces.find(item => item.id === pid);
                    p.el.classList.add('dragging');
                    activeDrag.initialPiecePositions.set(pid, { x: p.currentX, y: p.currentY });
                });

                document.addEventListener('mousemove', onDocumentMouseMove);
                document.addEventListener('mouseup', onDocumentMouseUp);
            }
            function onDocumentMouseMove(e) {
                if (!activeDrag.isDragging) return;

                const puzzleAreaRect = puzzleArea.getBoundingClientRect();
                const newClickedPieceX = e.clientX - puzzleAreaRect.left - activeDrag.mouseOffsetX;
                const newClickedPieceY = e.clientY - puzzleAreaRect.top - activeDrag.mouseOffsetY;

                const draggedPieceOriginalPos = activeDrag.initialPiecePositions.get(activeDrag.draggedPieceId);
                const deltaX = newClickedPieceX - draggedPieceOriginalPos.x;
                const deltaY = newClickedPieceY - draggedPieceOriginalPos.y;

                const groupPieceIds = groups.get(activeDrag.draggedGroupId);
                groupPieceIds.forEach(pid => {
                    const piece = allPieces.find(p => p.id === pid);
                    const initialPos = activeDrag.initialPiecePositions.get(pid);
                    piece.currentX = initialPos.x + deltaX;
                    piece.currentY = initialPos.y + deltaY;
                    piece.el.style.left = `${piece.currentX}px`;
                    piece.el.style.top = `${piece.currentY}px`;
                });
            }
            function onDocumentMouseUp(e) {
                if (!activeDrag.isDragging) return;

                const draggedGroupIds = groups.get(activeDrag.draggedGroupId);
                draggedGroupIds.forEach(pid => {
                    const piece = allPieces.find(p => p.id === pid);
                    if (piece && piece.el) piece.el.classList.remove('dragging');
                });

                activeDrag.isDragging = false;
                document.removeEventListener('mousemove', onDocumentMouseMove);
                document.removeEventListener('mouseup', onDocumentMouseUp);

                checkForSnapping(activeDrag.draggedGroupId);
                checkWinCondition();
            }
            function checkForSnapping(draggedGroupId) {
                if (puzzleSolvedState || !groups.has(draggedGroupId)) return;
                const draggedPieceObjects = Array.from(groups.get(draggedGroupId)).map(id => allPieces.find(p => p.id === id)).filter(p => p);


                for (const draggedPiece of draggedPieceObjects) {
                    for (const staticPiece of allPieces) {
                        if (!draggedPiece || !staticPiece || draggedPiece.groupId === staticPiece.groupId) continue;

                        if (staticPiece.originalRow === draggedPiece.originalRow && staticPiece.originalCol + 1 === draggedPiece.originalCol) {
                            const targetX = staticPiece.currentX + staticPiece.width; const targetY = staticPiece.currentY;
                            if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD) {
                                snapGroups(draggedPiece, staticPiece, targetX, targetY); return;
                            }
                        }
                        if (staticPiece.originalRow === draggedPiece.originalRow && staticPiece.originalCol - 1 === draggedPiece.originalCol) {
                            const targetX = staticPiece.currentX - draggedPiece.width; const targetY = staticPiece.currentY;
                            if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD) {
                                snapGroups(draggedPiece, staticPiece, targetX, targetY); return;
                            }
                        }
                        if (staticPiece.originalCol === draggedPiece.originalCol && staticPiece.originalRow + 1 === draggedPiece.originalRow) {
                            const targetX = staticPiece.currentX; const targetY = staticPiece.currentY + staticPiece.height;
                            if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD) {
                                snapGroups(draggedPiece, staticPiece, targetX, targetY); return;
                            }
                        }
                        if (staticPiece.originalCol === draggedPiece.originalCol && staticPiece.originalRow - 1 === draggedPiece.originalRow) {
                            const targetX = staticPiece.currentX; const targetY = staticPiece.currentY - draggedPiece.height;
                            if (Math.abs(draggedPiece.currentX - targetX) < SNAP_THRESHOLD && Math.abs(draggedPiece.currentY - targetY) < SNAP_THRESHOLD) {
                                snapGroups(draggedPiece, staticPiece, targetX, targetY); return;
                            }
                        }
                    }
                }
            }
            function snapGroups(draggedPiece, staticPiece, targetX_for_draggedPiece, targetY_for_draggedPiece) {
                const groupToMoveId = draggedPiece.groupId;
                const targetGroupId = staticPiece.groupId;

                if (groupToMoveId === targetGroupId || !groups.has(groupToMoveId) || !groups.has(targetGroupId)) return;

                const offsetX = targetX_for_draggedPiece - draggedPiece.currentX;
                const offsetY = targetY_for_draggedPiece - draggedPiece.currentY;

                const groupToMovePieceIds = groups.get(groupToMoveId);
                groupToMovePieceIds.forEach(pid => {
                    const p = allPieces.find(item => item.id === pid);
                    if (p) {
                        p.currentX += offsetX;
                        p.currentY += offsetY;
                        p.el.style.left = `${p.currentX}px`;
                        p.el.style.top = `${p.currentY}px`;
                        p.groupId = targetGroupId;
                    }
                });

                const targetGroupPieceIds = groups.get(targetGroupId);
                if (targetGroupPieceIds) {
                    groupToMovePieceIds.forEach(pid => targetGroupPieceIds.add(pid));
                }
                groups.delete(groupToMoveId);

                if (groups.has(targetGroupId)) checkForSnapping(targetGroupId);
                checkWinCondition();
            }

            function checkWinCondition() {
                if (puzzleSolvedState) return;

                if (groups.size === 1) {
                    const singleGroupId = groups.keys().next().value;
                    if (groups.has(singleGroupId) && groups.get(singleGroupId).size === allPieces.length) {

                        alignCompletedPuzzleToBoardOrigin(singleGroupId);

                }
            }
