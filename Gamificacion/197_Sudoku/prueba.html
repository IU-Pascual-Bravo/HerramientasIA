<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de Posibles - Sudoku</title>
<style>
:root{--ink:#102a43;--blue:#0069b4;--paper:#f5f8fa;--peer:#e5f1fb;--match:#d88900}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(135deg,#003c7d,#0069b4 50%,#55afd9);font-family:system-ui,sans-serif;color:var(--ink)}
main{width:min(620px,100%);margin:auto;background:var(--paper);border-radius:20px;padding:clamp(18px,4vw,34px);box-shadow:0 18px 45px #102a4355}h1{text-align:center;margin:0 0 6px}p{text-align:center;color:#52636d}.board{width:min(100%,500px);margin:20px auto 0;display:grid;grid-template-columns:repeat(9,1fr);border:3px solid var(--ink);background:var(--ink)}
.cell{aspect-ratio:1;background:#fff;border:0;border-right:1px solid #b9c0c4;border-bottom:1px solid #b9c0c4;padding:0;font-size:clamp(1rem,5vw,1.8rem);font-weight:700;color:var(--ink);cursor:pointer}.cell:nth-child(3n){border-right:2px solid var(--ink)}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid var(--ink)}.given{background:#e8eee9;cursor:pointer}.peer{background:var(--peer)}.selected{outline:3px solid var(--blue);outline-offset:-3px;position:relative;z-index:1}.value-match{color:#fff;background:var(--match)}
.candidate-cell{display:block;padding:3px;font-size:clamp(.52rem,2.2vw,.8rem);line-height:1;color:#60727d}.candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;height:100%;align-items:center;justify-items:center}.candidate{display:grid;place-items:center;width:100%;height:100%}.candidate.match{color:#fff;background:var(--match)}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}.button{border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:800;color:#fff;background:var(--blue);cursor:pointer}.button.secondary{background:#5b6870}.feedback{height:2em;text-align:center;font-size:2rem}.help{text-align:center;font-size:.9rem}.hidden{display:none!important}
</style>
</head>
<body>
<main>
<h1>Prueba del boton Posibles</h1>
<p>Esta pagina usa un tablero fijo y mantiene el boton habilitado para probar los candidatos.</p>
<div id="board" class="board" role="grid" aria-label="Tablero de prueba"></div>
<div class="actions"><button id="possibles" class="button" type="button" aria-pressed="false">Posibles</button><button id="erase" class="button secondary" type="button">Borrar</button><button id="reset" class="button secondary" type="button">Reiniciar</button></div>
<p class="help">Selecciona un valor asignado para resaltar sus coincidencias. Selecciona una casilla vacia y coloca un numero. El tablero de prueba permite usar Posibles siempre.</p>
<div id="feedback" class="feedback" aria-live="polite"></div>
</main>
<script>
'use strict';
const solution=[[5,3,4,6,7,8,9,1,2],[6,7,2,1,9,5,3,4,8],[1,9,8,3,4,2,5,6,7],[8,5,9,7,6,1,4,2,3],[4,2,6,8,5,3,7,9,1],[7,1,3,9,2,4,8,5,6],[9,6,1,5,3,7,2,8,4],[2,8,7,4,1,9,6,3,5],[3,4,5,2,8,6,1,7,9]];
const initial=[[5,3,0,0,7,0,0,0,0],[6,0,0,1,9,5,0,0,0],[0,9,8,0,0,0,0,6,0],[8,0,0,0,6,0,0,0,3],[4,0,0,8,0,3,0,0,1],[7,0,0,0,2,0,0,0,6],[0,6,0,0,0,0,2,8,0],[0,0,0,4,1,9,0,0,5],[0,0,0,0,8,0,0,7,9]];
let puzzle=initial.map(row=>row.slice()),user={},selected=null,highlightValue=null,showCandidates=false;
const $=id=>document.getElementById(id);
function peersOf(i){const r=Math.floor(i/9),c=i%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3,set=new Set();for(let k=0;k<9;k++){set.add(r*9+k);set.add(k*9+c);}for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++)set.add(rr*9+cc);set.delete(i);return set;}
function possibleNumbers(i){const r=Math.floor(i/9),c=i%9,used=new Set();for(let k=0;k<9;k++){if(puzzle[r][k])used.add(puzzle[r][k]);if(user[r*9+k])used.add(user[r*9+k]);if(puzzle[k][c])used.add(puzzle[k][c]);if(user[k*9+c])used.add(user[k*9+c]);}const br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let rr=br;rr<br+3;rr++)for(let cc=bc;cc<bc+3;cc++){if(puzzle[rr][cc])used.add(puzzle[rr][cc]);if(user[rr*9+cc])used.add(user[rr*9+cc]);}return [1,2,3,4,5,6,7,8,9].filter(n=>!used.has(n));}
function feedback(symbol){$('feedback').textContent=symbol;setTimeout(()=>$('feedback').textContent='',700);}
function render(){const board=$('board');board.innerHTML='';const peers=selected!==null?peersOf(selected):new Set();for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.className='cell';const clue=puzzle[r][c],value=clue||user[i];if(clue){b.textContent=clue;b.classList.add('given');}else if(user[i]){b.textContent=user[i];}else if(showCandidates){const values=possibleNumbers(i),wrap=document.createElement('span');wrap.className='candidates';for(let n=1;n<=9;n++){const candidate=document.createElement('span');candidate.className='candidate';candidate.textContent=values.includes(n)?n:'';if(n===highlightValue&&values.includes(n))candidate.classList.add('match');wrap.appendChild(candidate);}b.appendChild(wrap);b.classList.add('candidate-cell');}else b.textContent='';if(peers.has(i))b.classList.add('peer');if(selected===i)b.classList.add('selected');if(highlightValue&&value===highlightValue)b.classList.add('value-match');b.addEventListener('click',()=>{selected=i;highlightValue=value||null;render();});board.appendChild(b);}$('possibles').textContent=showCandidates?'Ocultar posibles':'Posibles';$('possibles').setAttribute('aria-pressed',String(showCandidates));}
function place(n){if(selected===null||puzzle[Math.floor(selected/9)][selected%9])return;if(n===solution[Math.floor(selected/9)][selected%9]){user[selected]=n;feedback('👼');}else{user[selected]=n;feedback('😈');}selected=null;highlightValue=null;render();}
function reset(){puzzle=initial.map(row=>row.slice());user={};selected=null;highlightValue=null;showCandidates=false;render();}
$('possibles').addEventListener('click',()=>{showCandidates=!showCandidates;render();});$('erase').addEventListener('click',()=>{if(selected!==null&&!puzzle[Math.floor(selected/9)][selected%9])delete user[selected];highlightValue=null;render();});$('reset').addEventListener('click',reset);document.addEventListener('keydown',e=>{if(e.key>='1'&&e.key<='9')place(Number(e.key));if(e.key==='Backspace'||e.key==='Delete'){$('erase').click();}});render();
</script>
</body>
</html>
