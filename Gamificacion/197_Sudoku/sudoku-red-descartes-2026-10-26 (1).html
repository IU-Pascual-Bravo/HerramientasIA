.candidate-cell .candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;height:100%;align-items:center;justify-items:center}
.candidates{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;width:100%;height:100%;align-items:center;justify-items:center}
.value-match,.candidate.match{color:#fff;background:#d88900}

.numbers{display:grid;grid-template-columns:repeat(9,1fr);gap:5px;margin-top:14px}
.number{padding:9px 0;border:1px solid #bfd4cd;border-radius:8px;background:#e8efed;color:var(--verde);font-weight:800}
.number-empty{visibility:hidden;pointer-events:none}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.button{padding:10px 14px;border:0;border-radius:8px;background:var(--azul);color:white;font-weight:700;cursor:pointer}
.button.secondary{background:#5b6870}
.status{text-align:center;color:#52636d;font-size:.9rem}
.best{text-align:center;color:#1f5f52;font-weight:700;font-size:.82rem;margin:2px 0 0}
.hidden{display:none!important}
.logo-row.foot{margin-top:16px}
.logo-row.foot img{height:26px;opacity:.9}
@media(max-height:640px){main{padding:14px}.board{max-width:360px;margin:auto}.numbers{max-width:360px;margin:10px auto 0}}

var mistakesEl=document.getElementById('mistakes'),timerEl=document.getElementById('timer'),bestEl=document.getElementById('best');
var board=document.getElementById('board'),numbers=document.getElementById('numbers'),status=document.getElementById('status');
function peersOf(i){var r=Math.floor(i/9),c=i%9,br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3,set={};for(var k=0;k<9;k++){set[r*9+k]=true;set[k*9+c]=true;}for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++)set[rr*9+cc]=true;delete set[i];return set;}
function filled(n){var c=0;for(var i=0;i<81;i++){var r=Math.floor(i/9),x=i%9;if(puzzle[r][x]===n||(state.user[i]&&state.user[i].value===n))c++;}return c;}
function possibleNumbers(i){var r=Math.floor(i/9),c=i%9,used={};for(var k=0;k<9;k++){if(puzzle[r][k])used[puzzle[r][k]]=true;if(state.user[r*9+k]&&!state.user[r*9+k].wrong)used[state.user[r*9+k].value]=true;if(puzzle[k][c])used[puzzle[k][c]]=true;if(state.user[k*9+c]&&!state.user[k*9+c].wrong)used[state.user[k*9+c].value]=true;}var br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(var rr=br;rr<br+3;rr++)for(var cc=bc;cc<bc+3;cc++){if(puzzle[rr][cc])used[puzzle[rr][cc]]=true;var entry=state.user[rr*9+cc];if(entry&&!entry.wrong)used[entry.value]=true;}return [1,2,3,4,5,6,7,8,9].filter(function(n){return !used[n];});}
function showBest(){var best=readJSON(BEST_KEY,{});bestEl.textContent=best[LEVEL]!=null?('Mejor tiempo en este nivel: '+formatTime(best[LEVEL])):'Aun sin mejor tiempo registrado en este nivel.';}
function stopTimer(){if(state.timerId){clearInterval(state.timerId);state.timerId=null;}}
function startTimer(){stopTimer();state.timerId=setInterval(function(){state.seconds++;timerEl.textContent=formatTime(state.seconds);},1000);}
function saveBestIfNeeded(){var best=readJSON(BEST_KEY,{});if(best[LEVEL]==null||state.seconds<best[LEVEL]){best[LEVEL]=state.seconds;writeJSON(BEST_KEY,best);}showBest();}
 function render(){mistakesEl.textContent=state.ended?'Partida terminada':'Fallos permitidos: '+Math.max(0,2-state.wrongAttempts);document.getElementById('possibles').textContent=state.showCandidates?'Ocultar posibles':'Posibles';document.getElementById('possibles').setAttribute('aria-pressed',String(state.showCandidates));board.innerHTML='';var peers=state.selected!==null?peersOf(state.selected):null;for(var i=0;i<81;i++){var r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.className='cell';var clue=puzzle[r][c],entry=state.user[i];if(clue){b.textContent=clue;b.className+=' given';b.disabled=true;}else if(state.ended){b.textContent=solution[r][c];b.className+=' solution';b.disabled=true;}else if(entry){b.textContent=entry.value;if(entry.wrong)b.className+=' wrong';if(entry.helped)b.className+=' helped';}else if(state.showCandidates){var values=possibleNumbers(i),candidates=document.createElement('span');candidates.className='candidates';values.forEach(function(n){var candidate=document.createElement('span');candidate.textContent=n;candidates.appendChild(candidate);});b.appendChild(candidates);b.className+=' candidate-cell';}if(peers&&peers[i])b.className+=' peer';if(state.selected===i&&!b.disabled)b.className+=' selected';(function(idx,btn){btn.onclick=function(){if(!btn.disabled){state.selected=idx;render();}};})(i,b);board.appendChild(b);}numbers.innerHTML='';for(var n=1;n<=9;n++){var nb=document.createElement('button');nb.className='number';if(filled(n)>=9){nb.className+=' number-empty';nb.tabIndex=-1;}else{nb.textContent=n;(function(num){nb.onclick=function(){place(num);};})(n);}numbers.appendChild(nb);}timerEl.textContent=formatTime(state.seconds);}
function place(n){if(state.ended||state.selected===null)return;var i=state.selected,r=Math.floor(i/9),c=i%9;if(puzzle[r][c])return;if(n===solution[r][c]){state.user[i]={value:n,wrong:false};state.selected=null;status.textContent='';var total=0;for(var k=0;k<81;k++){var rr=Math.floor(k/9),cc=k%9;if(!puzzle[rr][cc])total++;}if(Object.keys(state.user).length===total){state.ended=true;stopTimer();status.textContent='Felicitaciones! Has resuelto el Sudoku en '+formatTime(state.seconds)+'.';saveBestIfNeeded();}}else{state.wrongAttempts++;state.user[i]={value:n,wrong:true};status.textContent='Numero incorrecto.';if(state.wrongAttempts>=3){state.ended=true;stopTimer();status.textContent='Se cometieron tres fallos. La solucion se muestra en azul.';}}render();}
function erase(){for(var i in state.user)if(state.user[i].wrong)delete state.user[i];status.textContent='';render();}
function help(){if(state.ended||state.helpUsed)return;state.helpUsed=true;document.getElementById('help').style.display='none';var missing=[];for(var i=0;i<81;i++){var r=Math.floor(i/9),c=i%9;if(!puzzle[r][c]&&!state.user[i])missing.push(i);}if(!missing.length)return;var i2=missing[Math.floor(Math.random()*missing.length)],r2=Math.floor(i2/9),c2=i2%9;state.user[i2]={value:solution[r2][c2],wrong:false,helped:true};state.selected=null;render();}
function newOffline(){var res=localPuzzle(CLUES);puzzle=res.puzzle;solution=res.solution;state={user:{},selected:null,wrongAttempts:0,helpUsed:false,showCandidates:false,ended:false,seconds:0,timerId:null};document.getElementById('help').style.display='';status.textContent='Nuevo sudoku offline generado (nivel '+LEVEL_LABEL+').';render();startTimer();}
 function hasObviousMove(){for(var i=0;i<81;i++)if(!puzzle[Math.floor(i/9)][i%9]&&!state.user[i]&&possibleNumbers(i).length===1)return true;return false;}
 function render(){if(state.selected===null)state.highlightValue=null;mistakesEl.textContent=state.ended?'Partida terminada':'Fallos permitidos: '+Math.max(0,2-state.wrongAttempts);var candidatesHidden=state.ended||hasObviousMove();if(candidatesHidden)state.showCandidates=false;var possibleButton=document.getElementById('possibles');possibleButton.classList.toggle('hidden',candidatesHidden);possibleButton.textContent=state.showCandidates?'Ocultar posibles':'Posibles';possibleButton.setAttribute('aria-pressed',String(state.showCandidates));board.innerHTML='';var peers=state.selected!==null?peersOf(state.selected):null;for(var i=0;i<81;i++){var r=Math.floor(i/9),c=i%9,b=document.createElement('button');b.className='cell';var clue=puzzle[r][c],entry=state.user[i],value=clue||(entry&&entry.value);if(clue){b.textContent=clue;b.className+=' given';if(state.highlightValue===clue)b.className+=' value-match';}else if(state.ended){b.textContent=solution[r][c];b.className+=' solution';b.disabled=true;}else if(entry){b.textContent=entry.value;if(entry.wrong)b.className+=' wrong';if(entry.helped)b.className+=' helped';if(state.highlightValue===value)b.className+=' value-match';}else if(state.showCandidates&&!candidatesHidden){var values=possibleNumbers(i),wrap=document.createElement('span');wrap.className='candidates';for(var n=1;n<=9;n++){var candidate=document.createElement('span');candidate.className='candidate';candidate.textContent=values.indexOf(n)!==-1?n:'';if(n===state.highlightValue&&values.indexOf(n)!==-1)candidate.className+=' match';wrap.appendChild(candidate);}b.appendChild(wrap);b.className+=' candidate-cell';}if(peers&&peers[i])b.className+=' peer';if(state.selected===i)b.className+=' selected';(function(idx,btn,cellValue){btn.onclick=function(){if(!btn.disabled){state.selected=idx;state.highlightValue=cellValue||null;render();}};})(i,b,value);board.appendChild(b);}numbers.innerHTML='';for(var number=1;number<=9;number++){var nb=document.createElement('button');nb.className='number';if(filled(number)>=9){nb.className+=' number-empty';nb.tabIndex=-1;}else{nb.textContent=number;(function(num){nb.onclick=function(){place(num);};})(number);}numbers.appendChild(nb);}timerEl.textContent=formatTime(state.seconds);}
 function showFeedback(symbol){var feedback=document.getElementById('feedback');feedback.textContent=symbol;feedback.classList.remove('show');void feedback.offsetWidth;feedback.classList.add('show');clearTimeout(showFeedback.timer);showFeedback.timer=setTimeout(function(){feedback.classList.remove('show');feedback.textContent='';},800);}
 function place(n){if(state.ended||state.selected===null)return;var i=state.selected,r=Math.floor(i/9),c=i%9;if(puzzle[r][c])return;if(n===solution[r][c]){showFeedback('👼');state.user[i]={value:n,wrong:false};state.selected=null;state.highlightValue=null;var total=0;for(var k=0;k<81;k++){var rr=Math.floor(k/9),cc=k%9;if(!puzzle[rr][cc])total++;}if(Object.keys(state.user).length===total){state.ended=true;stopTimer();status.textContent='Felicitaciones! Has resuelto el Sudoku en '+formatTime(state.seconds)+'.';saveBestIfNeeded();}}else{showFeedback('😈');state.wrongAttempts++;state.user[i]={value:n,wrong:true};status.textContent='Numero incorrecto.';if(state.wrongAttempts>=3){state.ended=true;stopTimer();status.textContent='Se cometieron tres fallos. La solucion se muestra en azul.';}}render();}
 function toggleCandidates(){if(state.ended||hasObviousMove())return;state.showCandidates=!state.showCandidates;render();}
document.getElementById('erase').addEventListener('click',erase);
document.getElementById('help').addEventListener('click',help);
 document.getElementById('possibles').addEventListener('click',toggleCandidates);
document.getElementById('offline').addEventListener('click',newOffline);
document.getElementById('theme').addEventListener('change',function(e){document.body.style.background=THEMES[e.target.value]||THEMES.original;document.body.style.backgroundAttachment='fixed';});
document.addEventListener('keydown',function(e){if(e.key>='1'&&e.key<='9')place(Number(e.key));if((e.key==='Backspace'||e.key==='Delete')&&state.selected!==null&&!state.ended){delete state.user[state.selected];render();}});
showBest();render();startTimer();
</script></body></html>
