<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Giratorio de 16 Piezas con Zoom</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap');

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .brand-logo {
      position: fixed;
      top: 16px;
      z-index: 20;
      width: min(20vw, 220px);
      height: auto;
      object-fit: contain;
    }

    .brand-logo-left {
      left: 20px;
    }

    .brand-logo-right {
      right: 20px;
      width: min(24vw, 280px);
    }

    .puzzle-container {
      display: grid;
      gap: 2px;
      max-width: 100%;
      width: 400px;
      height: 400px;
      background-color: #333;
      padding: 2px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .puzzle-piece {
      width: 100%;
      height: 100%;
      background-size: 400% 400%;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .puzzle-piece:hover {
      transform: scale(1.05);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    #messageContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      display: none;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      font-family: 'Playfair Display', serif;
      width: 80%;
    }

    #loadingMessage {
      font-size: 18px;
      color: #666;
      text-align: center;
    }

    @media (max-width: 480px) {
      .brand-logo {
        top: 10px;
        width: 28vw;
      }

      .brand-logo-left {
        left: 10px;
      }

      .brand-logo-right {
        right: 10px;
        width: 34vw;
      }

      .puzzle-container {
        width: 300px;
        height: 300px;
      }

      .puzzle-piece {
        background-size: 300% 300%;
      }
    }

    .input-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #promptInput {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 300px;
    }

    #generateButton {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #downloadButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #downloadButton:hover {
      background-color: #1976D2;
    }

    .button-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    #resetButton,
    #downloadButton {
      margin-top: 0;
    }

    .selector-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .size-selector {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .size-selector.active {
      background-color: #45a049;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }

    .size-selector:hover {
      background-color: #45a049;
    }

    .status-container {
      margin-bottom: 20px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .status-text {
      color: #28a745;
      font-weight: bold;
      margin: 0;
    }

    @media (max-width: 480px) {

      .input-container,
      .status-container {
        flex-direction: column;
        width: 100%;
      }

      #promptInput {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <img class="brand-logo brand-logo-left" src="logoPB0.png" alt="Logo institucional">
  <img class="brand-logo brand-logo-right" src="logo_escuela.png" alt="Escuela de Pensamiento Educativo y Pedagógico">

  <h1>Puzzle Giratorio</h1>
  <div class="selector-container">
    <button class="size-selector active" data-size="3">3x3</button>
    <button class="size-selector" data-size="4">4x4</button>
    <button class="size-selector" data-size="5">5x5</button>
    <button class="size-selector" data-size="6">6x6</button>
    <button class="size-selector" data-size="7">7x7</button>
  </div>
  
  <!-- Reemplazado el contenedor de API key por un mensaje de estado -->
  <div class="status-container">
    <p class="status-text">✓ Servicio de imágenes activo</p>
  </div>

  <div class="input-container">
    <input type="text" id="promptInput" placeholder="Ingresa el tema de la imagen">
    <button id="generateButton">Generar</button>
  </div>
  
  <div class="puzzle-container" id="puzzleContainer">
    <div id="loadingMessage">Cargando imagen...</div>
  </div>
  
  <div id="messageContainer">
    <p id="message"></p>
    <button id="playAgainButton">Jugar de nuevo</button>
  </div>
  
  <div class="button-container">
    <button id="resetButton">Reiniciar Puzzle</button>
    <button id="downloadButton">Descargar Puzzle</button>
  </div>

  <script>
    const puzzleContainer = document.getElementById('puzzleContainer');
    const resetButton = document.getElementById('resetButton');
    const messageContainer = document.getElementById('messageContainer');
    const message = document.getElementById('message');
    const playAgainButton = document.getElementById('playAgainButton');
    const loadingMessage = document.getElementById('loadingMessage');
    const promptInput = document.getElementById('promptInput');
    const generateButton = document.getElementById('generateButton');
    const downloadButton = document.getElementById('downloadButton');
    const sizeSelectors = document.querySelectorAll('.size-selector');

    // Eliminado: Manejo de API key en frontend
    // La API key ahora se maneja en el backend

    let imageUrl = ''; // Se cargará desde el backend
    let positions = [];
    let rotations = [];
    let scale = 1;
    let gridSize = 3;
    let currentPrompt = 'Un paisaje estilo Miró/negative/no borroso, no deformado,Baroque';
    let currentSeed = 296;

    sizeSelectors.forEach(selector => {
      selector.addEventListener('click', () => {
        sizeSelectors.forEach(s => s.classList.remove('active'));
        selector.classList.add('active');
        gridSize = parseInt(selector.dataset.size);
        initPuzzle();
      });
    });

    // Nueva función para obtener imagen desde el backend
    async function fetchImageFromBackend(prompt, seed = null) {
      const randomSeed = seed || Math.floor(Math.random() * 1000);
      
      const response = await fetch('https://node.proyectodescartes.org/api/ia/image', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          prompt: prompt,
          model: 'zimage',
          seed: randomSeed,
          width: 1024,
          height: 1024,
          enhance: false,
          refine: false,
          nologo: true
        })
      });

      if (!response.ok) {
        throw new Error('Error al generar imagen en el servidor');
      }

      const blob = await response.blob();
      return URL.createObjectURL(blob);
    }

    function createPuzzlePieces() {
      puzzleContainer.innerHTML = '';
      const totalPieces = gridSize * gridSize;
      positions = Array.from({ length: totalPieces }, (_, i) => i);
      rotations = Array.from({ length: totalPieces }, () => Math.floor(Math.random() * 4) * 90);

      puzzleContainer.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;

      for (let i = 0; i < totalPieces; i++) {
        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.style.backgroundImage = `url(${imageUrl})`;
        piece.style.backgroundSize = `${gridSize * 100}% ${gridSize * 100}%`;
        updatePiecePosition(piece, i);
        piece.addEventListener('click', () => rotatePiece(piece, i));
        puzzleContainer.appendChild(piece);
      }
      loadingMessage.style.display = 'none';
    }

    function updatePiecePosition(piece, index) {
      const x = positions[index] % gridSize;
      const y = Math.floor(positions[index] / gridSize);
      piece.style.backgroundPosition = `${-x * (100 / (gridSize - 1) * (gridSize - 1))}% ${-y * (100 / (gridSize - 1) * (gridSize - 1))}%`;
      piece.style.transform = `rotate(${rotations[index]}deg)`;
    }

    function rotatePiece(piece, index) {
      rotations[index] += 90;
      piece.style.transform = `rotate(${rotations[index]}deg)`;
      checkWin();
    }

    function checkWin() {
      if (rotations.every(rotation => rotation % 360 === 0)) {
        setTimeout(() => {
          message.textContent = '¡Felicidades! Has completado el puzzle.';
          messageContainer.style.display = 'block';
        }, 300);
      }
    }

    async function initPuzzle() {
      messageContainer.style.display = 'none';
      loadingMessage.style.display = 'block';
      loadingMessage.textContent = 'Generando imagen...';
      puzzleContainer.innerHTML = '<div id="loadingMessage">Generando imagen...</div>';
      scale = 1;
      puzzleContainer.style.transform = `scale(${scale})`;

      try {
        // Si no hay imageUrl, generar una con el prompt por defecto
        if (!imageUrl) {
          imageUrl = await fetchImageFromBackend(currentPrompt, currentSeed);
        }

        const img = new Image();
        img.onload = createPuzzlePieces;
        img.onerror = () => {
          loadingMessage.textContent = 'Error al cargar la imagen. Intentando de nuevo...';
          setTimeout(initPuzzle, 2000);
        };
        img.src = imageUrl;
      } catch (error) {
        console.error('Error al obtener la imagen:', error);
        loadingMessage.textContent = 'Error al cargar la imagen. Intentando de nuevo...';
        setTimeout(initPuzzle, 2000);
      }
    }

    async function downloadPuzzle() {
      const cssStyles = document.querySelector('style').innerHTML;

      // Convertir la imagen a Base64 usando el backend
      let imageBase64 = '';
      try {
        // Hacemos fetch a la imagen actual (que ya es un blob URL) o regeneramos via backend
        const response = await fetch(imageUrl);
        const blob = await response.blob();
        imageBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(blob);
        });
      } catch (error) {
        console.error('Error al convertir imagen a Base64:', error);
        alert('Error al procesar la imagen para descarga');
        return;
      }

      const scriptContent = `
        const puzzleContainer = document.getElementById('puzzleContainer');
        const messageContainer = document.getElementById('messageContainer');
        const message = document.getElementById('message');
        const playAgainButton = document.getElementById('playAgainButton');
        const resetButton = document.getElementById('resetButton');

        const imageUrl = "${imageBase64}";
        const gridSize = ${gridSize};
        
        let positions = [];
        let rotations = [];
        let scale = 1;

        function createPuzzlePieces() {
          puzzleContainer.innerHTML = '';
          const totalPieces = gridSize * gridSize;
          positions = Array.from({length: totalPieces}, (_, i) => i);
          rotations = Array.from({length: totalPieces}, () => Math.floor(Math.random() * 4) * 90);

          puzzleContainer.style.gridTemplateColumns = 'repeat(' + gridSize + ', 1fr)';

          for (let i = 0; i < totalPieces; i++) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.style.backgroundImage = 'url(' + imageUrl + ')';
            piece.style.backgroundSize = (gridSize * 100) + '% ' + (gridSize * 100) + '%';
            updatePiecePosition(piece, i);
            piece.addEventListener('click', () => rotatePiece(piece, i));
            puzzleContainer.appendChild(piece);
          }
        }

        function updatePiecePosition(piece, index) {
          const x = positions[index] % gridSize;
          const y = Math.floor(positions[index] / gridSize);
          const factor = 100 / (gridSize - 1) * (gridSize - 1);
          piece.style.backgroundPosition = (-x * factor) + '% ' + (-y * factor) + '%';
          piece.style.transform = 'rotate(' + rotations[index] + 'deg)';
        }

        function rotatePiece(piece, index) {
          rotations[index] += 90;
          piece.style.transform = 'rotate(' + rotations[index] + 'deg)';
          checkWin();
        }

        function checkWin() {
          if (rotations.every(rotation => rotation % 360 === 0)) {
            setTimeout(() => {
              message.textContent = '¡Felicidades! Has completado el puzzle.';
              messageContainer.style.display = 'block';
            }, 300);
          }
        }

        resetButton.addEventListener('click', createPuzzlePieces);
        playAgainButton.addEventListener('click', () => {
          messageContainer.style.display = 'none';
          createPuzzlePieces();
        });

        puzzleContainer.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? -0.1 : 0.1;
          scale = Math.max(0.5, Math.min(2, scale + delta));
          puzzleContainer.style.transform = 'scale(' + scale + ')';
        });

        createPuzzlePieces();
      `;

      const cleanHtml = `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle ${gridSize}x${gridSize}</title>
  <style>
    ${cssStyles}
    .input-container, .selector-container, #downloadButton, .status-container { display: none !important; }
    body { background-color: #f0f0f0; }
  </style>
</head>
<body>
  <h1>Puzzle Giratorio</h1>
  <div class="puzzle-container" id="puzzleContainer"></div>
  <div id="messageContainer">
    <p id="message"></p>
    <button id="playAgainButton">Jugar de nuevo</button>
  </div>
  <div class="button-container">
    <button id="resetButton">Reiniciar Puzzle</button>
  </div>
  <script>${scriptContent}<\/script>
</body>
</html>`;

      const blob = new Blob([cleanHtml], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `puzzle_${gridSize}x${gridSize}.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    generateButton.addEventListener('click', async () => {
      const prompt = promptInput.value.trim();
      
      if (!prompt) {
        alert('Por favor, ingresa un tema para la imagen');
        return;
      }

      // Deshabilitar botón durante la generación
      generateButton.disabled = true;
      generateButton.textContent = 'Generando...';

      try {
        currentPrompt = prompt;
        currentSeed = Math.floor(Math.random() * 1000);
        imageUrl = await fetchImageFromBackend(currentPrompt, currentSeed);
        initPuzzle();
      } catch (error) {
        console.error('Error:', error);
        alert('Error al generar la imagen: ' + error.message);
      } finally {
        generateButton.disabled = false;
        generateButton.textContent = 'Generar';
      }
    });

    resetButton.addEventListener('click', initPuzzle);
    
    playAgainButton.addEventListener('click', () => {
      messageContainer.style.display = 'none';
      // Re-barajar las piezas
      createPuzzlePieces();
    });

    downloadButton.addEventListener('click', async () => {
      const originalText = downloadButton.textContent;
      downloadButton.textContent = 'Procesando...';
      downloadButton.disabled = true;

      try {
        await downloadPuzzle();
      } finally {
        downloadButton.textContent = originalText;
        downloadButton.disabled = false;
      }
    });

    puzzleContainer.addEventListener('wheel', (e) => {
      e.preventDefault();
      const delta = e.deltaY > 0 ? -0.1 : 0.1;
      scale = Math.max(0.5, Math.min(2, scale + delta));
      puzzleContainer.style.transform = `scale(${scale})`;
    });

    // Iniciar al cargar
    initPuzzle();
  </script>
</body>

</html>
