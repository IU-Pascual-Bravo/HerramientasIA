
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle 5x5</title>
  <style>
    
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&display=swap');

    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .brand-logo {
      position: fixed;
      top: 16px;
      z-index: 20;
      width: min(20vw, 220px);
      height: auto;
      object-fit: contain;
    }

    .brand-logo-left {
      left: 20px;
    }

    .brand-logo-right {
      right: 20px;
      width: min(24vw, 280px);
    }

    .puzzle-container {
      display: grid;
      gap: 2px;
      max-width: 100%;
      width: 400px;
      height: 400px;
      background-color: #333;
      padding: 2px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .puzzle-piece {
      width: 100%;
      height: 100%;
      background-size: 400% 400%;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .puzzle-piece:hover {
      transform: scale(1.05);
    }

    h1 {
      margin-bottom: 20px;
      color: #333;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #45a049;
    }

    #messageContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(255, 255, 255, 0.9);
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      color: #333;
      display: none;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
      font-family: 'Playfair Display', serif;
      width: 80%;
    }

    #loadingMessage {
      font-size: 18px;
      color: #666;
      text-align: center;
    }

    @media (max-width: 480px) {
      .brand-logo {
        top: 10px;
        width: 28vw;
      }

      .brand-logo-left {
        left: 10px;
      }

      .brand-logo-right {
        right: 10px;
        width: 34vw;
      }

      .puzzle-container {
        width: 300px;
        height: 300px;
      }

      .puzzle-piece {
        background-size: 300% 300%;
      }
    }

    .input-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    #promptInput {
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 5px;
      width: 300px;
    }

    #generateButton {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #downloadButton {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #downloadButton:hover {
      background-color: #1976D2;
    }

    .button-container {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    #resetButton,
    #downloadButton {
      margin-top: 0;
    }

    .selector-container {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .size-selector {
      padding: 8px 15px;
      font-size: 16px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .size-selector.active {
      background-color: #45a049;
      box-shadow: 0 0 5px rgba(0, 0, 0, 0.3);
    }

    .size-selector:hover {
      background-color: #45a049;
    }

    .status-container {
      margin-bottom: 20px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      text-align: center;
    }

    .status-text {
      color: #28a745;
      font-weight: bold;
      margin: 0;
    }

    @media (max-width: 480px) {

      .input-container,
      .status-container {
        flex-direction: column;
        width: 100%;
      }

      #promptInput {
        width: 100%;
      }
    }
  
    .input-container, .selector-container, #downloadButton, .status-container { display: none !important; }
    body { background-color: #f0f0f0; }
  </style>
</head>

        const gridSize = 5;
        
        let positions = [];
        let rotations = [];
        let scale = 1;

        function createPuzzlePieces() {
          puzzleContainer.innerHTML = '';
          const totalPieces = gridSize * gridSize;
          positions = Array.from({length: totalPieces}, (_, i) => i);
          rotations = Array.from({length: totalPieces}, () => Math.floor(Math.random() * 4) * 90);

          puzzleContainer.style.gridTemplateColumns = 'repeat(' + gridSize + ', 1fr)';

          for (let i = 0; i < totalPieces; i++) {
            const piece = document.createElement('div');
            piece.className = 'puzzle-piece';
            piece.style.backgroundImage = 'url(' + imageUrl + ')';
            piece.style.backgroundSize = (gridSize * 100) + '% ' + (gridSize * 100) + '%';
            updatePiecePosition(piece, i);
            piece.addEventListener('click', () => rotatePiece(piece, i));
            puzzleContainer.appendChild(piece);
          }
        }

        function updatePiecePosition(piece, index) {
          const x = positions[index] % gridSize;
          const y = Math.floor(positions[index] / gridSize);
          const factor = 100 / (gridSize - 1) * (gridSize - 1);
          piece.style.backgroundPosition = (-x * factor) + '% ' + (-y * factor) + '%';
          piece.style.transform = 'rotate(' + rotations[index] + 'deg)';
        }

        function rotatePiece(piece, index) {
          rotations[index] += 90;
          piece.style.transform = 'rotate(' + rotations[index] + 'deg)';
          checkWin();
        }

        function checkWin() {
          if (rotations.every(rotation => rotation % 360 === 0)) {
            setTimeout(() => {
              message.textContent = '¡Felicidades! Has completado el puzzle.';
              messageContainer.style.display = 'block';
            }, 300);
          }
        }

        resetButton.addEventListener('click', createPuzzlePieces);
        playAgainButton.addEventListener('click', () => {
          messageContainer.style.display = 'none';
          createPuzzlePieces();
        });

        puzzleContainer.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY > 0 ? -0.1 : 0.1;
          scale = Math.max(0.5, Math.min(2, scale + delta));
          puzzleContainer.style.transform = 'scale(' + scale + ')';
        });

        createPuzzlePieces();
      </script>
