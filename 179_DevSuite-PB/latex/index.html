<!DOCTYPE html>

<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KaTeX</title>
    <link rel="stylesheet" href="css/index.css">
    <script defer src="js/index.js" type="text/javascript"></script>

	
	  <!-- inclusión de la biblioteca KaTex -->
  <link rel="stylesheet" type="text/css" href="css/katex.min.css"/>
  <script src="js/katex.min.js"></script>
  <script src="katex/auto-render.min.js" ></script>

  <!-- Opcional en caso de requerir formulas químicas -->
  <script src="katex/mhchem.min.js"></script>
  </head>

  <body>
    <div class="header"><div class="container">
      <div class="demo">
        <div class="demo-left">
          <div class="demo-instructions">
            <label for="demo-input">Escribe una expresión; por ejemplo, \frac{x}{y+2}</label>
 
            </a>
          </div>
          <textarea style="font-size:28px" id="demo-input" spellcheck="false"></textarea>
        </div>
        <div class="demo-right">
          <div class="demo-instructions">
            Observa cómo se muestra en <span class="tex" data-expr="\KaTeX">KaTeX</span>:
          </div>
          <div style="font-size:28px" id="demo-output"></div>
        </div>
      </div>
    </div></div>


    <div id="options-panel">
      <h3>KaTeX Options</h3>
      <table>
        <tr>
          <td><label for="displayMode">displayMode</label></td>
          <td><input type="checkbox" id="displayMode" checked/></td>
        </tr>
        <tr>
          <td><label for="leqno">leqno</label></td>
          <td><input type="checkbox" id="leqno"/></td>
        </tr>
        <tr>
          <td><label for="fleqn">fleqn</label></td>
          <td><input type="checkbox" id="fleqn"/></td>
        </tr>
        <tr>
          <td><label for="throwOnError">throwOnError</label></td>
          <td><input type="checkbox" id="throwOnError" checked/></td>
        </tr>
        <tr>
          <td><label for="errorColor">errorColor</label></td>
          <td><input type="color" id="errorColor" value="#cc0000"/></td>
        </tr>
        <tr>
          <td><label for="strict">strict</label></td>
          <td>
            <select id="strict">
              <option value="error">error</option>
              <option value="warn" selected>warn</option>
              <option value="ignore">ignore</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="output">output</label></td>
          <td>
            <select id="output">
              <option value="htmlAndMathml" selected>htmlAndMathml</option>
              <option value="html">html</html>
              <option value="mathml">mathml</option>
            </select>
          </td>
        </tr>
        <tr>
          <td><label for="trust">trust</label></td>
          <td><input type="checkbox" id="trust"/></td>
        </tr>
      </table>
      <h4><label for="macros">macros</label></h4>
      <textarea id="macros" placeholder="JSON">
{
    "\\f": "#1f(#2)"
}</textarea>


    </div>

  </body>
</html>
