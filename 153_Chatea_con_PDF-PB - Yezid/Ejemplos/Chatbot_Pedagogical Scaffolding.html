<script>
    const BACKEND_URL = 'https://node.proyectodescartes.org/api/ia/text';
     const PDF_TEXT = "Title: Pedagogical Scaffolding for Generative AI-Supported Self-Directed Learning: A Qualitative Study of the CRAFT Framework\n\nURL Source: https://www.mdpi.com/3042-8130/2/4/33\n\nPublished Time: Tue, 13 Oct 2026 10:20:05 GMT\n\nMarkdown Content:\n* Article\n\n* ![Image 1: Open Access](https://mdpi-res.com/data/open-access.svg) \n\n3 October 2026\n\n28 Pages\n\n,\n\nand\n\n1\n\nNational Institute of Education, Nanyang Technological University, Singapore 637616, Singapore\n\n2\n\nChua Chu Kang Secondary School, Singapore 688848, Singapore\n\n*\n\nAuthor to whom correspondence should be addressed.\n\n## Abstract\n\nThis study investigates how generative Artificial Intelligence (AI) can scaffold self-directed learning (SDL) in secondary classrooms. Focusing on the interaction between teacher facilitation and AI affordances, it examines and refines the Content–Response–AI&peers–Fusion–reflecT (CRAFT) framework as a practitioner-informed pedagogical scaffold for operationalizing aspects of the Process dimension of the Person–Process–Context (PPC) model. The study addresses a persistent gap between SDL theory and classroom practice by examining how learner agency can be cultivated within AI-supported learning environments. Adopting a qualitative multi-case study design, the research analyzed instructional practices, lesson artifacts, and reflective accounts from six experienced educators from a secondary school in Singapore across one academic year. Data were analyzed using a theoretically informed, hybrid deductive–inductive thematic analysis, enabling cross-case examination and iterative refinement of CRAFT in relation to the PPC model. Findings indicate that while generative AI supports goal setting, idea generation, and iterative feedback, the metacognitive and reflective dimensions of SDL remain underdeveloped without deliberate teacher mediation. Teachers remain critical orchestrators of AI and peer interactions, supporting disciplinary sense-making and learner autonomy rather than positioning AI as a standalone instructional aid. Overall, this study integrates a practitioner-informed and empirically refined pedagogical scaffold with an established theoretical model, offering a theoretically grounded, context-sensitive pedagogical guide for designing learning experiences that support opportunities for student agency.\n\n## 1. Introduction\n\nSelf-directed learning (SDL) is considered as learning in which the conceptualization, design, conduct, and evaluation are directed by the learner (Brookfield, 2009), and the approach has been framed, over the years, as a developmental or instructional process, goal, or a learner’s personal characteristic (Brockett & Hiemstra, 1991; Hiemstra & Brockett, 2012). SDL represents a fundamental shift for educators, as it transitions them from a position of sole knowledge dissemination to that of a facilitator, motivator, and learning environment architect, with educators often assuming the role of co-learner alongside their students (e.g., Abraham et al., 2005), engaging in the acquisition of new instructional skills and broadening their knowledge beyond their existing expertise. Accordingly, SDL has long been regarded as an approach that fosters learner autonomy, mastery, and purpose within the educational process (Robinson & Persky, 2020). These learning gains and benefits are further extended when SDL environments are intentionally designed, resulting in increased student motivation, confidence, and self-belief (Boyer et al., 2014).\n\n### 1.1. SDL in Formal Education\n\nWhen SDL is enacted in school classrooms, it is perceived to be grounded in learner autonomy and motivation arising from students taking responsibility for their learning needs, goals, processes, and outcomes (du Toit-Brits & van Zyl, 2017; Knowles, 1975). However, translating these ideals into everyday classroom practice remains challenging, particularly within one-to-many contexts dominated by teacher-led instruction (Ali et al., 2023). Further, expectations for learners to independently initiate and sustain SDL are often idealistic, given that agency as a construct encompasses both internal and external dimensions, conceptualized as personal, relational, and participatory components (Marín et al., 2024).\n\nIn this study, student agency is therefore conceptualized not as an isolated trait but as relational agency (Edwards, 2005). Within this framing, agency refers to learners’ capacity to purposefully engage with generative Artificial Intelligence (AI) tools to extend their problem-solving capabilities. Specifically, students’ intentionality and forethought (Bandura, 2001) are interpreted only where these processes become visible through actions or behaviors, as students negotiate shared agency with generative AI, where agency is distributed across learners, teachers, and intelligent tools in pursuit of self-directed goals.\n\nImportantly, agency and SDL are often distributed across networked relations of people, objects, practices and temporal–spatial arrangements (Leander & Lovvorn, 2006). While it is desirable to foster SDL in formal education settings, structural constraints (e.g., teacher capacity, instructional materials) and time-bound implementations (e.g., pilot studies, short-term trials) tend to result in mixed self-directed outcomes (Morris, 2019). At the same time, increasing reliance on technology introduces additional tensions, including distractions, reduced concentration, and cognitive fatigue (Shao et al., 2022). Compounding these issues are inconsistent student support and uneven student competence, which pose broader systemic barriers to sustained SDL adoption by students (Morris & Rohs, 2023). Together, these challenges highlight the need for carefully structured environments that balance autonomy with pedagogical support, rather than assuming that technology alone can foster effective SDL.\n\n### 1.2. Generative AI for SDL: Opportunities and Research Gaps\n\nAgainst this backdrop of structural and pedagogical constraints, the rapid advancement of artificial intelligence (AI) in education presents new opportunities to reconfigure how SDL is supported in formal learning settings. Generative AI, for example, can scale personalized feedback for SDL in language learning and writing (Li et al., 2024; Wang et al., 2024), addressing limitations inherent in one-to-many instruction. Similarly, AI-generated content and visualizations can provide accessible entry points for learners to initiate and guide their own learning processes (Law, 2024; Koh et al., 2024). Beyond improving instructional efficiency, generative AI reshapes how agency is enacted within learning environments by redistributing roles traditionally held by teachers, students, experts, and tools (Hwang & Chen, 2023). While prior studies have examined student agency in technology-enhanced learning (Marín et al., 2024) and teacher-led SDL contexts (Slavit & Roth McDuffie, 2013), research on generative AI-supported knowledge creation has similarly emphasized the importance of pedagogical design in structuring productive learner engagement (Lee et al., 2023), yet integrated frameworks that systematically align teacher scaffolding with AI-mediated support for SDL in school settings remain underdeveloped.\n\nHence, despite the promise of generative AI, a persistent gap remains between theoretical potential and practical enactment of SDL in schools. This gap is reflected in limited empirical attention to SDL within school contexts (Morris, 2018) and the relatively low prioritization of SDL in institutional agendas (Kranzow & Hyland, 2016). Given the nascent state of research on generative AI in SDL (Lashari & Umrani, 2023), this study seeks to conceptualize and empirically examine how pedagogical structuring can support SDL within AI-mediated learning environments.\n\n### 1.3. Study Purpose and Research Questions\n\nTo address this gap, this study employed a qualitative multi-case study design and thematic analysis of students’ learning artifacts and teachers’ practices collected over one academic year within a secondary school. The study intentionally focused on information-rich teacher cases spanning multiple subject disciplines, enabling analytic rather than statistical generalization through cross-case comparison. Although situated within a single institutional context, the variation in disciplinary practices, AI implementations, and pedagogical approaches provides a robust basis for examining recurring patterns and developing transferable design insights. Document and content analyses revealed common challenges and opportunities in generative AI-supported SDL that contributed to the examination and iterative refinement of the CRAFT pedagogical scaffold.\n\nSpecifically, this study examines and refines a Content–Response–AI&peers–Fusion–reflecT (CRAFT) framework that operationalizes selected aspects of the Process dimension of the PPC model while remaining situated within the broader Person and Context dimensions. CRAFT was designed to guide teachers in structuring learning activities involving learner responses, AI and peer contributions, synthesis, and reflection to create opportunities for SDL. Although SDL is learner-centered, effective implementation in secondary education requires deliberate teacher scaffolding (Process) and supportive technological and institutional conditions (Context). Accordingly, this study adopts a teacher-centric inquiry to examine how educators design, enact, and sustain these conditions in practice.\n\nRecognizing the critical role of environmental and pedagogical design, this study further situates generative AI within the PPC model (Hiemstra & Brockett, 2012), an extension of the Personal Responsibility Orientation (PRO; Brockett & Hiemstra, 1991). By foregrounding context alongside learner and process dimensions, the PPC framework provides a theoretically grounded lens for examining how generative AI interacts with SDL environments and pedagogical processes. The findings of this study contribute to a practitioner-informed pedagogical framework that illustrates how the PPC model may be operationalized within AI-supported classrooms.\n\nIn essence, the efficacy of SDL depends on the dynamic interplay between individual learners, pedagogical processes, and contextual conditions. An overemphasis on learner characteristics risks underplaying the social, cultural, and technological forces that shape learning. By examining how generative AI interacts with learning environments and teaching–learning interactions, this study enhances our understanding of SDL beyond individual autonomy, toward structured, relational, and pedagogically guided agency. Accordingly, the following research questions are posed to move the discourse from whether generative AI should be used to how it can be pedagogically structured to support SDL. Without understanding the technologies employed (RQ1), their influence and impact on SDL processes (RQ2), and their implications while operationalizing models (RQ3), understanding the pedagogical enactment of SDL in the generative AI era remains limited. The research questions (RQs) guiding this study are as follows:\n\n* RQ1: What generative AI technologies are utilized by teachers to support SDL in a secondary school?\n\n* RQ2: To what extent can generative AI technologies be used to support and understand SDL?\n\n* RQ3: How can the Person–Process–Context (PPC) model be operationalized within generative AI-supported learning environments, with consideration of its implications across various subject disciplines?\n\n## 3. Method\n\n### 3.1. Research Design\n\nA qualitative multiple-case study design (Yin, 2009), complemented by thematic analysis, was employed to investigate how teachers enacted generative AI-supported SDL within authentic classroom settings. This represents an empirical inquiry that investigates the phenomenon described through real-life context (Yin, 2009, p. 18), using multiple methods of data collection, and studies research strategy or design to understand a social unit. To align with the case study methodology, this study centers on teaching strategies and practices involving generative AI for student SDL. The primary unit of analysis was each teacher’s pedagogical design and implementation of generative AI-supported SDL, examined through accompanying instructional artifacts, student work, and teacher reflections. Cross-case synthesis was subsequently conducted to identify recurring pedagogical patterns and theoretically informative similarities and differences across subject disciplines, consistent with analytic rather than statistical generalization.\n\nThe approach for this study is exploratory, allowing the illumination of six teachers’ efforts and best practices in supporting SDL using generative AI-related technologies. The school principal served as a contextual informant rather than a primary participant. The principal’s perspectives were used solely to provide institutional context regarding the school’s AI vision and implementation priorities, and were not included as an individual case or unit of analysis. The findings were collectively used to answer the study’s research questions and to examine and iteratively refine CRAFT as a pedagogical scaffold for generative AI-supported SDL. [Figure 1](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f001) shows the research design and process flow of this study.\n\n**Figure 1.** Research design and process flow of the study.\n\n### 3.2. Settings and Data\n\nTeachers from a secondary school in Singapore shared lesson plans and teaching materials over a one-year period, focusing on content used with the integration of generative AI technologies. Resulting student artifacts were also collected and analyzed. To ensure a thorough investigation of effective instructional practices, the study prioritized the participation of senior and lead teachers, who have more than 10 years of teaching experience.\n\nThis purposeful sampling strategy sought information-rich cases from experienced educators with established pedagogical practices involving generative AI. The perspectives of experienced teachers across disciplines enabled comparison of how generative AI-supported SDL was enacted within different disciplinary contexts. Six senior and lead teachers were recruited. As part of a maximum variation sampling strategy, the selected teachers teach subjects with distinct epistemological structures, consisting of languages (English and Mother Tongue), sciences (Biology), humanities (History and Social Studies), and practical applied subjects (Design and Technology).\n\nThe primary data sources comprised teaching materials, semi-structured teacher interviews, and student learning artifacts generated through the corresponding learning activities. Teaching materials included lesson plans, instructional resources, and associated activity or assessment materials, which were examined for elements such as learning objectives, instructional design, AI-supported learning activities, and assessment.\n\nAll six teachers participated in semi-structured interviews of approximately one hour, focusing on their instructional rationales, observations of student engagement and learning, implementation challenges, and future instructional plans. The interviews were audio- or video-recorded and transcribed for analysis. Student artifacts were examined alongside the corresponding teaching materials and teacher accounts to provide evidence of how generative AI-supported activities were enacted within each case.\n\nAcross the five cases, the analyzed corpus comprised 12 sets of lesson plans and/or teaching materials, 61 student artifacts, and six teacher interviews, producing approximately 22 pages of interview transcripts containing 8004 words. [Table 1](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-t001) provides a case-level breakdown of the data included in the analysis. Reporting the corpus at the case level also makes visible differences in the quantity and type of evidence available across the cases. All data sources were digitized for analysis. Institutional Review Board (IRB) approval and participant consent were obtained prior to data collection, analysis, and interpretation.\n\n**Table 1.** Data corpus by case in this study.\n\n### 3.3. Case Construction, Cross-Case Thematic Analysis, and Trustworthiness\n\nAnalysis proceeded in two complementary stages. First, individual teacher case studies were constructed to describe how generative AI was integrated into classroom practices for SDL within each disciplinary context. Second, thematic analysis across cases identified recurring categories and sub-categories that informed cross-case comparisons and framework refinement.\n\nEach case study represented a teacher’s efforts and practices in using generative AI to support SDL for the subject that he or she was teaching, alongside outcomes reflected through student artifacts. The investigated subjects include the English language, Mandarin as a mother tongue language, Biology as a science subject, Design & Technology as a technical subject, and History and Social Studies as part of the humanities and social sciences. Evidence from the different data sources was considered together within each case before patterns were compared across cases, allowing teacher accounts to be examined alongside the corresponding instructional materials and student artifacts. Elements from the PPC model (Hiemstra & Brockett, 2012) and how they were referenced in this study are summarized in [Table 2](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-t002).\n\n**Table 2.** How PPC elements were referenced and described in the case studies.\n\nThematic analysis followed Braun and Clarke’s (2006) iterative process of familiarization, initial coding, theme development, review, refinement, and definition. The analysis adopted a theoretically informed, hybrid deductive–inductive approach rather than a purely inductive or reflexive thematic analysis. Initial coding was informed deductively by the PPC model while remaining open to inductive refinement where recurrent concepts emerged from the data.\n\nPPC therefore functioned as a sensitizing and organizing framework rather than as an exhaustive set of predetermined codes. Categories and sub-categories were refined iteratively as the researchers compared the coded material within and across cases. The codebook includes identified categories and sub-categories (or sub-elements), and these are presented in [Table 3](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-t003). The findings from the thematic coding were then used to address the research questions posed, and to examine and iteratively refine the CRAFT framework as a pedagogical process scaffold for supporting student SDL with generative AI technologies.\n\n**Table 3.** Coding scheme for categories and sub-categories that affect generative AI-supported SDL.\n\nTo strengthen the transparency and trustworthiness of the coding process, two researchers initially coded the qualitative data independently using the PPC-informed coding framework. Cohen’s Kappa was calculated at this initial stage as a diagnostic indicator of coding convergence. Rather than treating this coefficient as evidence of final analytical reliability, the researchers used areas of disagreement to identify categories and code definitions requiring further clarification. Discrepancies were subsequently examined against the source data and discussed iteratively, with code definitions refined until a consensus-based coding framework was established. As the final coding was produced through reconciliation and consensus rather than a second round of independent coding, a post-reconciliation Kappa was not calculated.\n\nTrustworthiness was further supported through triangulation across teacher interviews, instructional materials, and student artifacts, enabling interpretations to be examined across multiple forms of evidence within each case. Member checking was also conducted with the teachers to confirm the accuracy of the researchers’ interpretations of their pedagogical practices and the contextual representation of their respective cases. Feedback from the teachers was used to clarify or refine the case accounts where necessary. Cross-case comparison was then used to examine whether identified patterns were evident across different disciplinary contexts, while coding decisions and refinements to category definitions were documented through successive iterations of the coding framework. Together, these procedures provided an analytical audit trail linking the source data, coding decisions, case interpretations, and subsequent cross-case analysis.\n\nInsights from the cross-case analysis were subsequently used to iteratively refine the CRAFT framework (shown in [Section 3.4](https://www.mdpi.com/3042-8130/2/4/33#sec3dot4-aieduc-02-00033)). Rather than statistically validating the framework, the analysis examined how its proposed stages represented pedagogical practices observed across the cases and where gaps or variations occurred across disciplinary contexts. CRAFT was therefore treated as a practitioner-informed pedagogical scaffold that was examined and refined through the cross-case evidence rather than as a framework validated through the present study.\n\n### 3.4. CRAFT Framework Development and Iterative Refinement\n\nCRAFT was not generated from scratch via the present thematic analysis. Rather, an initial version of the framework had been conceptualized through practitioner experimentation with generative AI-supported learning and was subsequently enacted more explicitly by Teachers 5 and 6 in their Humanities practice. The present multi-case study therefore examined both CRAFT-informed practices and other forms of generative AI-supported SDL across disciplines. Cross-case analysis was used to refine the framework, examine the pedagogical functions represented by its five stages, and clarify its relationship with the Process dimension of the PPC model. Accordingly, CRAFT is described in this study as a practitioner-informed and empirically refined pedagogical scaffold rather than as a framework independently derived or validated from the case data.\n\nEach phase was designed to address specific self-regulatory functions: “Content” sets the direction of the inquiry through goal setting and initial orientation; “Response” enables learners to articulate their thinking; “AI & peers” offers feedback from external sources and facilitates co-regulatory support; “Fusion” promotes synthesis and refinement of ideas; and “reflecT” supports metacognitive reflection and learning consolidation. Collectively, these stages operationalize pedagogical processes associated with the Process dimension of the PPC model while remaining situated within the broader Person and Context dimensions. Accordingly, CRAFT is presented as a pedagogical scaffold that complements, rather than replaces, the PPC model. [Figure 2](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f002) illustrates the CRAFT framework as a pedagogical scaffold for supporting SDL. While CRAFT was explicitly enacted within the Humanities case, the cross-case analysis examined practices across the other cases in relation to the pedagogical functions represented by its stages, contributing to its iterative refinement.\n\n**Figure 2.** Presentation of the proposed CRAFT framework as pedagogical scaffold.\n\n## 4. Findings and Discussion\n\nThis section begins with the thematic coding results and illustrations of examples ([Section 4.1](https://www.mdpi.com/3042-8130/2/4/33#sec4dot1-aieduc-02-00033)), followed by descriptive analyses of teacher case studies ([Section 4.2](https://www.mdpi.com/3042-8130/2/4/33#sec4dot2-aieduc-02-00033)). These findings are then used to address the research questions ([Section 4.3](https://www.mdpi.com/3042-8130/2/4/33#sec4dot3-aieduc-02-00033) and [Section 4.4](https://www.mdpi.com/3042-8130/2/4/33#sec4dot4-aieduc-02-00033)), and study limitations are also discussed ([Section 4.5](https://www.mdpi.com/3042-8130/2/4/33#sec4dot5-aieduc-02-00033)).\n\n### 4.1. Thematic Coding Results and Respective Examples of Sub-Categories/Sub-Elements\n\nOur thematic analysis, conducted using the methodology proposed by Braun and Clarke (2006), yielded a rich understanding of the integration of generative AI into teaching practices to support student SDL. This process commenced with an initial coding phase, during which two researchers independently identified segments within the collected data, initially guided by the PPC elements for conceptualizing SDL while remaining open to recurrent concepts emerging from the data. The codes in [Table 4](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-t004) are developed as categories and hierarchical sub-categories or sub-elements, and examples of each sub-category are illustrated in [Table 4](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-t004).\n\n**Table 4.** Categories and sub-categories with respective examples that affected generative AI-supported SDL.\n\nThe Cohen’s Kappa initially calculated as a diagnostic indicator of coding convergence yielded a Cohen’s Kappa coefficient of 0.58, indicating moderate agreement (Landis & Koch, 1977). To clarify and strengthen the coding framework, all discrepancies between the two researchers were subsequently reconciled through iterative discussion. This process resulted in a finalized, consensus-based codebook (see [Appendix A](https://www.mdpi.com/3042-8130/2/4/33#app1-aieduc-02-00033) for a summary of thematic codes assigned from each case). These findings allowed for the identification of critical pedagogical, behavioral, and environmental factors influencing generative AI-supported SDL. By synthesizing these results, we addressed the research questions and refined the CRAFT framework as a pedagogical scaffold to assist teachers in facilitating student-led learning processes. Detailed responses to the research questions are provided in [Section 4.3](https://www.mdpi.com/3042-8130/2/4/33#sec4dot3-aieduc-02-00033) and [Section 4.4](https://www.mdpi.com/3042-8130/2/4/33#sec4dot4-aieduc-02-00033).\n\n### 4.2. Presentation and Descriptive Analysis of Case Studies\n\nA total of six teachers were investigated and interviewed in this study, resulting in five case studies across multiple disciplines and subjects. Each case study was described with reference to teachers’ engagement with SDL’s theoretical foundations, and how the various uses of generative AI impacted certain SDL mechanisms.\n\nTo substantiate the interpretations being made, this section will also present selected representative quotations that demonstrate how teachers described students’ engagement, challenges, and responses to generative AI-supported learning, alongside a worked example to demonstrate how a student learning artifact was interpreted in relation to the coding framework and the relevant PPC and CRAFT processes. This provides a clearer analytical chain from empirical material, to coding, to interpretation.\n\n#### 4.2.1. Teacher 1—English Language Teacher\n\nTeacher 1 (female) implemented generative AI to scaffold students’ SDL through structured yet student-led activities. Using ChatGPT-4o (Omni) and two sets of prompts, she guided students to generate and iteratively refine sample essays, positioning AI outputs as comparative resources for language improvement rather than authoritative models ([Figure 3](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f003)). The teacher explained that students could be “generating responses and comparing or contrasting them to improve their grammar and vocabulary.” This stepwise design provided opportunities for evaluative judgment and self-monitoring, all of which are core components of SDL. Students were also encouraged to extract and adapt AI-generated ideas into personalized study notes, framing note curation as a form of self-regulated knowledge synthesis.\n\n**Figure 3.** Example of iterative prompts used in classrooms by learners (leaning right) and ChatGPT’s responses (leaning left and compressed for space).\n\nIn a complementary approach, the teacher integrated a Ministry of Education-supported Writer’s Toolbox (n.d.) to support early-stage ideation. However, she estimated that the tool accounted for only a small proportion (about 10%) of students’ overall learning effort, underscoring her view of generative AI as an initiator rather than a replacement of deeper SDL processes.\n\nInterview data revealed strong student enthusiasm for generative AI in writing tasks, alongside notable challenges. However, the teacher observed that many students required substantial support in prompt construction and AI evaluation, preferring highly guided scaffolds over independent exploration. Adoption was strongest when AI use was perceived as low-stakes and closely aligned with curriculum expectations. Despite their interest, students sought clarity around acceptable AI use, which the teacher interpreted as indicating a continuing need for scaffolding around self-regulation and responsible engagement with AI-supported learning.\n\n#### 4.2.2. Teacher 2—Mandarin (Mother Tongue Language) Teacher\n\nTeacher 2 (female) leveraged generative AI to scaffold SDL through feedback cycles and creative, multimodal tasks. Using platforms such as MagicSchool AI (n.d.) and SchoolAI (n.d.), students engaged in AI-supported self-assessment by generating feedback on their own writing and iteratively revisiting their work to conduct revisions. This design foregrounded self-monitoring, reflective practice, and evaluative judgment as key SDL processes, positioning AI feedback as a resource for learner regulation rather than passive correction.\n\nExtending beyond text-based tasks, the teacher adopted creative applications of generative AI to promote learner agency. Students used AI image generation to visualize future selves, prompting self-initiated inquiry into ageing and social responsibility ([Figure 4](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f004), left). This was complemented by a songwriting task using Suno, in which students selected approximately 10–20 topic-relevant Chinese words according to their readiness and used these as inputs for generating lyrics and a song about life in Singapore ([Figure 4](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f004), right). The teacher emphasized that the AI-generated product was intended to remain something students could take ownership of and modify, as exemplified through her interview: “The AI generates something, but the students can take responsibility for it. They can make it their own and modify it.” (Teacher 2, translated from Mandarin.)\n\n**Figure 4.** Students generated images of elderly being digitally connected at 75 years old (**left**) and chose keywords to generate lyrics and vocalize a song related to “Living in Singapore” (**right**).\n\nThe songwriting artifact provides an illustrative example of how student work was interpreted during the analysis. 绿色城市 (Green city), 多元文化国 (Multicultural country), and 和谐社区 (Harmonious community) are three examples of actual Mandarin keywords (translated) among the topic-relevant terms selected by the students before interacting with the generative AI tool. This initial selection provided observable evidence of learner choice and engagement with disciplinary content and was coded in relation to learner agency and learning strategy within the Person and Process dimensions of PPC.\n\nWithin CRAFT, the selection and preparation of relevant content were interpreted in relation to the Content and Response stages. The subsequent use of these student-selected keywords as inputs for generating the lyrics represented interaction with AI-generated material and was interpreted in relation to AI & peers. For example, the resulting lyrics retained the three aforementioned keywords within the first two verses of the song as features of the country, while developing the remaining students’ keywords to form the resulting song. The song became an interim version that students continued to modify and edit.\n\nWhere students subsequently evaluated, modified, or incorporated generated material into their final product, this was coded as synthesis of learner- and AI-generated contributions and interpreted in relation to Fusion. Evidence was mapped to reflect only where the artifact or accompanying account explicitly showed students reviewing their choices, outputs, or learning process. This analytical tracing illustrates how observable features of student work were first coded before being interpreted through the PPC and CRAFT lenses, rather than inferring students’ internal states from the artifact alone.\n\nInterview findings suggested, from the teacher’s perspective, that the visual and auditory affordances of generative AI created additional opportunities for students to express and develop their learning. The teacher also reported instances in which students reconsidered the accuracy or appropriateness of AI-generated outputs. These observations were interpreted as opportunities for critical evaluation of AI-generated material rather than as direct evidence of students’ internal metacognitive states. At the same time, the teacher identified an important limitation concerning whether initial engagement could develop into sustained learning, asking: “How can we sustain this with depth, and not just with interest?” (Teacher 2, translated from Mandarin). This concern was particularly salient in language learning, where composition, oral presentation, and assessment requirements constrain the forms through which students can demonstrate learning. The case therefore illustrates both the potential of multimodal generative AI to support learner choice and synthesis and the continuing need for teacher orchestration to connect such engagement with disciplinary learning and curricular expectations.\n\n#### 4.2.3. Teacher 3—Science (Biology) Teacher\n\nTeacher 3 (female) is an experienced educator with strong proficiency in educational technologies, including the use of virtual and augmented reality. With the emergence of generative AI technologies, she integrated generative AI into science instruction to support SDL through timely feedback, authentic tasks, and structured scaffolding. Using SchoolAI and the Short Answer Feedback Assistant on the national Student Learning Space (SLS; Alison et al., 2019), students received immediate, personalized feedback that facilitated adaptive discussion and ongoing progress monitoring. These feedback loops provided opportunities for core SDL processes, including self-evaluation, reflection, and goal setting.\n\nIn a case-based lesson on human lung function, students assumed the role of medical professionals and analyzed AI-generated patient profiles ([Figure 5](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f005)). Working toward authentic success criteria, they conducted research, consulted AI chatbots for clarification, and synthesized findings into professional-style reports. These activities were interpreted as providing opportunities for key elements of the process dimension of the PPC model, particularly metacognitive regulation, self-monitoring, and strategic information seeking, while enhancing task authenticity and motivational relevance.\n\n**Figure 5.** Case-based learning with AI chatbot to build and present a patient case report.\n\nThe teacher also observed that students became actively engaged in questioning the personalized chatbot and were able to apply subject-specific terminology in developing their responses, via actions such as “students questioning the chatbot and using the correct scientific terms.” This teacher-reported observation, considered alongside the corresponding learning activity, suggested that the chatbot supported opportunities for disciplinary inquiry and application rather than information retrieval alone.\n\nInterview data indicated that the teacher perceived relatable, real-world contexts as supporting students’ motivation and depth of inquiry. However, the teacher noted that unstructured AI interaction posed challenges, particularly concerning the authenticity and accuracy of chatbot responses. She therefore emphasized that students needed to become more discerning users of AI, and that “students should not take everything at face value and should check whether the information is correct before accepting it.” The teacher consequently used explicit scaffolds and more carefully bounded prompts to maintain task focus and encourage students to evaluate AI-generated information. Rather than replacing teacher input, generative AI functioned as a co-regulatory resource within a blended human–AI instructional model.\n\nOverall, this case demonstrates how structured yet flexible AI integration, combined with intentional pedagogical scaffolding, can foster learner autonomy while ensuring that AI-mediated feedback contributes meaningfully to the development of sustained SDL.\n\n#### 4.2.4. Teacher 4—Design & Technology Teacher\n\nDesign and Technology (D&T) emphasizes learning through real-world design-and-make projects, often beginning with students producing freehand sketches. With the introduction of generative AI-enabled sketching tools such as Vizcom (n.d.), Teacher 4 (male) introduced generative AI-enabled digital sketching into D&T instruction to support SDL in creative design processes. Using Vizcom, students generated initial concept sketches from two-dimensional (2D) inputs, reducing cognitive load and supporting learners who struggled with three-dimensional (3D) visualization. For some students, these affordances enabled greater independence in initiating and refining design ideas, shifting control from teacher-directed instruction toward learner-driven exploration. [Figure 6](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f006) illustrates a student’s full design cycle with the aid of generative AI to create a hook that supports a bag under a table, combining iterative adjustments with real-world functionality.\n\n**Figure 6.** Process of designing and creating a sturdy hook for holding bags during lessons.\n\nTowards this illustrated design circle, Teacher 4 regarded imperfections in AI-generated designs as potentially productive when students were required to identify and respond to them, explaining that “it is beneficial in students seeing something wrong, pointing it out, and adjusting accordingly.” Rather than treating AI-generated visualizations as finished solutions, this approach positioned them as provisional design inputs that students could evaluate and refine.\n\nHowever, the implementation also revealed tensions. Interview data indicated that some students resisted digital sketching, preferring traditional methods or disengaging from the task. From an SDL perspective, this resistance may indicate a misalignment between intended autonomy and students’ readiness to self-direct with unfamiliar technologies. For some students, these behaviors suggested limited readiness or willingness to engage with the unfamiliar digital workflow, constraining the intended shift toward learner-directed activity.\n\nThe teacher further observed that the absence of adaptive, in-tool feedback limited students’ capacity for self-monitoring and iterative refinement without teacher intervention. As a result, SDL outcomes were uneven: while some students engaged in autonomous design cycles, others remained dependent or passive. These findings highlight the importance of differentiated scaffolding and feedback mechanisms in AI-supported design environments.\n\nThis case underscores the need to reconceptualize assessment in D&T. Teacher 4 advocated shifting from outcome-based evaluation toward process-oriented assessment that recognizes iterative effort, exploration, and decision-making across design cycles. Such realignment (Lee, 2025) and re-tuning of outcome-based assessment (Lee, 2024) may contribute to supporting sustained SDL in creative domains increasingly mediated by generative AI.\n\n#### 4.2.5. Teachers 5 & 6—History and Social Studies Teachers\n\nTeacher 5 (male) worked in close collaboration with Teacher 6 (female) to co-lead the conceptualization and school-wide implementation of the CRAFT framework, starting from their own Humanities classroom. Rather than presenting the CRAFT framework as a strict linear procedure, CRAFT was enacted as a practitioner-informed pedagogical structure supporting key SDL behaviors, such as idea generation, feedback integration, knowledge restructuring, and reflective thinking. The teachers operationalize each stage to target distinct self-regulatory processes: “Content” initiates the inquiry (goal setting and orientation), “Response” activates self-expression, “AI&peers” supports external feedback and co-regulation, “Fusion” encourages cognitive integration and revision, and “reflecT” creates an explicit opportunity for metacognitive reflection and learning consolidation.\n\nAlthough the CRAFT framework aligns conceptually with the Process dimension of the PPC model, the teachers positioned it as a practitioner-driven response to the practical challenges of scaffolding SDL in AI-mediated contexts. In this complementary relationship, CRAFT operationalizes situated self-regulatory cycles, while PPC offers a broader theoretical frame connecting learner characteristics, instructional strategies, and learning environments.\n\nEnactments using platforms such as MagicSchool AI (n.d.) and Knowledge Forum (Scardamalia, 2004) illustrated how CRAFT structured AI- and peer-supported inquiry, enabling students to iteratively generate, critique, and refine ideas (see [Figure 7](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f007)). Both teachers identified uneven student readiness for self-direction. Their observations underscore the importance of explicit scaffolding and strategy instruction and both teachers recognized that generative AI does not inherently produce self-directed learners. Instead, AI must be embedded within pedagogical frameworks that regulate choice, support reflection, and gradually release responsibility. In this view, the CRAFT framework functions not as an automation mechanism but as a means of structuring student agency, enabling learners to engage in increasingly autonomous and sustainable cycles of learning.\n\n**Figure 7.** Classroom example demonstrating how discussion on vaping “Content” led to the application of the “Response”, “AI&peers”, and “Fusion” parts of the CRAFT framework, which guided students to “reflecT”.\n\n#### 4.2.6. Principal’s Input—Driving School-Wide AI Integration for SDL\n\nSchool leadership provided an important contextual condition for the sustained enactment of SDL supported by generative AI. The principal articulated a school-wide vision that positioned generative AI as a pedagogical resource for cultivating responsible, future-ready learners, rather than as a tool for instructional efficiency. Within this vision, technology integration was framed as a means of shifting students toward active and self-directed engagement with learning.\n\nAt the school level, sustainability of SDL initiatives depended on strategic leadership actions, including policy alignment, targeted resource allocation, and sustained professional development. The principal and senior leadership team established partnerships with teaching and research institutions to build teacher capacity through co-designed workshops and pilot implementations involving tools such as MagicSchool and Vizcom. These collaborations functioned as institutional change mechanisms that supported pedagogically grounded experimentation with generative AI.\n\nComplementary partnerships with Ministry of Education-facilitated industry tools (e.g., Writer’s Toolbox) enabled the school to develop context-sensitive strategies for evaluating and refining AI use in response to specific curricular and cultural needs. Together with leadership-led investments in physical and digital infrastructure, these efforts supported the school’s ongoing development of AI-enabled SDL practices, supporting continuous improvement and long-term sustainability at the whole-school level.\n\n### 4.3. Answering RQ1 & RQ2: What Generative AI Technologies Are Utilized by Teachers to Support SDL in a Secondary School? To What Extent Can Generative AI Technologies Be Used to Support and Understand SDL?\n\nGiven the inherent interconnectedness of the findings, addressing both research questions 1 and 2 concurrently yields a more comprehensive and insightful analysis. In addressing RQ1, the study’s findings demonstrate that a wide array of generative AI technologies was explored and trialed by teachers to support SDL across diverse subject domains. These technologies included general-purpose large language model (LLM) platforms and subject-specific tools, such as ChatGPT, Gemini, MagicSchool, SchoolAI, SLS (Singapore Student Learning Space), Knowledge Forum, Vizcom, and Suno.\n\nMost of the generative AI tools in use shared a common trait of being readily available, low barriers to access, and off-the-shelf. This accessibility enabled rapid integration into existing classroom workflows without the need for extensive technical support or infrastructural changes. Teachers consistently prioritized technologies that aligned with their subject-specific pedagogical intentions and that enhanced rather than replaced core teaching processes. Beyond mere accessibility, four key affordances guided the selection and integration of generative AI to support student SDL:\n\n* Goal setting and progress tracking facilitated by platforms such as MagicSchool and SchoolAI, which allowed teachers and students to co-design checkpoints and monitor SDL trajectories.\n\n* Real-time feedback and support enabled through short-answer feedback assistants on the national SLS platform or generated via chatbot-based technologies that are powered by Large Language Models (e.g., OpenAI’s ChatGPT, Google’s Gemini) which students used to clarify concepts, receive just-in-time explanations, and explore multiple perspectives.\n\n* Awareness of peer learning and collective progress made possible by platforms like the Knowledge Forum, which supported dialogic engagement and peer-to-peer knowledge building in line with collaborative SDL principles.\n\n* Personalized and multimodal learning pathways enabled through creative AI tools like Vizcom (which allowed students to visualize complex designs) and Suno (which transformed student input into musical outputs), allowing greater student agency and tailoring of learning experiences to individual student interests and strengths.\n\nWhile this study examined a limited, albeit representative, subset of generative AI tools, the platforms selected by teachers reflect grounded, classroom-viable applications rather than speculative or experimental use cases. This distinction was intentional, ensuring that the pedagogical value of AI integration remained the key focus.\n\nMoving onto RQ2, in terms of how these technologies support and help us understand SDL, the findings revealed several critical insights. Firstly, generative AI can scaffold the SDL process by simulating expert-like feedback, prompting metacognitive reflection, and enabling students to evaluate and iterate their thinking. For instance, students used LLMs not only to seek answers but also to refine hypotheses, compare multiple explanations, and articulate more nuanced responses and behaviors that are aligned with key SDL attributes such as self-monitoring and strategic information-seeking.\n\nSecondly, AI tools provided teachers with new forms of visibility into students’ SDL processes. Through analytics, chat transcripts, and iterative student outputs, teachers gained insights into how students set goals, managed learning paths, and engaged with content autonomously. This suggests that generative AI is not only a support mechanism but also a mirror for understanding SDL in action, especially when triangulated with other evidence sources such as student artifacts and teacher reflections.\n\nHowever, the analysis also uncovered significant gaps in how current AI use fosters deeper SDL outcomes. As seen in case studies under Teachers 3 and 4, the core of the process dimension in the PPC model was inconsistently refined across cases, evidenced by the absence of structured prompts or scaffolded reflection points within AI tools that led to uneven SDL outcomes, with some students thriving while others remain passive. This underscores the need for pedagogical design that intentionally integrates reflective and metacognitive scaffolds, either within the AI tools or through teacher interventions.\n\nIn essence, these findings are consistent with the emerging literature on generative AI-supported SDL while also illustrating several of its unresolved tensions in formal school settings. Roe and Perkins (2024), in their scoping review of generative AI and SDL, identify the potential of generative AI to enhance personalization and provide on-demand learning support while simultaneously emphasizing the continuing importance of the educator as a guide and the need for caution in learners’ engagement with AI-generated information. The present findings similarly suggest that access to adaptive or personalized AI support does not in itself produce SDL. Across cases, productive use depended on how teachers structured the task, bounded the use of AI, supported evaluation of generated content, and connected AI interaction with disciplinary learning goals.\n\nThis finding also complements Li et al.’s (2024) reconceptualization of generative AI-supported SDL, which highlights interactions between learner characteristics and learning processes at a local level while recognizing the wider sociopolitical, cultural, and technological environment in which SDL occurs. The present study extends this concern into formal secondary-school classrooms, where these interactions are additionally mediated by teacher-designed activities, curricular requirements, assessment expectations, disciplinary practices, and the affordances and limitations of particular AI tools. Viewed through the PPC model, generative AI therefore operates not as an independent determinant of SDL, but as part of a Context that interacts dynamically with learner characteristics (Person) and pedagogically structured learning activity (Process).\n\nTaken together, these findings suggest that generative AI can provide feedback, alternative perspectives, personalization, and multimodal resources that support opportunities for SDL, but that these affordances become educationally productive only when appropriately structured within the learning process. Generative AI may therefore function not solely as a content-delivery tool, but as a dialogic, formative, and adaptive resource within carefully designed learning environments. This shifts attention from what individual AI tools can do toward how learner responses, AI-generated contributions, peer input, teacher guidance, synthesis, and reflection are coordinated. Within this interpretation, the PPC model provides a broader theoretical lens for examining the interplay among learner characteristics, pedagogical processes, and contextual conditions, while CRAFT offers a pedagogical scaffold for making selected aspects of this interaction more explicit and designable within generative AI-supported classroom activity. This relationship is examined further in [Section 4.4](https://www.mdpi.com/3042-8130/2/4/33#sec4dot4-aieduc-02-00033).\n\n### 4.4. Answering RQ3: How Can the Person–Process–Context (PPC) Model Be Operationalized Within Generative AI-Supported Learning Environments, with Consideration of Its Implications Across Various Subject Disciplines?\n\n#### 4.4.1. Operationalizing SDL Processes in Generative AI-Supported Learning\n\nThe study’s findings reveal that the integration of generative AI into classroom practice opens new pathways for operationalizing SDL, particularly within the “Process” dimension of the PPC model. Rather than treating generative AI as a static resource or assuming that AI independently transforms SDL, the cases indicate that generative AI introduces additional sources of feedback, representation, dialogue, and learner choice that need to be pedagogically coordinated with teacher guidance, peer interaction, and disciplinary learning processes. Through the thematic analysis, the PPC elements were further examined through categories and sub-categories that made the considerations affecting SDL across the different disciplinary cases visible.\n\nThis interpretation resonates with Lawrence et al.’s (2024) account of teacher–AI co-orchestration and shared control. Their study demonstrates the importance teachers place on retaining meaningful pedagogical control and responsibility while allowing AI to support aspects of classroom orchestration. The present findings extend this concern to the orchestration of students’ learning processes. Across cases, teachers did not simply provide access to generative AI. In fact, they made pedagogical decisions concerning when AI input was introduced, what role it served, how students were expected to engage with or evaluate it, and how AI-generated material was subsequently connected with students’ own responses and disciplinary learning goals. From a PPC perspective, this highlights teacher orchestration as an important mechanism through which Context, including the availability and affordances of generative AI, is translated into opportunities for SDL within the Process dimension.\n\nThe disciplinary cases also illustrate that such orchestration can take different forms. In English (Teacher 1), generative AI supported iterative drafting and comparison of responses. In Mandarin as a Mother Tongue (Teacher 2), it enabled multimodal ideation and creative synthesis. In Biology (Teacher 3), personalized chatbots supported case-based inquiry and opportunities for students to evaluate generated information. In Design and Technology (Teacher 4), AI-generated visualizations provided material that students could evaluate and refine within the design process. The Humanities case involving Teachers 5 and 6 provided an explicit example of CRAFT-informed enactment. Practices in the other cases, although not necessarily designed through CRAFT, could subsequently be examined in relation to the pedagogical functions represented by its stages. This distinction enabled the cross-case analysis to identify areas of convergence and gaps without assuming that all teachers had worked from the framework.\n\nAlthough these implementations vary by subjects and disciplines, a common pattern emerged: more sustained opportunities for SDL appeared to be associated with clear pedagogical scaffolds that promote reflection, iteration, and self-monitoring. This alignment primarily relates to the “Process” component of the PPC model by providing the ‘How’ of student–AI interaction. However, the analysis also revealed a pervasive underdevelopment of key SDL mechanisms, particularly in relation to metacognitive regulation and reflective practice. This challenge is clearly observed in Teacher 3’s science case, where AI-enabled short answer feedback and patient-based inquiry tasks elicited strategic information-seeking and goal-setting behaviors, aligning well with the PPC model’s process dimension. Conversely, Teacher 4’s case highlighted the absence of in-tool scaffolding and students’ resistance to new AI-supported design workflows, which significantly constrained reflective SDL outcomes. These contrasts suggest that generative AI does not independently produce SDL processes. Rather, the quality of SDL opportunities depends upon how AI-supported activity is orchestrated in relation to learner readiness, disciplinary goals, and the wider instructional context.\n\nBuilding on this need for structured intervention, there is a need to differentiate and recognize the extent of generative AI integration by disciplinary context. For example, language-based subjects saw greater success with generative text and chatbot tools when paired with teacher-guided prompting and peer comparison, while STEM subjects benefited more from authentic scenarios and scaffolded inquiry-based tasks. In creative subjects such as D&T, students’ perception of ownership and tool appropriateness influenced their willingness to engage in SDL. In essence, within the PPC model, these findings reinforce the dynamic relationship between Person, Process, and Context. The forms of scaffolding required to support learner agency cannot be separated from disciplinary epistemologies, learner characteristics, or the affordances and constraints of the technologies being used.\n\n#### 4.4.2. CRAFT Framework as a Pedagogical Scaffold Within the PPC Model\n\nIn response to these findings, the CRAFT framework is positioned as a practitioner-informed and empirically refined pedagogical scaffold within the broader PPC model. CRAFT should not be interpreted as proposing goal setting, feedback, synthesis, or reflection as new processes within SDL; related processes are well established within existing accounts of self-directed and self-regulated learning. Its contribution is instead pedagogical and orchestration-oriented. Specifically, CRAFT provides a structure for making explicit how students’ initial engagement with disciplinary content and their own responses, subsequent encounters with AI-generated and peer contributions, synthesis of these inputs, and reflection can be deliberately sequenced within generative AI-supported classroom activity.\n\nThis positioning is consistent with, but distinct from, recent work on generative AI-supported SDL. As discussed in [Section 4.3](https://www.mdpi.com/3042-8130/2/4/33#sec4dot3-aieduc-02-00033), Li et al. (2024) foreground interactions among learner characteristics, learning processes, and the wider generative AI environment, while Roe and Perkins (2024) emphasize the potential for personalization alongside the continuing importance of educator guidance and critical engagement with AI. CRAFT addresses a complementary classroom-design question: how can teachers structure the points at which learners first engage with content and formulate their own responses, encounter AI or peer input, exercise judgment over those contributions, synthesize them into revised understanding or products, and subsequently reflect upon the learning process?\n\nCRAFT also complements Lawrence et al.’s (2024) account of human–AI co-orchestration. Whereas their work examines shared control between teachers and AI in classroom orchestration, CRAFT foregrounds the pedagogical organization of learner–AI–peer interactions within an SDL activity. The AI & peers and Fusion stages are particularly relevant because they distinguish exposure to externally generated input from the learner’s subsequent responsibility to evaluate, select, reject, adapt, or integrate that input. In this sense, CRAFT does not position AI as replacing learner or teacher agency. Instead, it provides a means of making the distribution and subsequent re-integration of learner, peer, and AI contributions more pedagogically visible.\n\nWithin the PPC model, CRAFT primarily operationalizes aspects of the Process dimension. Both the Person dimension, which includes learner readiness, motivation, prior knowledge, and dispositions, and the Context dimension, which includes disciplinary, institutional, technological, and sociocultural conditions, continue to shape how these processes are enacted. CRAFT therefore does not replace the broader explanatory function of PPC. Rather, the two operate at complementary levels, where the PPC provides the conceptual lens for examining relationships among learner, process, and context, while CRAFT provides teachers with a more proximal scaffold for designing and examining AI-supported learning activity.\n\nImportantly, the findings reveal a limitation in the enactment of this structure. Although reflecT makes reflection explicitly visible within CRAFT, its presence as a framework stage did not ensure substantive metacognitive engagement across the cases. Reflective and self-monitoring processes remained uneven, indicating that the structural inclusion of reflection is insufficient without deliberate pedagogical enactment through appropriate prompts, modelling, feedback, and opportunities for learners to revisit their reasoning and decisions. Put differently, CRAFT specifies where reflection can be incorporated within an AI-supported learning sequence, but it does not guarantee the quality or depth of that reflection. This distinction emphasizes that CRAFT is not a self-executing cycle. How effectively its stages support SDL remains contingent upon teacher orchestration, learner readiness, disciplinary context, and the quality of task design and enactment.\n\nIn this way, interactions with generative AI can be made pedagogically visible and purposeful, rather than remaining exploratory, ad hoc, or purely transactional. For example, CRAFT, when situated within PPC, can support teachers in diagnosing whether student activity reflects surface-level tool use or provides opportunities for more substantive SDL processes (e.g., goal setting, strategy refinement, or reflective integration), thereby enabling more targeted scaffolding. [Figure 8](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f008) represents this complementary relationship by situating the CRAFT process scaffold within the broader Person, Process, and Context dimensions of PPC.\n\n**Figure 8.** Positioning of the CRAFT pedagogical scaffold within the PPC model for generative AI-supported SDL, with factors identified across the cases (exemplification in [Appendix A](https://www.mdpi.com/3042-8130/2/4/33#app1-aieduc-02-00033)).\n\nMore importantly, the integrated PPC–CRAFT representation shown in [Figure 8](https://www.mdpi.com/3042-8130/2/4/33#aieduc-02-00033-f008) is not presented as a universal model but as a flexible sense-making and design guide for operationalizing and refining SDL within AI-supported educational practice. It can help educators align instructional intentions, student actions, and AI affordances across the Person, Process, and Context dimensions of SDL. It foregrounds teacher design and adaptation as important conditions shaping opportunities for student self-direction, aligning with the broader literature that positions teacher scaffolding and learner agency as interrelated within the development of self-regulated and self-directed learning (Zimmerman, 2002; Lawrence et al., 2024). Through this integration, PPC–CRAFT makes selected SDL processes, including opportunities for reflection and metacognitive regulation, more explicit while offering teachers a structured yet adaptable pedagogical scaffold for orchestrating AI-supported SDL. Its contribution therefore lies not in proposing a new theory of SDL, but in providing an empirically informed means of connecting the broader PPC lens with the practical orchestration of generative AI-supported classroom activity.\n\n### 4.5. Limitations of the Study\n\nThis study recognizes that within generative AI-supported SDL, educators remain central to orchestrating SDL, with generative AI serving as a complementary pedagogical resource rather than a substitute for teacher expertise. While this study’s findings arose within this national and institutional context, it examined teachers’ practices together with student learning artifacts to understand how SDL was enacted in authentic classrooms. Future research could further investigate how individual learner characteristics, evolving learner agency, and broader contextual variables interact with these pedagogical processes over time to better understand their direct and indirect influences on SDL.\n\nConsistent with the study’s objective of refining the pedagogical implementation of the Process dimension within the PPC model, the primary data sources comprised teacher practices, instructional artifacts, student work samples, and reflective interviews. Although this emphasis intentionally foregrounded pedagogical processes, it also means that the Person and Context dimensions were examined primarily through teachers’ observations and classroom evidence rather than through direct student perspectives. The present work can be extended by incorporating richer multimodal and longitudinal evidence, including student interviews, classroom discourse, learning analytics, physiological engagement measures, and peer interaction data, to provide a more comprehensive understanding of the dynamic interplay among the person, process, and context dimensions of SDL.\n\nAs an exploratory qualitative multi-case study, the purpose was not statistical generalization but analytic generalization through rich, contextualized investigation. Although the study involved six teachers from a single secondary school, the cases were intentionally selected using maximum variation sampling to represent experienced practitioners across diverse disciplinary contexts, including languages, science, humanities, and Design and Technology. This diversity enabled both within-case and cross-case analyses, allowing the identification of recurring pedagogical patterns despite disciplinary differences. Accordingly, the findings should be interpreted as transferable pedagogical insights rather than universally generalizable claims.\n\n## 5. Conclusions\n\nThis study has investigated the integration of generative AI within teaching strategies and practices to support student SDL. Through a qualitative multi-case approach involving six senior and lead teachers across diverse disciplines, we captured an extended view across one academic year of pedagogical decision-making, including lesson designs, instructional materials, and student artifacts. Semi-structured interviews provided a deeper understanding of teachers’ design rationales and their observations of students’ engagement with SDL. Our analysis revealed a diverse and evolving range of practice-oriented AI integration strategies, shaped by disciplinary orientations, teacher experience, and varying student readiness for SDL. These findings underscore the importance of a discipline-sensitive and context-aware approach towards generative AI integration, moving the discourse away from “one-size-fits-all” implementation toward a more nuanced understanding of AI-supported pedagogy. Crucially, while highlighting successes, the study also identified critical gaps in current SDL enactment, especially around self-monitoring, reflective thinking, and metacognitive regulation, suggesting that these core process dimensions remain insufficiently supported in current classroom uses of generative AI.\n\nIn response to these findings, this study positions and refines the CRAFT framework as a pedagogically grounded scaffold that operationalizes the process dimension of the PPC model within generative AI-supported classrooms. Rather than introducing a new theory of SDL, the integrated PPC-CRAFT representation illustrates how established SDL principles can be translated into structured classroom practices that foreground learner agency, iterative feedback, and reflective learning. The cross-case analyses suggest that opportunities for effective AI-supported SDL depend not only on access to generative AI tools, but also on deliberate teacher orchestration that integrates AI interactions, peer collaboration, and opportunities for metacognitive reflection. Viewed in this way, the framework represents an empirically informed refinement of how SDL processes may be enacted within AI-mediated learning environments, while preserving the broader theoretical foundations of the PPC model.\n\nLooking ahead, the CRAFT framework provides a practical foundation for designing and examining AI-supported SDL across diverse classroom settings, while the integrated PPC-CRAFT representation provides a means for examining how established SDL principles may be operationalized within generative AI-supported learning environments. Future studies should examine the transferability of the framework across schools, learner populations, subject disciplines, and technological infrastructures, while also evaluating how targeted scaffolds for reflection, self-monitoring, and metacognitive regulation influence SDL over time. Together, these efforts can further refine our understanding of how teacher orchestration, learner agency, and generative AI interact to support effective SDL in authentic educational settings.\n\n## Author Contributions\n\nConceptualization, A.V.Y.L., T.C. and J.S.M.C.; methodology, A.V.Y.L. and J.S.M.C.; validation, A.V.Y.L. and T.C.; formal analysis, A.V.Y.L. and J.S.M.C.; investigation, A.V.Y.L., T.C. and J.S.M.C.; resources, A.V.Y.L. and J.S.M.C.; data curation, A.V.Y.L., T.C. and J.S.M.C.; writing—original draft preparation, A.V.Y.L.; writing—review and editing, A.V.Y.L., T.C. and J.S.M.C.; visualization, A.V.Y.L. and J.S.M.C.; project administration, A.V.Y.L. All authors have read and agreed to the published version of the manuscript.\n\n## Funding\n\nThis research received no external funding.\n\n## Institutional Review Board Statement\n\nThe human study protocol was approved by the Institutional Review Board (IRB) of Nanyang Technological University, Singapore (IRB-2024-619,             let tipo = 'Sistema', bg = '#fefce8', color = '#854d0e', justify = 'center', border = '';
            if (m.classList.contains('user-message')) { tipo = 'Tú'; bg = '#2563eb'; color = '#fff'; justify = 'flex-end'; }
            else if (m.classList.contains('bot-message')) { tipo = 'Bot'; bg = '#f1f5f9'; color = '#1e293b'; justify = 'flex-start'; border = 'border:1px solid #e2e8f0;'; }
            return '<div style="display:flex;justify-content:' + justify + ';margin-bottom:10px;"><div style="background:' + bg + ';color:' + color + ';padding:10px 14px;border-radius:10px;max-width:80%;word-wrap:break-word;' + border + '"><small style="opacity:.65;font-size:.75rem;display:block;margin-bottom:4px;">' + tipo + '</small>' + m.innerHTML + '</div></div>';
        }).join('');
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><title>Historial - Chatbot</title><style>body{font-family:Segoe UI,sans-serif;background:#f8fafc;color:#1e293b;margin:0;padding:24px;}.header{text-align:center;margin-bottom:24px;border-bottom:1px solid #e2e8f0;padding-bottom:16px;}h1{color:#2563eb;font-size:1.5rem;margin:0 0 4px;}p{margin:0;color:#64748b;font-size:.85rem;}.chat{max-width:760px;margin:0 auto;}pre{background:#1e293b;color:#f1f5f9;padding:10px;border-radius:6px;overflow-x:auto;}code{background:rgba(37,99,235,.08);padding:2px 5px;border-radius:4px;font-size:.86em;}</style></head><body><div class="header"><h1>📄 Historial del chat</h1><p>Exportado el ' + new Date().toLocaleString('es-CO') + '</p></div><div class="chat">' + rows + '</div></body></html>';
    }
    document.getElementById('download-html-btn').addEventListener('click', () => {
        const html = buildHistorialHTML();
        if (!html) { alert('El historial está vacío.'); return; }
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([html], {type: 'text/html;charset=utf-8'}));
        a.download = 'historial-chatbot-' + Date.now() + '.html';
        a.click(); URL.revokeObjectURL(a.href);
    });
    document.getElementById('download-pdf-btn').addEventListener('click', () => {
        const html = buildHistorialHTML();
        if (!html) { alert('El historial está vacío.'); return; }
        const win = window.open('', '_blank');
        win.document.write(html + '<scr' + 'ipt>window.onload=function(){window.print();window.onafterprint=function(){window.close();};};</scr' + 'ipt>');
        win.document.close();
    });

     suggestedQuestion.addEventListener('change', () => {
         if (suggestedQuestion.value) {
             questionInput.value = suggestedQuestion.value;
             questionInput.focus();
         }
     });

    // Chat
    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const pm = message.replace(/\[/g,'\\[').replace(/\]/g,'\\]').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
            el.innerHTML = '<strong>Chatbot:</strong> <div class="tex2jax_process" style="margin-top:5px;">' + (marked.parse ? marked.parse(pm) : pm) + '</div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(e => console.error(e));
        } else if (sender === 'bot') {
            el.innerHTML = '<strong>Chatbot:</strong> <span>' + message + '</span>'; el.id = 'thinking-msg';
        } else { el.textContent = message; }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const pm = message.replace(/\[/g,'\\[').replace(/\]/g,'\\]').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
        const html = marked.parse ? marked.parse(pm) : pm;
        if (el) { el.innerHTML = '<strong>Chatbot:</strong> <div class="tex2jax_process" style="margin-top:5px;">' + html + '</div>'; el.removeAttribute('id'); if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(e => console.error(e)); }
        else addMsg(message, 'bot');
        chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
        const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        let prompt = 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
         prompt += '(Instrucción: Para expresiones matemáticas, utiliza SÓLO $$...$$ para bloque y $...$ para texto en línea.)\n\nPregunta: ' + question + '\n\nRespuesta:';
        try {
            const res = await fetch(BACKEND_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: prompt, model: MODEL })
            });
            if (!res.ok) { let e=''; try{e=await res.text();}catch(_){} throw new Error('Error del servidor: ' + res.status + ' ' + res.statusText + '. ' + e.substring(0,200)); }
            const text = (await res.text()).trim();
            updateLastMsg(text || 'La IA no proporcionó una respuesta.');
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus();
        }
    }
    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
     addMsg('Documento "' + PDF_NAME + '" listo. ¡Puedes empezar a preguntar!', 'system');
     window.scrollTo(0, 0);
</script>
</body>
</html>
