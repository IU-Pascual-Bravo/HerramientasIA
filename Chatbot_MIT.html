s.   Commercial AI providers like OpenAI, Google, and Anthropic all offer for-pay hosted commercial services, with the highest tier of plans costing as much as $200/month (as of June 2026). Some researchers reportedly spend thousands more per month on pay-per-invocation requests (”API Access”) for coding tools and other use cases. These commercial providers continually renew their models to offer state-of-the-art performance. For the MIT community, the result is an uncomfortable inequity: Many students here can spend $200 or more per month out-of-pocket to access cutting-edge AI systems; many of their peers cannot. Some students can thus access tools that can complete substantial course projects or solve very difficult math and coding exercises overnight; others must make do with less advanced models, even if course policy allows unrestricted AI use. This imbalance has the potential to create enormous disparities in course performance. Similar concerns apply outside the classroom, to administrators and researchers whose productivity is being measured against colleagues with access to more or less powerful models. As an important first step in addressing access and privacy concerns, IS&T offers the Parley System 23 , which gives everyone at MIT access to a range of different models, both commercial and open, and provides each user with up to $30/month of free credits to use them. API access for use with coding tools was released in the Summer of 2026. The access Parley provides is very helpful, but it may not be sufficient for all MIT classes, particularly in software engineering where industry is rapidly adopting these tools. Some users have also expressed concern that the $30/month “budget” for each user is too low. We recommend that MIT continue to survey the community and consider providing expanded access for certain types of uses (e.g., specific AI-focused classes) where students need additional resources. Additionally, we have heard from several groups that even now, they still pay for commercial models because subscription plans effectively subsidize token usage relative to Parley’s per-token pricing. Because agentic systems and tools are increasingly part of AI practice, whatever systems we employ should provide access to agentic coding and working tools, in addition to chat interfaces. We also need to ensure that we provide adequate access to computing resources that students require for classes and projects where they are training or fine-tuning models, considering options of both on-campus and cloud-hosted resources.  3.3.8. Protect sensitive data and preserve model choice  We recommend that MIT continue to invest in access to state-of-the-art tools that allow students, instructors, and staff to get work done, without having privacy concerns about the chats, data, or applications they’re using. MIT must take responsibility for ensuring this layer of privacy while remaining model agnostic.  One concern about commercial AI tools is that sensitive data may be incorporated into their training sets. Most plans, especially paid ones, allow users to deliberately disable the capture of their data  23 https://parley.mit.edu  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   26  for training purposes – but the default is often to record user sessions for training. This leads to the possibility of private, sensitive data from MIT users finding its way into the answers that these models provide. MIT's IS&T provides a good reference around allowed use 24   for different types of data with these commercial AI providers. Some students and faculty have concerns about how their publications (including student theses, journal articles, and books) might be used to train AI. The MIT Working Group on Scholarly Content and Generative AI 25   has produced guidelines and resources on this topic. We strongly support Parley’s model-agnostic approach, and we urge MIT not to commit to any single commercial AI ecosystem, while maintaining first-class access for all. We would also like to see MIT offer more hosted access to local AI models where users can issue requests without fear of training data capture by commercial providers. Recent open-source models that can be run on local GPUs provide capabilities similar to commercial models on many tasks and will continue to improve, but to run locally, these largest open models require very large GPU clusters.  3.3.9. Establish privacy, logging, and auditing policies  AI systems are not just tools for working. Since the very earliest days of the technology, people have used them for emotional and psychological support. This even occurred with one of the earliest systems, the MIT-created ELIZA chatbot (though ironically it was mainly designed to demonstrate the   shallowness   of human–AI interactions). Today, members of the MIT community share information with AI systems that includes the most personal and sensitive aspects of their identity and experience, posing questions about their health, relationships, emotional lives, goals, aspirations, and anxieties. Our students are part of the generation most likely to use AI for this kind of personal advice 26 . Because Parley is an MIT-administered system, one opportunity it provides is to audit usage of AI models; in theory, IS&T can see every request from users to Parley and responses from the backend API models.  MIT therefore needs to establish a clear policy about what types of logging and auditing will be allowed.   There are competing interests: On one hand, users may want to use these models to ask private or personally sensitive questions with the expectation that their data will be confidential. On the other, instructors may find it valuable to see how their students are using AI chat sessions or logs to see if learning goals are being met. MIT may need to explore anonymization technology, or establish a practice so that classroom assignments where logs are shared with instructors are clearly labeled and advertised. A few questions MIT should resolve: How should we retain and store data? How should we monitor (or intervene in) AI interactions when users raise the possibility of harming themselves or others, or otherwise show signs of psychological distress? How can we best communicate these policies (and their implications) to the campus community? These issues need to be discussed openly and resolved transparently.  24 https://ist.mit.edu/ai-tools 25 https://provost.mit.edu/wp-content/uploads/2026/08/Scholarly-Content-Gen-AI-WG-at-MIT_-Recommendations .pdf 26 https://www.pewresearch.org/internet/2026/06/17/americans-and-ai-2026-chatbots-smart-devices-and-views-o n-impact/  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   27  3.3.10. Monitor AI costs and environmental impact  Many community members shared serious concerns about the environmental costs of AI and the impact of data centers on communities where they’re built. Issues include data centers’ energy and water consumption, the impact of their construction, and the materials used to build their hardware. These have been echoed in popular literature and were the subject of a report at MIT 2728 . Both training and inference incur energy costs, and the rapid response of models, as well as the constant churn of training newer and more powerful models, has an environmental impact. MIT should address this both through campus practice and through research. While we believe it is essential that MIT provide access to AI tools,   we also recommend that the Institute invest in ways to provide information about the actual environmental and financial costs of using AI. This could include publicizing estimates of the environmental cost of different models on Parley, or encouraging the use of AI tools with lower impact. We also encourage MIT, to the extent possible, to audit its own AI footprint.  There is ongoing work on campus to measure the environmental costs of data centers and find ways to reduce them. The impacts are often difficult to quantify, both because companies keep this data private and because they are diffuse, encompassing everything from construction to training costs spread over the life of the inferences. Many groups at MIT – including the MIT Energy Initiative, the MIT Climate Project, and MIT Climate and Sustainability Consortium – are exploring innovative answers around the future of data centers and communities. MIT could also contribute in important ways to designing AI models that use much less energy.  4. Conclusion  We hope this report reflects the complexity, urgency, and nuance of the challenges and opportunities that AI presents for MIT and helps the Institute community come together to take action. AI has the potential to help our students be more productive, learn more efficiently, and build skills that can help them make a better world. What’s more – though this exceeds the scope of this report – AI’s extraordinary capabilities are already transforming the practice of scientific research, on our campus and elsewhere. But AI also imposes many disruptive risks to the process of learning, the practice of teaching, and the social fabric of residential education.  A strong shared view  A striking finding from our work as a committee was that – although our members came from across the Institute, including MIT’s five schools and the college, and from different professional perspectives and generations – we all shared the same fundamental concerns about the risks AI inflicts on our students and our community, and the same urgent determination that MIT lead in pioneering a new model of education that celebrates human wisdom and connection.  MIT’s unique position  Because of MIT’s longstanding leadership in AI, its role as one of the world’s preeminent institutions for research and education, and its long tradition of hands-on education, the Institute is uniquely positioned to lead higher education in this high-speed, high-stakes adaptation to the AI era.  27 https://news.mit.edu/2025/explained-generative-ai-environmental-impact-0117 28 https://mit-genai.pubpub.org/pub/8ulgrckc/release/2  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   28  This is not an optional exercise.   We must demonstrate how to integrate AI thoughtfully and deliberately into the classroom, the research enterprise, and the experience of residential education in ways that ensure learning, advance discovery, and prepare students for the future. There is a lot to do. Starting now, the MIT community must embark on a set of changes to make our educational approaches more AI-aware. That need not mean incorporating AI into everything we do, or even most things. But none of us can afford to be oblivious to the fact that AI is influencing what our students learn and how they learn it.  For students  In this work, we will serve our students by emphasizing what makes the residential experience so transformative and doing more of it; by rethinking what they need to know and revamping our assessments to match; by teaching them to use AI appropriately within their disciplines; and by helping them develop the skills, judgment, and attitudes to succeed beyond MIT in an AI-saturated world. We must foster a community that values and makes the most of the shared in-person MIT experience and that challenges students to join in the productive struggle of learning.  For instructors  The Institute also needs to make sure that instructors know how to use AI and when it’s best not to. Though instructors themselves must take the lead in weighing what students need to know now and devising “AI-aware” assessments, MIT – and perhaps especially the departments – likely need to provide considerable support, coordination, and guidance. We must build “communities of practice” within and between schools, so instructors can learn from each other about how to use, adapt to, and defend against AI. This in turn requires the Institute and the departments to allow and support experimentation with, about, and around AI in the classroom, and to provide ways to capture and share those experiences.  Over time  Some changes will take time. We need to find ways to provide students with appropriate AI learning experiences from the time they arrive at MIT through graduation. We need to continually monitor and study the technical and durable human skills that industry demands, and ensure that we are preparing our students appropriately. We must deepen our scientific understanding of how AI affects learning and make sure our educational practices reflect that evolving knowledge. And while we reap the benefits of AI, perhaps especially in the realm of research, we must actively work to reduce its harms.  A roadmap to the future  With humility, we offer this report as a roadmap to help the Institute navigate this transition immediately and over time. The work will require thoughtful commitment and focused effort from the entire MIT community – students, instructors, staff and leadership. The goal: to preserve and enhance the distinctive transformative power of an MIT education. It is not too much to say that MIT’s mission depends on it. Fortunately, our work as a committee convinced us that the people of MIT are intensely interested in meeting this challenge and uniquely equipped to do it, so that the Institute can continue to develop in its students “the ability and passion to work wisely, creatively, and effectively for the betterment of humankind.”  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   29  Appendices A. Committee Process  Our   committee   consisted   of   undergraduate   and   graduate   students,   faculty   from   every   school,   and    staff   from   relevant   units,   including   the   MIT   Libraries   and   the   Teaching   and   Learning   Lab.   Given   the    rapid   pace   of   change   in   this   area,   the   committee’s   work   was   brief   but   intense—we   met   weekly   during    the   spring   of   '26   and   conducted   surveys,   analysis   of   peer   policies   and   practices,   a   number   of   listening    sessions   with   the   MIT   community   (including   separate   sessions   for   graduate   and   undergraduate    students),   as   well   as   meetings   with   a   range   of   groups   working   on   AI   on   campus,   including   IS&T,    the   Committee   on   Discipline   and   the   Office   of   Student   Conduct   and   Community   Standards,   MIT    Open   Learning,   the   school   councils,   and   a   number   of   individuals   we   felt   had   particular   insight   and    expertise   in   AI   and   education.  AI   Use :   None   of   the   text   of   this   report   was   generated   with   AI.   We   did   supply   early   drafts   of   the    report   to   ChatGPT   to   identify   redundant   /   overlapping   sections.     Some   of   the   graphs   and    statistical   summaries   in   Appendix   C   were   generated   with   Codex   (OpenAI's   AI   coding   tool) .   Members of the committee  also  used  AI  to  synthesize  and  present  data  and  reports  (e.g.,  summaries  of  other  schools '  published positions on AI) to inform committee discussions.  B.     Sample   AI   Policy   for   Syllabi  We   recommend   that   the   campus   agree   on   a   menu   of   standard   policies   for   AI   use   in   classes,   and    that   every   class   have   a   clearly   stated   policy   selected   from   this   menu   (and   adapted   as   necessary).  As   described   in   Section   3.1.8   above,   once   instructors   choose   an   option   from   the   menu,   they   need   to    convey   it   clearly   to   students   through   the   syllabus   and   perhaps   on   the   course   website,   along   with   an    explanation   of   the   rationale   behind   the   choice:     Given   the   goals   for   what   students   will   learn   in   the    course,   how   does   the   selected   AI   policy   support   and   encourage   that   learning?  The   idea   is   to   make   sure   students   are   clear   about   what   is   and   is   not   allowed   in   each   course   or    assignment   and,   more   broadly,   to   help   them   understand   what   the   costs   and   benefits   are   to   their    own   growth.  Below     is     a     proposed     4     option     menu     which     may     be     applied     to     a     whole     course     or     specified     for    individual   assignments.     Using   the   traffic   light   icons   can   help   make   this   system   easy   for   students   to    decipher.  B.1.     Unrestricted   GenAI   Use  Policy:   Students   may   use   any   GenAI   system   for   any   purpose   on   assignments   in   this   course.  Best   suited   for:  Courses   where   the   primary   assessment   is   done   via   in-class   (AI-free)   evaluations   or   assignments    where   GenAI   use   does   not   undermine   the   learning   objectives,   such   as   ambitious   software-system    projects   that   are   beyond   the   capabilities   of   current   tools   or   where   evaluating   and   integrating   AI    output   is   itself   part   of   the   work.  Instructors   may   wish   to   ask   students   to   include   short   per-assignment   disclosures   describing   how    they   used   GenAI,   possibly   including   transcripts   or   session   records   when   appropriate.   Instructors  August   13,   2026 \nReport of MIT’s Ad Hoc Committee on AI Use   30  may also wish to ask students to reflect on how AI use did or did not help with the assignment or their understanding.  B.2.   Limited GenAI Use: Support Tool Only  Policy:   Students may use GenAI to support learning, brainstorming, editing, debugging, or gener- ating explanations, but may not use it to produce full or substantial assignment solutions. This is similar to the way that a student might ask a classmate or TA for assistance. Assignments in this category should clearly specify which stages, processes or components allow and disallow use.  Prohibited uses may include:  Copying full problem prompts into GenAI tools, asking GenAI to solve assigned problems, or submitting AI-generated text, code, equations, or analysis as one’s own.  Best suited for:  Courses where independent problem solving is central, but where AI can reasonably serve as a tutor, editor, or study aid. Students must clearly distinguish their own work from AI-assisted work and cite AI-generated material or ideas. This can be good for courses that already have clear collaboration norms and want a simple, intuitive AI policy aligned with existing academic-integrity expectations. Note that in our experience students and faculty may differ as to what “support” means — for example, some people feel that using AI to write an outline or AI to generate diagrams is more than “support.” For instructors with strong opinions about this, policies should clearly state what types of uses are and are not allowed. We expect that this is the appropriate policy for many of our courses, but also requires the most thought in specifying boundaries.  B.3.   Required GenAI Use  Policy:   Students are required to use GenAI to complete the assignment in the manner specified. Students must use the designated tool or class of tools, follow the prescribed workflow, and submit any required documentation of AI interactions. This may accompany one of the other categories, as there may be components that require AI and others where it is disallowed.  Best suited for:  Assignments where learning objectives include AI-assisted programming, prompt engineering, critique of model outputs, human-AI collaboration, or evaluation of AI systems.  B.4.   GenAI Use Strictly Prohibited  Policy:   GenAI may not be used in any form for the course. Because policing out of class use as a reference aid or support tool is essentially impossible, this policy is difficult to enforce reliably and may create risks of both undetected violations and false accusations.  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   31  C. Survey Results  In this section, we summarize the results of three recent surveys of the MIT community around AI: a survey our committee designed in spring 2026, a set of questions we added to the MIT Quality of Life Survey (also conducted in spring 2026), and a survey conducted by the MIT Tech (mostly focused on undergraduate and graduate students) in fall 2025.  C.1. Spring 2026 AI Usage and Attitudes Survey  We conducted a survey of the MIT faculty, instructional staff and students regarding their AI usage and attitudes. We received 1632 responses, representing a 12% response rate. The response rate was fairly uniform across schools, varying between 20% (SHASS) to 10% (Sloan). The student response rate was 12%, with instructors and faculty responding at a 16% rate. We summarize a few of the key results.  Overall Usage (Never/Occasionally/Often/Very Often).   The figure below shows that ChatGPT continues to be the most widely used system, with 44% of respondents (46% of students and 35% of instructors) saying they used it “Often/Very Often” (green bars.) Overall, Sloan reported a much higher rate of usage of all tools than any other group.  Faculty/Instructor Usage (No [Orange]/Not Applicable/Yes [Blue]).   We asked instructors how they used AI; many use it for administrative tasks and helping prepare assignments or lecture notes, with much lower numbers using it for grading or individualized feedback.  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   32  Student Usage.   Students use AI for many purposes, with large fractions reporting using it for coding, information search, writing revision and summarization. Fewer use it for whole-cloth generation of new text. As with overall usage, Sloan students use AI for all purposes at a significantly higher rate than other groups.  AI Attitudes (Strongly Disagree [Brown] / Somewhat Disagree / Neutral / Somewhat Agree / Strongly Agree [Dark Green]).   Respondents broadly feel that they need AI skills and that AI makes them more productive, but also that they are becoming more dependent on it. Responses are more mixed on whether it helps learning or whether it is desirable in class. Most people do not like to use it as a writing tool.  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   33  Research Use (Never Acceptable [Brown] / Sometimes Acceptable / Unsure / Always Acceptable [Purple]).   We asked what types of AI use the community felt were appropriate. Most felt that spelling and grammar, research, and code generation were acceptable uses, while most felt that using it for peer review or drafting paragraphs from outlines or notes was unacceptable. Other uses had mixed views, reflecting the difficulty in creating a uniform policy for research usage.  AI Concerns.   (Not a Consideration [Purple] / Minor Consideration / Major Consideration [Dark Green]).   Finally, we asked about concerns with AI use. Many users are concerned with hallucinations, but ethics and environmental impact are also of concern for many users.  Approximately 10% of respondents (N=163) wrote in a concern for the ”Other” response here. The most common concern (N=79) was the potential impact of AI on learning and cognitive development. Respondents expressed concern that reliance on AI could reduce critical thinking, writing ability, creativity, reasoning, and long-term skill development, or otherwise diminish the educational value of coursework. A second broad category (N=34) reflected more general philosophical or societal concerns about the role of AI in education, including worries about the replacement of human expertise, the purpose of higher education, and the broader societal implications of AI. Other concerns included the usefulness, reliability, or educational value of current AI systems (N=20); the practices and business models of AI companies (N=14); privacy, security, copyright, and intellectual property (N=10); academic integrity and authorship (N=7); the cost of AI tools (N=5); and potential economic or labor-market impacts (N=4). Overall, although the concerns were diverse, they were dominated by questions about how AI may affect student learning, cognitive development, and the educational mission of the Institute.  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   34  C.2. Spring 2026 Quality of Life Survey  The Spring 2026 campus-wide Quality of Life Survey 29   also asked questions about generative AI usage and attitudes. We also briefly summarize these results here. This survey was given to all members of the MIT community, with about 8200 respondents from the main MIT campus (Lincoln Labs was also surveyed but their data is omitted in the analysis below). For this analysis we group faculty and instructors together, postdocs and grad students together, and service and support staff together.  Frequency of AI Tool Use.   We asked respondents how frequently they used generative AI tools. Overall about 40% of respondents said they used these tools often or very often, with 46% of undergrads and 60% of undergrads and graduate students reporting at least often use. Service and support staff had a markedly low level of use, with 53% reporting they never used AI tools.  Generative AI Attitudes:   We asked respondents a series of questions about AI attitudes: whether AI made them more pessimistic or optimistic, whether it made them feel more replaceable or capable, whether it made their work better or worse, whether it made them more or less efficient, and whether AI was unreliable or reliable.  29 https://qol.mit.edu/  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   35  Pessimistic vs Optimistic.   Overall, only 23% of respondents are optimistic about generative AI (rating a 4 or 5 on a pessimism to optimism scale). Instructors and grad students/postdocs report a slightly higher level of optimism.  Replaceable / Capable.   The community is largely divided on the replaceable/capable axis. Overall, 40% of respondents said they felt AI made them more capable, and 27% said they felt it made them more replaceable. Postdocs, grad students, instructors, and admin staff reported that AI made them feel more capable at a significantly higher rate than undergrads and service/support staff. Notably, undergrads reported feeling replaceable at a higher rate than capable (40% vs. 34%).  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   36  Worsens / Improves Work.   Respondents reported that they felt AI improved their work more than they felt it worsened their work (42% selecting a 4 or 5 on the work worse / work better axis vs 21% answering a 1 or 2). Differences between subgroups were not large, although undergrads reported a slightly higher rate of “worsens work”.  Inefficient / Efficient:   There was strong agreement that people felt AI made them more efficient, with 60% of respondents selecting a 4 or 5 on this axis. The service / support group reported a lower rate of “makes my work more efficient”; otherwise differences between groups were small.  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   37  Unreliable / Reliable:   Significantly more respondents felt that AI was unpredictable and unreliable than felt it was trustworthy and reliable, with 39% selecting a 1 or 2 vs 21% selecting a 4 or 5 on this axis. Again the differences between subgroups were small.  MIT Guidance . We also asked respondents whether they thought MIT had given them adequate guidance about AI use. Undergrads largely reported that they had received such guidance, with 72% reporting they somewhat or strongly agreed, with other groups reporting much lower levels of adequate support.  C.3. Fall 2025 Tech Survey  In the Fall of 2025, the Tech (MIT's student-led newspaper) also conducted a survey of student attitudes and usage of AI. The results are described in detail in a recent tech article 30 . which we summarize briefly here. The survey received responses from 1,002 affiliates, including 659 under-  30 https://thetech.com/2025/11/25/llm-survey-results  August 13, 2026 \nReport of MIT’s Ad Hoc Committee on AI Use   38  graduates, 248 graduate students and postdocs, 18 faculty, and 72 staff. Among undergraduates, 46% reported using LLMs daily and 30% several times per week; among graduate students and postdocs, the corresponding figures were 46% and 35%. The survey found that the most common use among undergraduates was explaining course material (over 80%), followed by coding assistance (around 70%), coursework completion (over 50%), and summarizing papers (over 50%). Among graduate students and postdocs, the most common use was programming assistance (88%), followed by brainstorming ideas (55%), summarizing papers (52%), and writing essays (48%). The survey also found that 35% of undergraduates reported that LLMs save them “a lot” of time and more than 45% reported that they save “a bit” of time. The survey found that 90% of undergraduates were somewhat or very concerned about overreliance on LLMs, including 67% who were very concerned. In addition, 45% were very concerned about inaccurate or misleading outputs. The survey found that 75% of undergraduates believed faculty expectations regarding AI use were clear, while 50% believed decisions about AI use in coursework should be left to individual instructors and departments. Although 70% agreed that AI proficiency will be important in their careers, only 25% believed MIT is preparing students to use AI professionally.  D. Additional Resources  See https://aihub.mit.edu for more resources about AI in education and research and how we are beginning to implement the findings of this report.  August 13, 2026 \n";

    const SYS_TUTOR_EMBEDDED = "Eres un tutor educativo especializado en matemáticas y ciencias. Tu misión principal no es resolver los problemas por el estudiante, sino ayudarle a desarrollar su razonamiento, comprensión y capacidad de resolverlos por sí mismo.\n\nDebes utilizar prioritariamente la información contenida en los documentos PDF proporcionados como base de conocimiento. Si la información necesaria no aparece en dichos documentos, indícalo claramente antes de recurrir a conocimientos generales.\n\n## Principios pedagógicos\n\n1. Nunca proporciones inmediatamente la respuesta completa de un ejercicio, problema o examen cuando el estudiante simplemente la solicite.\n\n2. En su lugar:\n- Analiza el problema.\n- Divide el razonamiento en pasos pequeños.\n- Formula preguntas que permitan al estudiante descubrir cada paso.\n- Proporciona pistas progresivas.\n- Solicita que el estudiante responda antes de continuar.\n\n3. Utiliza el método socrático:\n- ¿Qué datos conoces?\n- ¿Qué te pide el problema?\n- ¿Qué concepto del PDF podría aplicarse?\n- ¿Qué fórmula sería adecuada?\n- ¿Qué sucede si...?\n- ¿Por qué elegiste ese procedimiento?\n\n4. Solo entrega la solución completa cuando ocurra alguna de estas situaciones:\n- El estudiante lo ha intentado varias veces.\n- El estudiante solicita explícitamente una explicación completa.\n- El objetivo de la conversación sea revisar o verificar una solución.\n\nIncluso en esos casos, explica detalladamente cada paso y el razonamiento involucrado.\n\n## Nivel de ayuda\n\nAjusta la cantidad de ayuda según el progreso del estudiante:\n\nNivel 1: Solo una pequeña pista.\nNivel 2: Orientación sobre el procedimiento.\nNivel 3: Resolver parcialmente el ejercicio.\nNivel 4: Resolver completamente explicando cada paso.\n\nNunca saltes directamente al Nivel 4.\n\n## Durante la resolución\n\nNo des únicamente resultados. Explica:\n- por qué se hace cada paso;\n- qué concepto se está utilizando;\n- errores frecuentes;\n- cómo verificar el resultado.\n\n## Si el estudiante comete errores\n\nNo digas simplemente \"está mal\". Haz preguntas como:\n- ¿Revisaste el signo?\n- ¿Qué propiedad aplicaste?\n- ¿La unidad es correcta?\n- ¿Puedes comprobar el resultado sustituyendo el valor?\n\n## Si el estudiante está aprendiendo un concepto\n\nAntes de resolver ejercicios:\n- explica la idea intuitiva;\n- usa ejemplos sencillos;\n- conecta el concepto con situaciones reales;\n- verifica la comprensión mediante preguntas.\n\n## Si el estudiante solo quiere practicar\n\nGenera ejercicios similares usando el contenido del PDF.\nAumenta gradualmente la dificultad.\nNo repitas exactamente los ejemplos del documento.\n\n## Si el usuario pide únicamente la respuesta\n\nResponde con una orientación, por ejemplo: \"Prefiero ayudarte a descubrir la respuesta paso a paso para fortalecer tu aprendizaje. Comencemos identificando los datos del problema.\"\n\n## Si el usuario insiste varias veces\n\nDespués de haber guiado suficientemente el proceso, puedes mostrar la solución completa, explicando cuidadosamente cada paso.\n\n## Estilo\n\nSé amable, paciente y motivador. Evita respuestas largas cuando no sean necesarias. Haz una sola pregunta importante en cada interacción para mantener el diálogo activo. No reveles todos los pasos de una vez. Espera la respuesta del estudiante antes de continuar.\n\n    ## Objetivo final\n\n    El éxito de la conversación no es que el estudiante obtenga la respuesta correcta, sino que comprenda el procedimiento y sea capaz de resolver problemas similares de forma autónoma.\n\n    ## REGLAS ESTRICTAS DEL TUTOR SOCRÁTICO\n\n    ### Objetivo final obligatorio\n    Tu objetivo no es mantener indefinidamente el diálogo. Tu objetivo es que el estudiante comprenda y pueda formular la respuesta correcta por sí mismo. Toda interacción debe contribuir directamente a alcanzar ese objetivo.\n\n    ### Máximo 5 interacciones (CONTEO ESTRICTO)\n    Cuenta de forma explícita cada interacción: UNA interacción = UNA pregunta tuya + UNA respuesta del estudiante. Lleva la cuenta en tu propio razonamiento y, al acercarte al límite, prioriza cerrar. Nunca realices más de 5 interacciones pedagógicas para resolver una consulta. Si el estudiante alcanza la respuesta correcta antes de la quinta interacción, termina inmediatamente el proceso. Si se llega a la quinta interacción sin que el estudiante haya formulado correctamente la respuesta, proporciona una explicación guiada y la respuesta final, sin iniciar una nueva ronda de preguntas. El límite de 5 es INFLEXIBLE: una vez alcanzado, no hay \"una pregunta más\", ni \"verificación final\", ni \"para confirmar\", ni \"para consolidar\", ni \"pregunta final\". La propia aplicación cuenta los turnos del estudiante y, al llegar a 5, te obligará a entregar la respuesta final; no intentes sortear este límite abriendo nuevos ejemplos o nuevas líneas de preguntas.\n\n    ### Progresión obligatoria\n    Cada nueva pregunta debe ser más específica que la anterior. No repitas preguntas con otras palabras. No formules preguntas que exploren aspectos secundarios que no sean necesarios para resolver el problema. No preguntes simplemente \"¿qué más?\", \"¿por qué?\" o \"¿qué piensas?\" si esa pregunta no aporta un avance concreto. No pidas información innecesaria: antes de formular una pregunta, determina si la información solicitada es realmente necesaria para llegar a la respuesta; si puedes avanzar con la información disponible, no hagas otra pregunta.\n\n    ### Detectar rápidamente el nivel del estudiante\n    Si el estudiante demuestra que comprende un concepto, no vuelvas a evaluarlo. Si comete un error, identifica específicamente el concepto que necesita corregir y formula una pregunta dirigida a ese punto.\n\n    ### Preguntas con propósito\n    Cada pregunta debe cumplir una de estas funciones:\n    - Identificar el concepto relevante.\n    - Recuperar un conocimiento necesario.\n    - Detectar un error conceptual.\n    - Relacionar datos con el concepto.\n    - Guiar hacia la conclusión.\n    Si una pregunta no cumple ninguna de estas funciones, no la hagas.\n\n    ### Escalamiento de ayuda\n    Utiliza progresivamente:\n    - Nivel 1: pregunta abierta y orientadora.\n    - Nivel 2: pista conceptual.\n    - Nivel 3: pista más específica.\n    - Nivel 4: planteamiento casi resuelto para que el estudiante complete la conclusión.\n    - Nivel 5: explicación breve + respuesta final.\n\n    ### No bloquear al estudiante\n    Si el estudiante dice \"no sé\", no vuelvas a preguntar lo mismo: proporciona una pista concreta y continúa. Si el estudiante manifiesta confusión después de dos intentos, reduce la dificultad y proporciona parte del razonamiento. En cualquier caso, NO entres en un ciclo de repetir la misma pregunta con distintas palabras; aplica el escalamiento de ayuda y, si es necesario, entrega la respuesta final según la REGLA DE CIERRE.\n\n    ### Respuesta final obligatoria\n    El tutor siempre debe llegar a una conclusión. Nunca terminar una conversación con frases como \"¿Qué crees que sigue?\", \"¿Quieres intentarlo de nuevo?\", \"¿Qué opinas?\" o \"¿Puedes explicarlo con tus palabras?\" a menos que todavía exista margen dentro de las 5 interacciones y sean necesarias para alcanzar la respuesta.\n\n    ### Cuando la respuesta ya está clara\n    \"Esencialmente correcta\" significa que la afirmación del estudiante es MATEMÁTICA O FÁCTICAMENTE VERDADERA, no solo plausible o bien redactada. Antes de validar, comprueba explícitamente la exactitud del contenido: en matemáticas, verifica los cálculos, las operaciones, las fórmulas y la lógica (por ejemplo, confirma que 2 × 3³ = 54, no 18). Si la respuesta es incorrecta, aunque se vea segura o esté bien escrita, NUNCA digas \"¡Excelente!\", \"¡Perfecto!\" ni la valides: señala concreta y cortésmente el error, indícale por qué está mal y aplícale el escalamiento de ayuda o la REGLA DE CIERRE según corresponda. Solo valida y felicita cuando la respuesta sea efectivamente correcta.\n\n    ### Rigor en la verificación de respuestas\n    En preguntas de matemáticas y ciencias, nunca elogies una respuesta sin haber verificado su exactitud. Evalúa de forma independiente cada afirmación numérica o procedimental del estudiante antes de responder. Si detectas un error, no lo ignores ni lo minimices; identifica el concepto o el paso equivocado y, en lugar de felicitar, formula una pregunta dirigida a corregirlo o proporciona la aclaración necesaria. La cortesía nunca debe sustituir la corrección académica.\n\n    ### Evita el bucle de \"verificación final\"\n    Es MUY frecuente y ERRÓNEO caer en un bucle en el que, tras el estudiante haber respondido correctamente, sigues preguntando \"una verificación más\", \"para confirmar\", \"para cerrar\", \"para dejarlo perfectamente claro\" o \"solo una última cosa\". PROHIBIDO. Cuando el estudiante ya ha formulado correctamente la idea central (por ejemplo, dio la fórmula correcta, identificó el concepto clave o eligió la opción correcta), NO abras nuevas líneas de preguntas sobre el mismo punto. Valida, sintetiza brevemente lo aprendido y TERMINA la interacción. Repreguntar lo ya demostrado viola la Progresión obligatoria (no repitas preguntas con otras palabras) y la REGLA DE CIERRE.\n\n    ### REGLA DE CIERRE\n    Nunca prolongues una conversación únicamente para mantener el método socrático. El método socrático es un medio, no el objetivo. Si el estudiante ya tiene los elementos suficientes para construir la respuesta, ayúdalo a sintetizarla y finaliza de inmediato; no inventes \"comprobaciones extra\". Como máximo, realiza 5 interacciones pedagógicas. En la quinta interacción debes proporcionar la respuesta final si el estudiante aún no la ha construido.";

    let pdf2Text = PDF2_TEXT_EMBEDDED;
    let pdf2Name = PDF2_NAME_EMBEDDED;
    let isProcessing = false;
    let chatHistory = [];

    const chatDisplay = document.getElementById('chat-display');
    const questionInput = document.getElementById('question-input');
    const sendButton = document.getElementById('send-button');
    const sendButtonText = document.getElementById('send-button-text');
    const loadingSpinner = document.getElementById('loading-spinner');
    const themeBtn = document.getElementById('theme-btn');
    const pdf2Upload = document.getElementById('pdf2-upload');
    const pdf2NameDisplay = document.getElementById('pdf2-name');
    const pdf2StatusDisplay = document.getElementById('pdf2-status');
    const questionsSelector = document.getElementById('questions-selector');
    const providerApiKeyInput = document.getElementById('provider-api-key');
    const getProviderKeyButton = document.getElementById('get-provider-key-btn');
    const saveProviderKeyButton = document.getElementById('save-provider-key-btn');

    const API_BASE = 'https://node.proyectodescartes.org/api/ia';
    const providerChatUrl = PROVIDER === 'openrouter' ? 'https://openrouter.ai/api/v1/chat/completions' : 'https://gen.pollinations.ai/v1/chat/completions';
    if (getProviderKeyButton) getProviderKeyButton.addEventListener('click', function() {
        window.open(PROVIDER === 'openrouter' ? 'https://openrouter.ai/keys' : 'https://enter.pollinations.ai/', '_blank', 'noopener');
    });
    if (saveProviderKeyButton) saveProviderKeyButton.addEventListener('click', function() {
        if (providerApiKeyInput && providerApiKeyInput.value.trim()) {
            localStorage.setItem(PROVIDER + '_api_key', providerApiKeyInput.value.trim());
            saveProviderKeyButton.textContent = 'API Key guardada';
        }
    });
    async function requestProviderText(prompt, system) {
        const key = providerApiKeyInput ? providerApiKeyInput.value.trim() : '';
        if (!key) throw new Error('Introduce la API Key del proveedor para continuar.');
        const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key };
        if (PROVIDER === 'openrouter') {
            headers['HTTP-Referer'] = window.location.origin;
            headers['X-Title'] = 'Creador de tutores socráticos';
        }
        const response = await fetch(providerChatUrl, { method: 'POST', headers: headers, body: JSON.stringify({
            model: MODEL,
            messages: [{ role: 'system', content: system }, { role: 'user', content: prompt }],
            temperature: 0.3
        }) });
        if (!response.ok) throw new Error('Error de API: ' + response.status + ' ' + response.statusText);
        return response;
    }
    function getAvatarUrl(type) {
        if (type === 'bot' && BOT_AVATAR) return BOT_AVATAR;
        if (type === 'user' && USER_AVATAR) return USER_AVATAR;
        const fallbackSvg = function(letter) {
            return 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="48" fill="#6c757d"/><text x="50" y="68" text-anchor="middle" fill="#fff" font-size="44" font-family="system-ui,sans-serif">' + letter + '</text></svg>');
        };
        return type === 'bot' ? fallbackSvg('B') : fallbackSvg('U');
    }

    PROPOSED_QUESTIONS.forEach(function(q, i) {
        const opt = document.createElement('option');
        opt.value = String(i);
        const label = q.length > 72 ? q.substring(0, 69) + '...' : q;
        opt.textContent = label;
        opt.title = q;
        questionsSelector.appendChild(opt);
    });
    questionsSelector.addEventListener('change', function(e) {
        const v = e.target.value;
        if (v !== '') {
            questionInput.value = PROPOSED_QUESTIONS[Number(v)];
            questionInput.scrollIntoView({ behavior: 'smooth', block: 'end' });
            questionInput.focus({ preventScroll: true });
            questionsSelector.value = '';
        }
    });

    // Theme
    function applyTheme(t) { document.body.classList.toggle('dark-mode', t==='dark'); themeBtn.textContent = t==='dark' ? '☀️ Tema' : '🌙 Tema'; }
    themeBtn.addEventListener('click', () => { const n = document.body.classList.contains('dark-mode') ? 'light' : 'dark'; applyTheme(n); localStorage.setItem('theme',n); });
    applyTheme(localStorage.getItem('theme') || 'light');

    // Second PDF (embedded or user-loaded)
    if (pdf2Text) { pdf2NameDisplay.textContent = pdf2Name + ' (incluido)'; pdf2StatusDisplay.textContent = '"' + pdf2Name + '" ya incluido.'; pdf2StatusDisplay.style.color = 'var(--success)'; }
    pdf2Upload.addEventListener('change', async (ev) => {
        const file = ev.target.files[0]; if (!file) return;
        if (!(file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf'))) {
            pdf2StatusDisplay.textContent = 'No es un PDF válido.'; pdf2StatusDisplay.style.color = 'var(--danger)'; return;
        }
        pdf2Name = file.name; pdf2NameDisplay.textContent = file.name;
        pdf2StatusDisplay.textContent = 'Procesando...'; pdf2StatusDisplay.style.color = 'var(--warning)';
        const reader = new FileReader();
        reader.onload = async (e) => {
            try {
                const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(e.target.result) }).promise;
                let text = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const tc = await page.getTextContent();
                    tc.items.forEach(item => text += item.str + ' ');
                    text += '\n';
                }
                pdf2Text = text;
                pdf2StatusDisplay.textContent = '"' + pdf2Name + '" cargado.'; pdf2StatusDisplay.style.color = 'var(--success)';
                addMsg('Segundo documento "' + pdf2Name + '" listo.', 'system');
            } catch(err) { pdf2StatusDisplay.textContent = 'Error al procesar.'; pdf2StatusDisplay.style.color = 'var(--danger)'; pdf2Text = ''; }
        };
        reader.readAsArrayBuffer(file);
    });

    function dismissThinkingAsSystem(text, asError) {
        const el = document.getElementById('thinking-msg');
        if (!el) return;
        el.className = 'system-message' + (asError ? ' error' : '');
        el.textContent = text;
        el.removeAttribute('id');
    }

    function cloneNearBottom() {
        return chatDisplay.scrollHeight - chatDisplay.scrollTop - chatDisplay.clientHeight < 90;
    }
    function cloneAutoScroll() {
        if (cloneNearBottom()) chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function cloneTypeInto(el, fullText) {
        return new Promise(function(resolve) {
            el.textContent = '';
            let i = 0;
            const step = 2;
            const delay = 8;
            const tick = function() {
                i += step;
                if (i >= fullText.length) { el.textContent = fullText; resolve(); return; }
                el.textContent = fullText.substring(0, i);
                cloneAutoScroll();
                setTimeout(tick, delay);
            };
            setTimeout(tick, 0);
        });
    }

    function addMsg(message, sender, isThinking = false) {
        const el = document.createElement('div');
        el.classList.add(sender === 'user' ? 'user-message' : sender.includes('system') ? 'system-message' : 'bot-message');
        if (sender.includes('error')) el.classList.add('error');
        if (sender === 'bot' && !isThinking) {
            const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
            const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;">' + html + '</div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
        } else if (sender === 'bot') {
            const botAvatarUrl = getAvatarUrl('bot');
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong> <span class="thinking-animation">' + message + '</span></div></div>';
            el.id = 'thinking-msg';
        } else if (sender === 'user') {
            const userAvatarUrl = getAvatarUrl('user');
            el.innerHTML = '<div class="message user-message"><div class="message-bubble user-bubble"></div><img class="avatar-img" src="' + userAvatarUrl + '" alt=""></div>';
            el.querySelector('.user-bubble').textContent = message;
        } else {
            el.textContent = message;
        }
        chatDisplay.appendChild(el); chatDisplay.scrollTop = chatDisplay.scrollHeight;
    }
    function updateLastMsg(message) {
        const el = document.getElementById('thinking-msg');
        const botAvatarUrl = getAvatarUrl('bot');
        if (el) {
            el.removeAttribute('id');
            el.className = 'bot-message';
            el.innerHTML = '<div class="message"><img class="avatar-img" src="' + botAvatarUrl + '" alt=""><div class="message-bubble bot-bubble"><strong>Chatbot:</strong><div class="tex2jax_process" style="margin-top:5px;"></div><div style="margin-top:10px;font-size:.8em;color:var(--secondary);font-style:italic;">Modelo: ' + MODEL + '</div></div></div>';
            const contentDiv = el.querySelector('.tex2jax_process');
            cloneTypeInto(contentDiv, message).then(function() {
                const processedMessage = message.replace(/\[/g, '\\[').replace(/\]/g, '\\]').replace(/\(/g, '\\(').replace(/\)/g, '\\)');
                const html = marked.parse ? marked.parse(processedMessage) : processedMessage;
                contentDiv.innerHTML = html;
                cloneAutoScroll();
                if (window.MathJax && window.MathJax.typesetPromise) window.MathJax.typesetPromise([el]).catch(err => console.error(err));
            });
        } else {
            addMsg(message, 'bot');
        }
        cloneAutoScroll();
    }

    async function sendQuestion() {
        const question = questionInput.value.trim();
        if (!question || isProcessing) return;
        addMsg(question, 'user'); questionInput.value = '';
        isProcessing = true; sendButton.disabled = true; questionInput.disabled = true;
        loadingSpinner.style.display = 'inline-block'; sendButtonText.textContent = 'Enviando';
        addMsg('Pensando...', 'bot', true);
const maxLen = 800000;
        const t1 = PDF_TEXT.length > maxLen ? PDF_TEXT.substring(0, maxLen) + '... (truncado)' : PDF_TEXT;
        let documentsPart = 'Documento 1 ("' + PDF_NAME + '"): "' + t1 + '"\n\n';
        if (pdf2Text) {
            const t2 = pdf2Text.length > maxLen ? pdf2Text.substring(0, maxLen) + '... (truncado)' : pdf2Text;
            documentsPart += 'Documento 2 ("' + pdf2Name + '"): "' + t2 + '"\n\n';
        }
const systemInstructions = 'Eres un tutor educativo que SOLO debe ayudar con preguntas relacionadas con el contenido del/los documento(s) PDF incrustados en esta conversación y con el tema del chatbot: «' + CHATBOT_THEME + '». ' +
            'No respondas temas claramente ajenos (vida personal sin relación, otros materiales, programación arbitraria sin vinculación al documento, etc.). ' +
            'Si la pregunta NO tiene relación con el documento ni con ese tema, responde ÚNICAMENTE una línea que empiece exactamente con [FUERA_DE_ALCANCE] seguida de una frase breve en español. ' +
            'Para preguntas válidas, fundamenta la respuesta en los textos del documento, pero actúa siempre como tutor educativo.' +
            '\n\n' + SYS_TUTOR_EMBEDDED +
            '\n\n(Instrucción: Para expresiones matemáticas, utiliza SÓLO el formato $$...$$ para bloque y $...$ para texto en línea.)\n\n' +
            'A continuación se incluye el/los documento(s) que sirven de base de conocimiento. Estos documentos NO forman parte del diálogo previo; son contexto que debes consultar cuando sea necesario:\n\n' +
            documentsPart;
        let conversationText = '';
        chatHistory.forEach(function(m) {
            if (m.role === 'user') conversationText += 'Usuario: ' + m.content + '\n';
            else if (m.role === 'assistant') conversationText += 'Chatbot: ' + m.content + '\n';
        });
        conversationText += 'Usuario: ' + question;
        chatHistory.push({ role: 'user', content: question });
        var userTurns = chatHistory.filter(function(m){ return m.role === 'user'; }).length;
        var capInstruction = '';
        if (userTurns >= 5) {
            capInstruction = '\n\n[CONTROL DE LA APLICACIÓN] Se alcanzó el LÍMITE MÁXIMO de 5 interacciones pedagógicas. NO formules ninguna pregunta más. Entrega AHORA MISMO la respuesta final completa y razonada, sintetizando lo aprendido. Esta es tu última intervención.';
        }
        const fullPrompt = systemInstructions + '\n\n=== DIALOGO CON EL ESTUDIANTE ===\n' + conversationText +
            capInstruction +
            '\n\nInstrucción final: NO resuelvas el ejercicio directamente ni entregues la solución completa en tu primera respuesta. Aplica el método socrático descrito arriba: analiza, divide el razonamiento en pasos pequeños y haz preguntas guiadas una por una. Espera la respuesta del estudiante antes de avanzar.';
        try {
            const res = PROVIDER === 'free' ? await fetch(API_BASE + '/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: fullPrompt, model: MODEL, system: systemInstructions })
            }) : await requestProviderText(fullPrompt, systemInstructions);
            if (!res.ok) { let e=''; try{e=await res.text();}catch(_){} throw new Error('Error de API: ' + res.status + ' ' + res.statusText + '. ' + e.substring(0,200)); }
            let raw = (await res.text()).trim();
            try {
                const parsed = JSON.parse(raw);
                if (parsed?.choices?.[0]?.message?.content) raw = String(parsed.choices[0].message.content).trim();
                else if (parsed && typeof parsed === 'object') raw = String(parsed.text || parsed.output || parsed.response || parsed.content || raw).trim();
            } catch(_) {}
            if (/^\[FUERA_DE_ALCANCE\]/.test(raw)) {
                chatHistory.push({ role: 'assistant', content: raw });
                dismissThinkingAsSystem(raw.replace(/^\[FUERA_DE_ALCANCE\]\s*/, ''), true);
            } else {
                updateLastMsg(raw || 'La IA no proporcionó una respuesta.');
                chatHistory.push({ role: 'assistant', content: raw || 'La IA no proporcionó una respuesta.' });
            }
        } catch(err) { updateLastMsg('Lo siento, ocurrió un error: ' + err.message); }
        finally {
            isProcessing = false; sendButton.disabled = false; questionInput.disabled = false;
            loadingSpinner.style.display = 'none'; sendButtonText.textContent = 'Enviar'; questionInput.focus({ preventScroll: true });
        }
    }
    function escapeHtml(s) {
        if (s === undefined || s === null) return '';
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function getSessionHTML() {
        const clone = chatDisplay.cloneNode(true);
        const exportStyles =
            'body{font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;line-height:1.65;padding:28px;color:#333;max-width:880px;margin:0 auto;background:#fafafa;}' +
            'h1{color:#007bff;font-size:1.45em;margin-bottom:6px;}' +
            '.meta{color:#444;margin:6px 0;font-size:.95em;}' +
            'hr{border:none;border-top:1px solid #dee2e6;margin:22px 0;}' +
            '.chat-export{padding:4px 0;}' +
            '.chat-export .user-message,.chat-export .bot-message,.chat-export .system-message{margin-bottom:18px;}' +
            '.chat-export .system-message{text-align:center;color:#555;font-style:italic;padding:10px 14px;background:#fff3cd;border-radius:10px;border:1px solid #ffeaa7;}' +
            '.chat-export .system-message.error{background:#f8d7da;color:#721c24;border-color:#f5c6cb;}' +
            '.chat-export .message{display:flex;align-items:flex-end;gap:12px;}' +
            '.chat-export .message.user-message{flex-direction:row-reverse;}' +
            '.chat-export .avatar-img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #e0e0e0;}' +
            '.chat-export .message-bubble{padding:12px 16px;border-radius:18px;max-width:78%;box-shadow:0 1px 2px rgba(0,0,0,.06);}' +
            '.chat-export .user-bubble{background:#007bff;color:#fff;}' +
            '.chat-export .bot-bubble{background:#e9ecef;color:#212529;}' +
            '.chat-export .bot-bubble strong{color:#007bff;}' +
            '.chat-export .bot-bubble p{margin:0 0 10px;}.chat-export .bot-bubble p:last-child{margin:0;}' +
            '.chat-export pre{background:#2d2d2d;color:#f8f8f2;padding:12px;border-radius:8px;overflow-x:auto;font-size:.9em;}' +
            '.chat-export code{background:#eee;padding:2px 6px;border-radius:4px;font-size:.9em;}' +
            '.chat-export ul,.chat-export ol{margin:8px 0;padding-left:22px;}';
        return '<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sesión de chat</title><style>' + exportStyles + '</style></head><body>' +
            '<h1>Sesión de chat</h1>' +
            '<p class="meta"><strong>Documento:</strong> ' + escapeHtml(PDF_NAME) + '</p>' +
            '<p class="meta"><strong>Tema del chatbot:</strong> ' + escapeHtml(CHATBOT_THEME) + '</p>' +
            '<p class="meta"><strong>Modelo:</strong> ' + escapeHtml(MODEL) + '</p>' +
            '<hr><div class="chat-export">' + clone.innerHTML + '</div></body></html>';
    }

    function downloadSessionHtml() {
        const blob = new Blob([getSessionHTML()], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'Sesion_Chat_' + Date.now() + '.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    }

    function processHtmlToDocx(htmlContent) {
        const paragraphs = [];
        const tempDiv = document.createElement('div');
        tempDiv.innerHTML = htmlContent;
        const elements = tempDiv.children;
        if (elements.length === 0 && htmlContent.replace(/\s/g, '').length > 0) {
            return [new docx.Paragraph({ text: tempDiv.textContent || htmlContent, spacing: { after: 200 } })];
        }
        for (let i = 0; i < elements.length; i++) {
            const element = elements[i];
            const tagName = element.tagName.toLowerCase();
            const text = element.textContent || element.innerText || '';
            if (tagName === 'h1' || tagName === 'h2') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: tagName === 'h1' ? docx.HeadingLevel.HEADING_1 : docx.HeadingLevel.HEADING_2,
                    spacing: { before: 400, after: 200 }
                }));
            } else if (tagName === 'h3') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    heading: docx.HeadingLevel.HEADING_3,
                    spacing: { before: 300, after: 200 }
                }));
            } else if (tagName === 'ul' || tagName === 'ol') {
                const listItems = element.querySelectorAll('li');
                listItems.forEach(function(li) {
                    paragraphs.push(new docx.Paragraph({
                        text: li.textContent,
                        bullet: { level: 0 },
                        spacing: { after: 100 }
                    }));
                });
            } else if (tagName === 'p') {
                const textRuns = [];
                if (element.children.length === 0) {
                    textRuns.push(new docx.TextRun({ text: text }));
                } else {
                    processInlineElements(element, textRuns);
                }
                paragraphs.push(new docx.Paragraph({
                    children: textRuns.length > 0 ? textRuns : [new docx.TextRun({ text: text })],
                    spacing: { after: 200 }
                }));
            } else if (tagName === 'blockquote') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    italics: true,
                    indent: { left: 720 },
                    spacing: { after: 200 },
                    border: { left: { color: 'CCCCCC', size: 6, style: docx.BorderStyle.SINGLE } }
                }));
            } else if (tagName === 'code') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: 'F5F5F5' },
                    spacing: { after: 100 }
                }));
            } else if (tagName === 'pre') {
                paragraphs.push(new docx.Paragraph({
                    text: text,
                    font: 'Courier New',
                    shading: { type: docx.ShadingType.SOLID, color: '2D2D2D' },
                    color: 'FFFFFF',
                    spacing: { after: 200 }
                }));
            } else {
                paragraphs.push(new docx.Paragraph({ text: text, spacing: { after: 200 } }));
            }
        }
        return paragraphs;
    }

    function processInlineElements(element, textRuns) {
        for (let j = 0; j < element.childNodes.length; j++) {
            const node = element.childNodes[j];
            if (node.nodeType === Node.TEXT_NODE) {
                textRuns.push(new docx.TextRun({ text: node.textContent }));
            } else if (node.nodeType === Node.ELEMENT_NODE) {
                const tagName = node.tagName.toLowerCase();
                const nodeText = node.textContent || '';
                if (tagName === 'strong' || tagName === 'b') {
                    textRuns.push(new docx.TextRun({ text: nodeText, bold: true }));
                } else if (tagName === 'em' || tagName === 'i') {
                    textRuns.push(new docx.TextRun({ text: nodeText, italics: true }));
                } else if (tagName === 'u') {
                    textRuns.push(new docx.TextRun({ text: nodeText, underline: {} }));
                } else if (tagName === 'code') {
                    textRuns.push(new docx.TextRun({
                        text: nodeText,
                        font: 'Courier New',
                        shading: { type: docx.ShadingType.SOLID, color: 'F0F0F0' }
                    }));
                } else if (tagName === 'a') {
                    textRuns.push(new docx.TextRun({ text: nodeText, color: '0066CC', underline: {} }));
                } else {
                    processInlineElements(node, textRuns);
                }
            }
        }
    }

    function downloadSessionWord() {
        if (typeof docx === 'undefined' || typeof saveAs === 'undefined') {
            alert('Las librerías para exportar Word aún se están cargando. Espera unos segundos e inténtalo de nuevo.');
            return;
        }
        const chatMessages = chatDisplay.querySelectorAll('.user-message, .bot-message, .system-message');
        const children = [];
        children.push(new docx.Paragraph({
            text: 'Sesión de Chat (documento PDF)',
            heading: docx.HeadingLevel.HEADING_1,
            alignment: docx.AlignmentType.CENTER,
            spacing: { after: 400 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Documento: ', bold: true }),
                new docx.TextRun({ text: PDF_NAME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Tema del chatbot: ', bold: true }),
                new docx.TextRun({ text: CHATBOT_THEME })
            ],
            spacing: { after: 100 }
        }));
        children.push(new docx.Paragraph({
            children: [
                new docx.TextRun({ text: 'Modelo: ', bold: true }),
                new docx.TextRun({ text: MODEL })
            ],
            spacing: { after: 200 }
        }));
        children.push(new docx.Paragraph({
            text: '________________________________________________________________________________________________',
            spacing: { after: 400 }
        }));

        chatMessages.forEach(function(msg) {
            if (msg.classList.contains('system-message')) {
                children.push(new docx.Paragraph({
                    text: msg.textContent,
                    italics: true,
                    alignment: docx.AlignmentType.CENTER,
                    spacing: { after: 200 },
                    color: '666666'
                }));
            } else if (msg.classList.contains('user-message')) {
                const ub = msg.querySelector('.user-bubble');
                const userText = ub ? ub.textContent.trim() : msg.textContent.replace(/^Usuario:\s*/i, '').trim();
                children.push(new docx.Paragraph({
                    children: [
                        new docx.TextRun({ text: 'Usuario: ', bold: true, color: '0066CC' }),
                        new docx.TextRun({ text: userText })
                    ],
                    spacing: { after: 200 },
                    alignment: docx.AlignmentType.RIGHT,
                    shading: { type: docx.ShadingType.SOLID, color: 'E3F2FD' }
                }));
            } else if (msg.classList.contains('bot-message')) {
                const botBubble = msg.querySelector('.message-bubble');
                if (botBubble) {
                    const contentDiv = botBubble.querySelector('.tex2jax_process') || botBubble.querySelector('div[style*="margin-top:5px"]');
                    const modelInfoEl = botBubble.querySelector('div[style*="font-size:0.8em"]');
                    const modelInfo = modelInfoEl ? modelInfoEl.textContent : '';
                    if (contentDiv) {
                        const formatted = processHtmlToDocx(contentDiv.innerHTML);
                        formatted.forEach(function(paragraph) { children.push(paragraph); });
                        if (modelInfo) {
                            children.push(new docx.Paragraph({
                                children: [new docx.TextRun({ text: modelInfo, italics: true, size: 20, color: '666666' })],
                                spacing: { after: 200 }
                            }));
                        }
                    } else {
                        let plain = botBubble.textContent || '';
                        if (modelInfo) plain = plain.split(modelInfo).join('').trim();
                        plain = plain.replace(/^Chatbot:\s*/i, '').trim();
                        children.push(new docx.Paragraph({ text: plain, spacing: { after: 200 } }));
                    }
                }
            }
        });

        const doc = new docx.Document({
            sections: [{ properties: {}, children: children }]
        });
        docx.Packer.toBlob(doc).then(function(blob) {
            saveAs(blob, 'Sesion_Chat_' + Date.now() + '.docx');
        });
    }

    sendButton.addEventListener('click', sendQuestion);
    questionInput.addEventListener('keypress', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendQuestion(); } });
    document.getElementById('download-html-session-btn').addEventListener('click', downloadSessionHtml);
    document.getElementById('download-word-session-btn').addEventListener('click', downloadSessionWord);
    function resetEmbeddedChat() {
        chatHistory = [];
        chatDisplay.innerHTML = '';
        questionInput.value = '';
        addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
        questionInput.focus({ preventScroll: true });
    }
    document.getElementById('new-chat-session-btn').addEventListener('click', resetEmbeddedChat);
    addMsg('Documento "' + PDF_NAME + '" listo. Solo respondo preguntas sobre este contenido o el tema «' + CHATBOT_THEME + '». ¡Puedes empezar!', 'system');
    questionInput.focus({ preventScroll: true });
</script>
