iva.\"},{\"question\":\"Estás diseñando una escala para 'Programar un PLC básico'. Necesitas un descriptor para el criterio 'Implementación de lógica de control' en el nivel 'Experto'.\",\"expected\":\"Implementa una lógica de control eficiente, optimizada y robusta, considerando excepciones y posibles mejoras futuras.\",\"patterns\":[\"Desarrolla programas PLC con lógica avanzada, minimizando recursos y anticipando escenarios complejos.\"],\"feedback\":\"Tu descriptor para 'Experto' en 'Implementación de lógica de control' es excelente: 'Implementa una lógica de control eficiente, optimizada y robusta, considerando excepciones y posibles mejoras futuras'. Destaca la calidad, previsión y complejidad, características de un experto.\"},{\"question\":\"En la evaluación de la competencia 'Realizar soldadura TIG de piezas de acero inoxidable', ¿cuál sería un criterio de desempeño relacionado con la seguridad?\",\"expected\":\"Aplicación de medidas de seguridad y protección personal.\",\"patterns\":[\"Uso correcto de EPIs y equipos de protección, Preparación segura del área de trabajo.\"],\"feedback\":\"El criterio 'Aplicación de medidas de seguridad y protección personal' es fundamental y correctamente identificado. La seguridad es un pilar en cualquier competencia técnica y debe ser evaluada explícitamente.\"},{\"question\":\"Si una escala de valoración utiliza solo dos niveles ('No competente', 'Competente'), ¿qué riesgo principal presenta en la evaluación formativa y cómo se podría mitigar?\",\"expected\":\"Riesgo: Dificultad para proporcionar retroalimentación detallada y guiar el aprendizaje. Mitigación: Añadir un nivel intermedio ('En desarrollo') o utilizar descriptores muy detallados para cada nivel.\",\"patterns\":[\"Riesgo: Poca granularidad para identificar avances. Mitigación: Incluir descriptores con indicadores de progreso dentro de cada nivel.\"],\"feedback\":\"Correcto. El principal riesgo de una escala binaria es la falta de granularidad para ofrecer feedback constructivo. Añadir un nivel intermedio o hacer los descriptores muy específicos son excelentes formas de mitigar este problema, permitiendo un seguimiento más preciso del aprendizaje.\"}]},\"criteria\":[\"Identificación de criterios de desempeño observables.\",\"Claridad y especificidad de los descriptores de nivel.\",\"Coherencia entre los niveles de dominio y los descriptores.\",\"Adecuación de la escala a la competencia evaluada.\"],\"nextChallenge\":\"En la próxima sesión, practicaremos la aplicación de estas escalas de valoración en casos prácticos y analizaremos cómo usar los resultados para proporcionar retroalimentación constructiva a los estudiantes.\",\"modelProblem\":\"En un programa de formación para 'Técnico en Instalaciones Eléctricas', se necesita evaluar la competencia 'Realizar el conexionado de cuadros eléctricos de baja tensión'. Diseña una escala de valoración con 3 criterios de desempeño y 4 niveles de dominio para esta competencia.\",\"modelResult\":\"La escala de valoración para 'Realizar el conexionado de cuadros eléctricos de baja tensión' quedaría estructurada con los criterios y niveles definidos, y descriptores claros para cada intersección. Por ejemplo, para 'Identificación y preparación de componentes', nivel 'Avanzado': 'Selecciona, verifica y prepara todos los componentes de forma eficiente, anticipando posibles problemas y optimizando recursos'.\",\"guidedProblem\":\"Ahora, diseñemos una escala de valoración para la competencia 'Elaborar un plan de mantenimiento preventivo para maquinaria industrial' con 3 criterios y 3 niveles de dominio: 'No logrado', 'En desarrollo', 'Logrado'.\"}"),document.getElementById("app"));</script></body></html>
