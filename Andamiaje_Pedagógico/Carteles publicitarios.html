o riguroso del tiempo de exposición y de la tasa de lectura aplicable a cada entorno.\",\"Dimensionamiento de tipografía acorde con la distancia visual crítica.\",\"Distribución espacial equilibrada entre elemento gráfico, texto y llamada a la acción.\",\"Síntesis léxica y concisión textual orientadas a la rápida asimilación publicitaria.\"],\"nextChallenge\":\"Diseñar un boceto descriptivo de cartel de concientización ambiental indicando: titular con menos de 8 palabras, justificación de colores por contraste cromático y distribución espacial del logotipo institucional.\",\"modelProblem\":\"Una marca de jugos naturales instalará un cartel publicitario exterior en una autopista donde los vehículos transitan a \\\\( 72\\\\text{ km/h} \\\\) (\\\\( 20\\\\text{ m/s} \\\\)). La distancia de visibilidad despejada hacia el panel es de \\\\( 100\\\\text{ metros} \\\\). El cartel mide \\\\( 6\\\\text{ m} \\\\times 3\\\\text{ m} \\\\) (\\\\( 18\\\\text{ m}^2 \\\\)). Se solicita determinar: 1) el tiempo de exposición visual, 2) la cantidad máxima de palabras si la tasa de lectura vehicular segura es de \\\\( 2.5\\\\text{ palabras/segundo} \\\\), 3) la altura mínima de la tipografía principal según la regla de legibilidad de \\\\( 1\\\\text{ cm} \\\\) por cada \\\\( 3\\\\text{ m} \\\\) de distancia, y 4) el área asignada a la imagen si se destina el \\\\( 60\\\\% \\\\) del soporte visual.\",\"modelResult\":\"Tiempo de exposición: \\\\( 5\\\\text{ s} \\\\); límite textual: \\\\( 12\\\\text{ palabras} \\\\); altura tipográfica mínima: \\\\( 33.33\\\\text{ cm} \\\\); área de imagen: \\\\( 10.8\\\\text{ m}^2 \\\\).\",\"guidedProblem\":\"Una empresa de telefonía diseña un cartel publicitario para una avenida urbana donde los automóviles circulan a \\\\( 54\\\\text{ km/h} \\\\) (equivalente a \\\\( 15\\\\text{ m/s} \\\\)). La distancia de visibilidad continua hacia el cartel es de \\\\( 90\\\\text{ metros} \\\\) y el soporte mide \\\\( 4\\\\text{ m} \\\\times 2.5\\\\text{ m} \\\\) (s
