$('#scPage').textContent='Nivel '+(cur+1)+' de 4 · '+LV[cur][1];$('#scBar').style.width=(cur+1)*25+'%';$('#scPrev').disabled=cur===0;$('#scNext').disabled=cur===3}
nav.forEach((b,i)=>b.onclick=()=>showLevel(i));$('#scPrev').onclick=()=>showLevel(cur-1);$('#scNext').onclick=()=>showLevel(cur+1);showLevel(0)})(JSON.parse("{\"title\":\"Verificación de la Confiabilidad de Fuentes Digitales\",\"introduction\":\"En la era digital, estamos constantemente expuestos a una enorme cantidad de información. Saber cómo discernir qué fuentes son confiables es una habilidad crucial para aprender, investigar y formarse opiniones fundamentadas. Esta lección te guiará para desarrollar un pensamiento crítico y herramientas que te permitirán evaluar la credibilidad de la información que encuentras en línea.\",\"priorKnowledge\":[\"Comprensión básica de la navegación web y motores de búsqueda.\",\"Conocimiento de la existencia de diferentes tipos de sitios web (noticias, blogs, enciclopedias, sitios académicos).\"],\"objective\":\"Aplicar un método sistemático para evaluar la confiabilidad de una fuente de información digital, identificando criterios clave y utilizando herramientas de verificación.\",\"modelExample\":[{\"text\":\"1. Identificar el tipo de fuente y su propósito: El sitio 'VerdadOcultaBlog.com' sugiere un blog personal o de opinión. Al hacer clic en 'Acerca de nosotros' (si existe), se revela que el autor es un 'investigador independiente' sin afiliación académica ni publicaciones revisadas por pares.\",\"why\":\"Determinar el tipo de fuente y su propósito inicial es el primer paso. Un blog personal, especialmente con un nombre como 'VerdadOcultaBlog', no suele tener el mismo nivel de rigor académico o periodístico que una institución reconocida. La falta de credenciales claras del autor es una señal de alerta.\"},{\"text\":\"2. Evaluar la autoridad del autor y la organización: Se realiza una búsqueda en Google de 'VerdadOcultaBlog.com' y del nombre del 'investigador independiente'. Los resultados no arrojan ninguna publicación científica, afiliación universitaria o reconocimiento en el campo de la biología marina o la climatología. En cambio, aparecen otros blogs y foros que discuten teorías conspirativas.\",\"why\":\"La autoridad es crucial. Un experto reconocido en el campo suele tener credenciales académicas, publicaciones en revistas arbitradas o afiliaciones con instituciones de prestigio. La ausencia de estas credenciales y la asociación con teorías conspirativas disminuyen drásticamente la credibilidad de la fuente.\"},{\"text\":\"3. Verificar las referencias y evidencias citadas: El artículo de 'VerdadOcultaBlog.com' menciona 'estudios recientes' pero no enlaza a ninguno específico, ni proporciona nombres de autores, títulos de publicaciones o fechas. Las 'pruebas' presentadas son fotos de arrecifes de coral saludables sin contexto temporal ni geográfico.\",\"why\":\"Una fuente confiable debe citar sus referencias de manera clara y verificable (enlaces a estudios, nombres de revistas, DOI, etc.). La ausencia de estas referencias o la presentación de evidencia anecdótica o sin contexto son indicadores de falta de rigor y pueden ser un intento de manipulación.\"},{\"text\":\"4. Contrastar la información con fuentes reconocidas: Se busca en Google 'impacto del cambio climático arrecifes de coral' y se priorizan resultados de instituciones como la NASA, NOAA, IPCC, universidades o revistas científicas como Nature o Science. Estas fuentes coinciden en que el calentamiento global y la acidificación oceánica son amenazas significativas para los arrecifes de coral, lo que contradice directamente la afirmación de 'VerdadOcultaBlog.com'.\",\"why\":\"La contrastación es un pilar de la verificación. Si una información crucial difiere significativamente de lo que dicen múltiples fuentes reconocidas y expertas en el campo, es muy probable que la fuente original sea poco fiable o esté desinformando. Este paso es fundamental para detectar la desinformación.\"}],\"guidedSteps\":[{\"question\":\"¿Cuál sería tu primer paso para evaluar la fuente 'SaludNaturalHoy.info'?\",\"expected\":\"Identificar el tipo de sitio y su propósito.\",\"patterns\":[\"ver qué tipo de sitio es\",\"mirar si es un blog o de noticias\",\"revisar el 'Acerca de nosotros'\"],\"feedback\":\"¡Excelente inicio! Entender la naturaleza del sitio nos da las primeras pistas sobre su posible rigor. Un sitio como 'SaludNaturalHoy.info' ya sugiere un enfoque en bienestar alternativo, lo cual no siempre se basa en evidencia científica.\",\"wrongFeedback\":\"Ese es un buen punto, pero antes de profundizar en la información, es fundamental entender el contexto general de la fuente. ¿Quién está detrás de ella y con qué propósito?\",\"hints\":[\"Piensa en la primera impresión que te da el nombre del sitio.\",\"¿Hay alguna sección en la web que te diga quiénes son o qué hacen?\"]},{\"question\":\"Después de identificar que 'SaludNaturalHoy.info' es un blog de consejos de salud alternativa sin autores médicos citados, ¿qué harías para verificar la autoridad de la información sobre la cura del cáncer?\",\"expected\":\"Buscar credenciales del autor y la organización, y evidencia científica externa.\",\"patterns\":[\"buscar quién escribe el artículo\",\"ver si tienen títulos médicos o científicos\",\"investigar si el sitio tiene respaldo de instituciones de salud\",\"buscar si hay estudios que respalden lo que dicen en revistas médicas\"],\"feedback\":\"¡Muy bien! La autoridad de quien presenta la información es clave en temas de salud. En este caso, la falta de credenciales médicas o científicas reconocidas, y la ausencia de respaldo institucional, son señales de alerta importantes.\",\"wrongFeedback\":\"Si bien es bueno buscar testimonios, estos no son evidencia científica. En temas de salud, la autoridad se basa en conocimientos y reconocimientos formales. ¿Qué tipo de respaldo buscarías para una afirmación tan seria?\",\"hints\":[\"¿Quiénes son las personas más indicadas para hablar de curas para el cáncer?\",\"¿Qué tipo de organizaciones se dedican a la investigación y tratamiento del cáncer?\",\"¿Cómo se validan los tratamientos médicos en general?\"]},{\"question\":\"Supongamos que el blog de 'SaludNaturalHoy.info' cita un estudio, pero solo menciona 'un estudio de la Universidad X' sin enlace ni fecha. ¿Cómo verificarías la existencia y veracidad de ese supuesto estudio?\",\"expected\":\"Buscar el estudio específico en bases de datos científicas o en el sitio web de la Universidad X, verificando autores, título y fecha.\",\"patterns\":[\"buscar 'vinagre de manzana cáncer universidad x' en Google Scholar\",\"ir a la web de la Universidad X y buscar publicaciones\",\"buscar en PubMed o Scopus\",\"intentar encontrar el nombre de los investigadores si lo mencionan\"],\"feedback\":\"¡Correcto! Una cita vaga sin datos específicos es sospechosa. Buscar activamente el estudio en fuentes fiables y académicas es el paso esencial para confirmar su existencia y su contenido real. Si no se encuentra, es probable que la cita sea inventada o malinterpretada.\",\"wrongFeedback\":\"Creer sin verificar es un error común. Aunque el blog lo cite, no significa que sea real o que diga lo que el blog afirma. ¿Dónde buscarías pruebas irrefutables de la existencia de un estudio científico?\",\"hints\":[\"¿Cómo se identifican los estudios científicos de manera única?\",\"¿Existen 'bibliotecas' digitales de artículos científicos?\",\"Si la universidad realmente realizó un estudio así, ¿dónde lo publicaría?\"]}],\"assisted\":{\"question\":\"Has encontrado un artículo sobre los beneficios de la meditación para reducir el estrés en un sitio web llamado 'BienestarZen.org'. El artículo no tiene autor específico, pero el sitio dice estar 'dedicado a la difusión de la sabiduría ancestral'. ¿Qué herramienta digital específica usarías para verificar si 'BienestarZen.org' es una fuente con reputación en el ámbito de la salud mental o el bienestar?\",\"expected\":\"Google Scholar o PubMed.\",\"hints\":[\"Piensa en sitios que indexan estudios y artículos científicos.\",\"¿Qué bases de datos usan los investigadores o estudiantes para encontrar publicaciones académicas?\",\"No es un motor de búsqueda general, sino uno especializado en ciencia.\"],\"patterns\":[\"Google Scholar\",\"PubMed\",\"bases de datos de investigación\",\"Scopus\"],\"feedback\":\"Excelente elección. Herramientas como Google Scholar o PubMed son ideales para buscar si el sitio o las ideas que promueve tienen respaldo en la investigación científica revisada por pares, lo que es clave para evaluar su reputación en temas de salud y bienestar. Si no aparecen en estas búsquedas, su 'sabiduría ancestral' no tiene respaldo científico.\",\"wrongFeedback\":\"Aunque Google generalista puede darte información superficial, para verificar la reputación académica o científica de una fuente en el ámbito de la salud, necesitas herramientas más especializadas. ¿Dónde buscarías artículos de investigación o publicaciones científicas?\"},\"autonomous\":{\"question\":\"\",\"challenges\":[{\"question\":\"Estás leyendo un artículo en Facebook que afirma que la vitamina C en dosis altas cura la gripe común en 24 horas. El artículo enlaza a un blog personal. Diseña una estrategia completa, paso a paso, para verificar la confiabilidad de esta información y la fuente. Incluye al menos tres criterios de evaluación y cómo los aplicarías.\",\"expected\":\"Evaluación de la fuente (autoridad, propósito, citas), búsqueda de consenso médico (OMS, Mayo Clinic), búsqueda de estudios científicos (Google Scholar).\",\"patterns\":[],\"feedback\":\"Una estrategia sólida debe incluir: 1. **Análisis de la fuente**: ¿Quién es el autor del blog? ¿Tiene credenciales médicas? ¿Cuál es el propósito del blog (informativo, comercial)? ¿Cita fuentes científicas verificables? 2. **Contrastación con fuentes autorizadas**: Buscar información sobre la vitamina C y la gripe en sitios de organizaciones de salud reconocidas (OMS, CDC, Mayo Clinic). 3. **Búsqueda de evidencia científica**: Usar Google Scholar o PubMed para buscar ensayos clínicos que respalden o refuten la afirmación. Si la información del blog contradice el consenso médico y no hay estudios rigurosos que la respalden, es probable que no sea confiable.\"},{\"question\":\"Encuentras una infografía viral en Instagram que muestra estadísticas impactantes sobre el desperdicio de alimentos a nivel mundial. La infografía no tiene ninguna fuente citada. ¿Qué pasos seguirías para intentar verificar la validez de esas estadísticas sin que la infografía te dé pistas directas?\",\"expected\":\"Identificación de palabras clave, búsqueda inversa de imagen, búsqueda de organizaciones reconocidas (FAO, ONU, ONG ambientales), comparación de cifras.\",\"patterns\":[],\"feedback\":\"Para verificar una infografía sin fuentes: 1. **Extraer palabras clave**: Identifica los datos clave ('desperdicio alimentos mundial', 'toneladas', 'porcentaje'). 2. **Búsqueda en motores de búsqueda**: Usa esas palabras clave junto con términos como 'estadísticas', 'informe', 'datos' para encontrar fuentes primarias. 3. **Priorizar fuentes oficiales**: Busca informes de organizaciones internacionales (FAO, Programa de Naciones Unidas para el Medio Ambiente), gobiernos o universidades. 4. **Comparar cifras**: Coteja las estadísticas encontradas con las de la infografía. La falta de concordancia o la ausencia total de datos similares en fuentes confiables es una señal de alerta.\"},{\"question\":\"Un artículo de noticias de un sitio web desconocido ('NoticiasExpress24.com') afirma que un nuevo impuesto afectará gravemente a tu sector laboral. El artículo está fechado hace tres días. ¿Cómo usarías herramientas digitales para evaluar la actualidad y la exactitud de esta noticia, considerando que es un tema sensible para ti?\",\"expected\":\"Búsqueda en medios de comunicación principales, consulta de boletines oficiales, verificación de fecha y evolución de la noticia.\",\"patterns\":[],\"feedback\":\"Para evaluar la actualidad y exactitud: 1. **Búsqueda en medios reconocidos**: Busca el mismo tema ('nuevo impuesto [tu sector]') en periódicos de circulación nacional o agencias de noticias reconocidas. 2. **Consulta de fuentes oficiales**: Revisa el sitio web del gobierno (ministerio de hacienda, boletín oficial) para verificar la promulgación de la ley o el impuesto. 3. **Atención a la fecha**: Asegúrate de que las noticias encontradas sean recientes y reflejen la situación actual. A veces, las noticias 'nuevas' son en realidad refritos de eventos pasados. 4. **Análisis de sesgo**: Compara el tono y la presentación de la noticia en diferentes medios para identificar posibles sesgos en 'NoticiasExpress24.com'.\"},{\"question\":\"Estás investigando un tema histórico y encuentras una publicación en un foro de discusión que presenta 'nuevas revelaciones' sobre un evento clave. El usuario que publica no revela su identidad, pero su mensaje es muy detallado. ¿Qué estrategia seguirías para determinar si esta 'nueva información' tiene alguna base histórica creíble, a pesar de la naturaleza de la fuente?\",\"expected\":\"Identificación de datos clave (nombres, fechas, lugares, documentos), búsqueda de referencias bibliográficas, verificación de consenso académico histórico.\",\"patterns\":[],\"feedback\":\"Para evaluar 'nuevas revelaciones' históricas de una fuente no académica: 1. **Extraer datos clave**: Identifica nombres de personas, lugares, fechas específicas o menciones de documentos o archivos. 2. **Búsqueda de referencias**: Si el usuario menciona alguna fuente (aunque sea vaga), intenta buscarla en bases de datos académicas o bibliotecas. 3. **Búsqueda de consenso académico**: Consulta libros de historia, artículos de revistas académicas o sitios web de universidades y museos para ver qué dicen los historiadores expertos sobre ese evento. Si la 'nueva información' contradice radicalmente el consenso sin pruebas contundentes y verificables (nuevos documentos, hallazgos arqueológicos validados), es muy probable que sea una especulación o desinformación. El anonimato y el foro de discusión son señales de baja credibilidad para temas históricos serios.\"},{\"question\":\"Te llega un correo electrónico con una cadena de mensajes alarmantes sobre una nueva 'pandemia' causada por un virus desconocido, instándote a compartirlo urgentemente. El correo no tiene remitente claro y el contenido parece sensacionalista. ¿Cómo utilizarías tus habilidades digitales y pensamiento crítico para actuar de manera responsable ante esta situación?\",\"expected\":\"No compartir, buscar fuentes oficiales de salud (OMS, CDC), verificar la veracidad del correo electrónico (hoax-buster, verificación de bulos), informar el correo como spam/phishing.\",\"patterns\":[],\"feedback\":\"Ante un correo alarmante y sensacionalista: 1. **No compartir**: Es la primera y más importante acción para evitar la propagación de desinformación o pánico. 2. **Buscar fuentes oficiales**: Consulta directamente los sitios web de organizaciones de salud globales (OMS) o nacionales (Ministerio de Salud, CDC) para verificar si existe tal pandemia. 3. **Verificación de bulos (hoax-busters)**: Usa sitios especializados en desmentir bulos y fakes (como Snopes, Maldita.es) para ver si el correo ya ha sido identificado como engaño. 4. **Reportar el correo**: Márcalo como spam o phishing para ayudar a tu proveedor de correo a identificar y bloquear mensajes similares. Un correo sin remitente claro, con lenguaje alarmista y sin enlaces a fuentes verificables, es una señal inequívoca de desinformación o scam.\"}]},\"criteria\":[\"Identificación correcta del tipo y propósito de la fuente.\",\"Evaluación de la autoridad y credenciales del autor/organización.\",\"Habilidad para verificar referencias y evidencia citada.\",\"Capacidad para contrastar información con fuentes reconocidas y expertas.\",\"Uso apropiado de herramientas de búsqueda y bases de datos.\",\"Reconocimiento de limitaciones de la IA y el sesgo potencial.\",\"Formulación clara de preguntas de verificación.\"],\"nextChallenge\":\"Ahora que sabes cómo verificar la confiabilidad de las fuentes, podrías explorar cómo identificar y mitigar los sesgos en la información que encuentras en línea.\",\"modelProblem\":\"Estás investigando sobre el impacto del cambio climático en los arrecifes de coral y encuentras un artículo en un sitio web llamado 'VerdadOcultaBlog.com' que afirma que los arrecifes de coral están creciendo más rápido que nunca debido al aumento de CO2. ¿Cómo verificarías la confiabilidad de esta fuente y la información que presenta?\",\"modelResult\":\"La fuente 'VerdadOcultaBlog.com' no es confiable. Carece de autoridad reconocida, no presenta evidencias verificables y su información contradice el consenso científico establecido por múltiples fuentes expertas y rigurosas. Por lo tanto, la afirmación sobre el crecimiento acelerado de los arrecifes de coral debido al CO2 es falsa según la evidencia actual.\",\"guidedProblem\":\"Un amigo comparte contigo en redes sociales un 'estudio impactante' de un sitio llamado 'SaludNaturalHoy.info' que afirma que consumir vinagre de manzana cura el cáncer en etapas tempranas. ¿Cómo procederías para verificar la veracidad de esta afirmación y la confiabilidad de la fuente?\"}"),document.getElementById("app"));</script></body></html>
