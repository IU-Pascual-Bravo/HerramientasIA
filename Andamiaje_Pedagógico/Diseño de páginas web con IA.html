nav.forEach((b,i)=>b.onclick=()=>showLevel(i));$('#scPrev').onclick=()=>showLevel(cur-1);$('#scNext').onclick=()=>showLevel(cur+1);showLevel(0)})(JSON.parse("{\"title\":\"Diseño de páginas web con IA\",\"introduction\":\"La inteligencia artificial está transformando la forma en que creamos y gestionamos contenido digital, incluyendo el diseño web. Aprender a utilizar estas herramientas de forma efectiva te permitirá agilizar procesos y explorar nuevas posibilidades creativas.\",\"priorKnowledge\":[\"Conceptos básicos de diseño web (estructura, elementos visuales).\",\"Funcionamiento general de las herramientas de IA (prompts, generación de contenido).\"],\"objective\":\"Aplicar herramientas de IA para generar un prototipo básico de página web, evaluando y personalizando el resultado para que cumpla con los requisitos específicos del usuario.\",\"modelExample\":[{\"text\":\"1. **Definir el propósito y las secciones clave**: Para 'El Rincón del Lector', el propósito es mostrar novedades y permitir el contacto. Las secciones clave serían: Inicio (bienvenida y últimas novedades), Catálogo (muestra de libros), y Contacto (formulario y datos de ubicación).\",\"why\":\"Este paso es fundamental para organizar la información y asegurar que la IA genere un esqueleto funcional que cubra las necesidades básicas del negocio.\"},{\"text\":\"2. **Formular el prompt inicial para la IA**: 'Crea el esqueleto de una página web para una librería llamada 'El Rincón del Lector'. Debe tener secciones para 'Inicio', 'Novedades', y 'Contacto'. El estilo debe ser cálido, acogedor y fácil de navegar, con un formulario de contacto simple. No incluir contenido de libros específico, solo marcadores de posición.'\",\"why\":\"Un prompt detallado ayuda a la IA a comprender las necesidades del diseño y las funcionalidades requeridas. Especificar 'esqueleto' y 'marcadores de posición' evita que la IA rellene con contenido genérico no deseado inicialmente.\"},{\"text\":\"3. **Evaluar el prototipo generado**: Supongamos que la IA generó una estructura con un menú de navegación, un banner inicial, una sección de 'Novedades' con tarjetas de ejemplo y una sección de 'Contacto' con campos de texto. Verifico que las secciones estén presentes y que el estilo visual (colores, fuentes) se alinee con 'cálido y acogedor'.\",\"why\":\"Es crucial revisar si el resultado de la IA cumple con los requisitos iniciales. La evaluación crítica permite identificar si hay elementos faltantes o si el estilo no es el deseado, antes de proceder a la personalización.\"},{\"text\":\"4. **Solicitar ajustes específicos**: Si el formulario de contacto carece de un campo para el número de teléfono, puedo pedirle a la IA: 'Añade un campo de 'Teléfono' opcional al formulario de contacto existente.' O si los colores son muy fríos: 'Ajusta la paleta de colores para usar tonos más cálidos y terrosos, como beige y marrón claro, para el fondo y la tipografía.'\",\"why\":\"La iteración es clave en el uso de la IA. Pequeños ajustes basados en la evaluación inicial permiten refinar el diseño sin necesidad de empezar de nuevo, optimizando el tiempo y la calidad del resultado.\"}],\"guidedSteps\":[{\"question\":\"¿Cuál sería el primer paso para usar una IA para diseñar esta página web, pensando en los requisitos del 'Café del Parque'?\",\"expected\":\"Definir secciones clave\",\"patterns\":[\"Identificar propósito y secciones\",\"Estructurar la información\",\"Listar las partes de la web\"],\"feedback\":\"¡Exacto! El primer paso es tener claro qué información queremos presentar y cómo la vamos a organizar. ¿Qué secciones principales identificarías para el 'Café del Parque'?\",\"wrongFeedback\":\"No te preocupes, es un buen punto de partida. Antes de ir a la herramienta, piensa en qué información esencial debe tener la página web para sus clientes. ¿Qué querría ver un cliente que visita la web del café?\",\"hints\":[\"Piensa en lo básico que un cliente buscaría en la web de un café.\",\"¿Qué tipo de información proporciona un café a sus clientes?\"]},{\"question\":\"Ahora que tenemos las secciones (Inicio, Menú, Sobre Nosotros, Contacto), ¿cómo formularías un prompt inicial para una IA que cree un prototipo con un diseño moderno y minimalista, destacando fotos, para 'Café del Parque'?\",\"expected\":\"Crea una página web para 'Café del Parque' con secciones: Inicio, Menú (con espacio para fotos), Sobre Nosotros, Contacto. Diseño moderno, minimalista, colores neutros.\",\"patterns\":[\"Genera web para Café del Parque, secciones: Inicio, Menú (imágenes), Nosotros, Contacto. Estilo moderno, minimalista, neutro.\",\"Diseña prototipo web para Café del Parque. Incluye Inicio, Menú con fotos, Sobre Nosotros, Contacto. Busca un look moderno, minimalista y colores neutros.\"],\"feedback\":\"¡Muy bien! Has incluido todos los elementos clave: el nombre del negocio, las secciones, la necesidad de espacio para fotos y el estilo deseado. Esto le da a la IA una base sólida para empezar.\",\"wrongFeedback\":\"Falta algún detalle importante para que la IA entienda bien lo que buscas. Recuerda incluir el nombre del negocio, todas las secciones y los detalles del estilo visual. ¿Qué elementos podrías añadir para ser más específico?\",\"hints\":[\"¿Qué elementos son imprescindibles en un prompt?\",\"¿Cómo le dirías a la IA que deje espacio para imágenes de los productos?\",\"¿Qué palabras clave usarías para describir el estilo visual deseado?\"]},{\"question\":\"Después de que la IA genere el prototipo, ¿qué harías para asegurarte de que cumple con los requisitos del 'Café del Parque'?\",\"expected\":\"Evaluar el prototipo, verificar secciones, estilo, y espacios para fotos.\",\"patterns\":[\"Revisar si están todas las secciones. Ver si el diseño es moderno y minimalista. Comprobar si hay espacio para fotos de menú.\",\"Comparar el resultado con mi prompt inicial y los requisitos del café. Buscar coherencia.\"],\"feedback\":\"Perfecto. La evaluación crítica es fundamental. Siempre debemos comparar lo generado con lo que pedimos y con las necesidades reales del proyecto. Si algo no encaja, ¿qué harías?\",\"wrongFeedback\":\"Si bien es tentador usarlo directamente, es crucial revisarlo antes. ¿En qué te fijarías específicamente para saber si la IA ha interpretado bien tus instrucciones?\",\"hints\":[\"¿Cómo saber si el diseño es 'moderno y minimalista'?\",\"¿Dónde deberían ir las fotos de los productos?\",\"¿Están todas las secciones que pediste?\"]}],\"assisted\":{\"question\":\"Necesitas una página de aterrizaje (landing page) para una campaña de marketing de un nuevo curso online de fotografía. Debe ser atractiva, con un llamado a la acción claro para 'Inscribirse ahora' y un espacio para un video introductorio. El estilo debe ser vibrante y profesional. Utilizando tu herramienta de IA preferida, ¿qué prompt utilizarías para generar el prototipo inicial?\",\"expected\":\"Genera una landing page para un curso online de fotografía. Debe ser vibrante y profesional, con un llamado a la acción 'Inscribirse ahora' y un bloque para un video.\",\"hints\":[\"Piensa en el propósito principal de una landing page.\",\"¿Qué elementos visuales y funcionales son cruciales para el éxito de una campaña?\",\"¿Cómo describirías 'vibrante y profesional' en el contexto de un prompt?\"],\"patterns\":[],\"feedback\":\"¡Excelente prompt! Has capturado todos los elementos clave para que la IA genere una base sólida para tu landing page. Asegúrate de revisar el diseño y la claridad del llamado a la acción una vez que tengas el prototipo.\",\"wrongFeedback\":\"Tu prompt es un buen comienzo, pero podría ser más específico. ¿Qué elementos esenciales de una landing page o del estilo visual estás olvidando mencionar para guiar mejor a la IA?\"},\"autonomous\":{\"question\":\"\",\"challenges\":[{\"question\":\"Un artista local, 'Ana Arte', quiere un portafolio web de una sola página para mostrar sus pinturas. Necesita una galería interactiva, una sección de biografía breve y un formulario de contacto. El diseño debe ser artístico y reflejar su estilo (colores brillantes y formas abstractas). ¿Qué pasos seguirías para crear este portafolio web con IA, y qué prompt inicial usarías?\",\"expected\":\"Pasos: 1. Definir secciones (Galería, Biografía, Contacto). 2. Prompt: Crea un portafolio web de una página para la artista 'Ana Arte'. Incluye galería interactiva, biografía y contacto. Estilo artístico con colores brillantes y formas abstractas.\",\"patterns\":[],\"feedback\":\"Tu plan es muy bueno. La clave es la especificidad en el prompt, especialmente al describir el estilo artístico. Al generar el prototipo, presta atención a cómo la IA interpreta 'formas abstractas' y 'colores brillantes', y ajusta según sea necesario.\"},{\"question\":\"Has utilizado una IA para generar una página web de un restaurante vegano. El prototipo es funcional, pero los colores son demasiado fríos y el tipo de letra no transmite calidez. ¿Qué instrucción le darías a la IA para corregir estos problemas y lograr un ambiente más acogedor en la web?\",\"expected\":\"Cambia la paleta de colores a tonos más cálidos y terrosos, como verdes oliva y beige. Modifica la tipografía por una que transmita una sensación más orgánica y acogedora.\",\"patterns\":[],\"feedback\":\"Excelente. Especificar los tipos de colores y el efecto deseado con la tipografía es crucial para guiar a la IA. Recuerda que puedes incluso sugerir familias tipográficas si tienes alguna en mente.\"},{\"question\":\"Un desarrollador de IA te pide ayuda: ha usado un generador de sitios web con IA, pero el resultado tiene textos genéricos (lorem ipsum) y algunas imágenes de stock que no tienen relación con su proyecto. ¿Qué le recomendarías hacer para personalizar y mejorar el contenido y las imágenes de su sitio web, manteniendo la IA como asistente?\",\"expected\":\"Reemplazar el 'lorem ipsum' con su propio contenido. Sustituir las imágenes de stock con imágenes relevantes de su proyecto o generadas por IA que se ajusten a su necesidad.\",\"patterns\":[],\"feedback\":\"Correcto. La IA es una herramienta de generación de estructura y estilo, pero el contenido final y específico debe ser aportado o curado por el usuario. También podría usar la IA para generar descripciones de sus proyectos específicas, si le proporciona los detalles adecuados.\"},{\"question\":\"Estás evaluando dos prototipos de páginas de inicio generados por IA para una tienda de ropa online. El prototipo A tiene un diseño visualmente atractivo pero un menú de navegación confuso. El prototipo B tiene un menú claro pero un diseño menos moderno. ¿Cuál elegirías como base y cómo lo mejorarías con IA?\",\"expected\":\"Elegiría el prototipo A por su atractivo visual, y pediría a la IA que mejore el menú de navegación para hacerlo más claro y sencillo de usar, indicando los elementos clave.\",\"patterns\":[],\"feedback\":\"Buena elección. Es más fácil pedir a la IA que refine la usabilidad de un elemento específico (el menú) que rehacer todo el estilo visual. Siempre es una buena estrategia construir sobre lo que ya funciona mejor.\"},{\"question\":\"Quieres que tu página web generada por IA sea accesible para personas con discapacidad visual. ¿Qué tipo de instrucciones o peticiones harías a la IA para incorporar principios básicos de accesibilidad en el diseño y el código generado?\",\"expected\":\"Pide a la IA que añada texto alternativo (alt text) a todas las imágenes, que use un contraste de color adecuado entre texto y fondo, y que asegure una estructura HTML semántica.\",\"patterns\":[],\"feedback\":\"Excelente. Enfocarse en el texto alternativo para imágenes, el contraste de color y la semántica HTML son pasos fundamentales para la accesibilidad. Podrías incluso pedirle que genere el sitio con atributos ARIA si la herramienta lo permite.\"}]},\"criteria\":[\"Formulación de prompts claros y detallados.\",\"Capacidad para evaluar críticamente los resultados de la IA.\",\"Habilidad para solicitar ajustes iterativos a la IA.\",\"Comprensión de las limitaciones y fortalezas de la IA en diseño web.\",\"Uso de la IA como asistente y no como sustituto del pensamiento crítico.\"],\"nextChallenge\":\"Ahora que sabes cómo generar prototipos y hacer ajustes, ¿cómo podrías usar la IA para generar contenido de texto (descripciones de productos, posts de blog) para tu página web, y qué precauciones tomarías?\",\"modelProblem\":\"Una pequeña librería local, 'El Rincón del Lector', necesita una página web sencilla para mostrar sus novedades literarias y un formulario de contacto. Quieren un diseño limpio, con tonos cálidos y que sea fácil de navegar. No tienen conocimientos de programación.\",\"modelResult\":\"Un prototipo HTML/CSS básico de la página web de 'El Rincón del Lector' con las secciones solicitadas, un formulario de contacto funcional con campos de nombre, email, mensaje y teléfono, y una paleta de colores cálida y acogedora.\",\"guidedProblem\":\"Un pequeño café llamado 'Café del Parque' necesita una página web para mostrar su menú, la ubicación y un breve 'Sobre nosotros'. Quieren un diseño moderno, minimalista, con colores neutros y que destaque las fotografías de sus productos.\"}"),document.getElementById("app"));</script></body></html>
